<!DOCTYPE html>

<head>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#334155;-webkit-font-smoothing:antialiased}
.app{max-width:430px;margin:0 auto;min-height:100vh;min-height:100dvh;background:#f8fafc;display:flex;flex-direction:column}
.demo{background:#7c2d12;color:#fff;font-size:11.5px;font-weight:700;text-align:center;padding:6px 10px;line-height:1.5}
.demo a{color:#fed7aa}
.top{background:linear-gradient(135deg,#5b21b6,#7c3aed);color:#fff;padding:18px 18px 22px}
.top .hd{display:flex;align-items:center;gap:8px}
.top .hd .lg{font-size:22px}
.top .hd h1{font-size:17px;font-weight:800;flex:1}
.top .hd a{color:#ddd6fe;font-size:12px;text-decoration:underline}
.top .sub{font-size:12.5px;color:#ddd6fe;margin-top:4px}
.body{flex:1;padding:16px 16px 40px}
.sec-t{font-size:14px;font-weight:800;color:#475569;margin:6px 0 10px}
.vcard{border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 2px 10px rgba(15,23,42,.08);margin-bottom:16px}
.vcard .head{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff;padding:16px 18px;position:relative}
.vcard .head .rg{font-size:15px;font-weight:800}
.vcard .head .st{position:absolute;top:14px;right:16px;font-size:11px;font-weight:800;background:rgba(255,255,255,.25);border-radius:8px;padding:3px 9px}
.vcard .head .bal{font-size:28px;font-weight:800;margin-top:10px}
.vcard .head .bal small{font-size:13px;font-weight:700;opacity:.85}
.vcard .head .meta{font-size:11.5px;opacity:.85;margin-top:6px}
.vcard .bd{padding:14px 16px 16px}
.note{background:#f1f5f9;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#475569;line-height:1.6;margin-bottom:10px}
.note b{color:#7c3aed}
.note.warn{background:#fff7ed;color:#9a3412}
.buy{width:100%;min-height:54px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-size:15.5px;font-weight:800;font-family:inherit;cursor:pointer;line-height:1.4;padding:8px}
.buy small{display:block;font-size:11.5px;font-weight:700;opacity:.85}
.use-t{font-size:12.5px;font-weight:800;color:#475569;margin:12px 0 8px}
.use-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.use-row button{min-height:64px;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-family:inherit;cursor:pointer;font-size:12px;font-weight:700;color:#334155;line-height:1.5}
.use-row button b{display:block;font-size:13px;color:#7c3aed}
.use-row button:disabled{opacity:.4;cursor:not-allowed}
.tx{margin-top:12px;border-top:1px dashed #e2e8f0;padding-top:10px}
.tx .t{font-size:12px;font-weight:800;color:#64748b;margin-bottom:6px}
.tx .row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#334155;padding:5px 0}
.tx .row .lb{flex:1}
.tx .row .amt{font-weight:800}
.tx .row .amt.plus{color:#7c3aed}
.tx .row .amt.minus{color:#b91c1c}
.tx .row small{color:#94a3b8}
.recover{width:100%;min-height:46px;border:2px solid #b91c1c;border-radius:12px;background:#fff;color:#b91c1c;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:10px}
.done-b{width:100%;min-height:46px;border:2px solid #7c3aed;border-radius:12px;background:#fff;color:#7c3aed;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:10px}
.empty{text-align:center;color:#64748b;font-size:14px;line-height:1.9;padding:60px 14px}
.empty a{color:#7c3aed;font-weight:800}
.toastP{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.92);color:#fff;font-size:13px;font-weight:700;border-radius:24px;padding:11px 20px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:99}
.toastP.on{opacity:1}
/* 설문 모달 */
.svy{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.svy.on{display:flex}
.svy .bd{background:#fff;border-radius:20px;padding:26px 22px;max-width:360px;width:100%;text-align:center}
.svy .ic{font-size:40px}
.svy h3{font-size:17px;font-weight:800;margin:10px 0 6px;color:#0f172a}
.svy p{font-size:13.5px;color:#475569;line-height:1.7}
.svy .stars{display:flex;justify-content:center;gap:6px;margin:14px 0}
.svy .stars button{font-size:28px;background:none;border:none;cursor:pointer;filter:grayscale(1);transition:.15s}
.svy .stars button.on{filter:none;transform:scale(1.15)}
.svy .ok{width:100%;min-height:50px;border:none;border-radius:12px;background:#7c3aed;color:#fff;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;margin-top:8px}
/* 포인트 카드 · 전환 모달 */
.pt-card{display:flex;align-items:center;gap:12px;background:linear-gradient(135deg,#3b0764,#2e1065);border-radius:18px;padding:16px 18px;margin-bottom:16px;color:#fff;box-shadow:0 2px 10px rgba(15,23,42,.15)}
.pt-card .pi{flex:1}
.pt-card .l{font-size:12.5px;font-weight:800;color:#c4b5fd}
.pt-card .v{font-size:26px;font-weight:800;margin-top:4px}
.pt-card .v small{font-size:14px;font-weight:700;color:#c4b5fd}
.pt-card .d{font-size:11.5px;color:#94a3b8;margin-top:4px}
.pt-card .cv-btn{flex-shrink:0;min-height:56px;border:none;border-radius:12px;background:#fbbf24;color:#451a03;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;padding:0 14px;line-height:1.4}
.vcard .head.cv{background:linear-gradient(135deg,#f59e0b,#d97706)}
.cv-lb{display:block;font-size:13px;font-weight:800;color:#334155;margin:12px 0 6px}
.cv-in{width:100%;min-height:48px;border:2px solid #cbd5e1;border-radius:10px;font-size:15px;padding:8px 12px;font-family:inherit;background:#fff;color:#0f172a}
.cv-in:focus{border-color:#7c3aed;outline:none}
.cv-all{flex-shrink:0;min-height:48px;border:2px solid #7c3aed;border-radius:10px;background:#fff;color:#7c3aed;font-size:13.5px;font-weight:800;font-family:inherit;cursor:pointer;padding:0 14px}
.cv-x{width:100%;min-height:44px;border:none;background:none;color:#64748b;font-size:13.5px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:6px}
/* TOUR ONEPASS 로그인 (관광주민증과 동일 계정) */
.pay-who{font-size:12px;color:#ddd6fe}
.pay-who button{background:none;border:1px solid #c4b5fd;border-radius:8px;color:#f3effd;font-size:11px;font-weight:700;padding:3px 8px;margin-left:6px;font-family:inherit;cursor:pointer}
.pay-login{background:#fff;border-radius:18px;box-shadow:0 2px 10px rgba(15,23,42,.08);padding:26px 22px;text-align:center}
.pay-login .lg2{font-size:22px;font-weight:800;color:#0f172a;letter-spacing:1px}
.pay-login .lg2 span{color:#7c3aed}
.pay-login p{font-size:13px;color:#475569;line-height:1.7;margin:10px 0 16px}
.pay-login .row{display:flex;justify-content:center;gap:10px}
.pay-login .row button{width:52px;height:52px;border-radius:50%;border:none;font-size:20px;font-weight:800;cursor:pointer;font-family:inherit}
.pay-login small{display:block;margin-top:14px;color:#94a3b8;font-size:11.5px}
</style>
</head>
<body>
<div class="app">
  <div class="demo">지역화폐(앱) 구간 프로토타입 · <a href="t50-apply.html">대민시스템(신청)</a> · <a href="t50-admin.html">지자체(관리)</a></div>
  <div class="top">
    <div class="hd"><span class="lg">🪙</span><h1>관광 지역화폐</h1><span class="pay-who" id="payWho"></span><a href="t50-apply.html">신청 화면으로</a></div>
    <div class="sub">반값여행 상품권 발행(개인) · 충전 · 사용 · 환급 충전 · 잔액 회수</div>
  </div>
  <div class="body">
    <div id="pointCard"></div>
    <div class="sec-t">내 반값여행 상품권</div>
    <div id="payList"></div>
    <div id="cvSec" style="display:none">
      <div class="sec-t" style="margin-top:18px">포인트 전환 지역화폐</div>
      <div id="cvList"></div>
    </div>
  </div>
</div>

<div class="toastP" id="payToast"></div>

<!-- 포인트 → 지역화폐 전환 모달 -->
<div class="svy" id="cvModal" role="dialog" aria-modal="true">
  <div class="bd" style="text-align:left">
    <h3 style="text-align:center">🪙 포인트 → 지역화폐 전환</h3>
    <p style="text-align:center">보유 포인트 <b id="cvBal" style="color:#7c3aed">0</b> P · 1P = 1원 (1:1 입금)<br><small>한 번에 최대 100,000P까지 전환 가능</small></p>
    <label class="cv-lb" for="cvRegion">전환할 지역</label>
    <select class="cv-in" id="cvRegion"></select>
    <label class="cv-lb" for="cvAmt">전환할 포인트</label>
    <div style="display:flex;gap:8px">
      <input class="cv-in" id="cvAmt" type="number" inputmode="numeric" min="1" placeholder="예) 1000" oninput="cvHint()" style="flex:1">
      <button class="cv-all" onclick="cvAll()">최대</button>
    </div>
    <div id="cvHint" style="font-size:12.5px;font-weight:700;min-height:20px;margin-top:6px"></div>
    <button class="ok" onclick="cvDo()">지역화폐로 입금하기</button>
    <button class="cv-x" onclick="cvClose()">취소</button>
  </div>
</div>

<!-- 잔액 회수 후 설문조사 (프로세스 마지막 단계) -->
<div class="svy" id="svyModal" role="dialog" aria-modal="true">
  <div class="bd">
    <div class="ic">📋</div>
    <h3>반값여행 만족도 설문</h3>
    <p>여행 지원 기간이 종료되어 잔여 상품권이 회수되었습니다.<br>이번 반값여행은 어떠셨나요?</p>
    <div class="stars" id="svyStars">
      <button onclick="svyPick(1)">⭐</button><button onclick="svyPick(2)">⭐</button>
      <button onclick="svyPick(3)">⭐</button><button onclick="svyPick(4)">⭐</button>
      <button onclick="svyPick(5)">⭐</button>
    </div>
    <button class="ok" onclick="svyDone()">설문 제출</button>
  </div>
</div>

<script src="../site-assets/data.js?v=20260707f"></script>
<script>/* site-c 테스트: 경험치를 지역화폐 전환 가능 포인트와 연동 (초기 100만P, 전환분 차감 반영) */
try{var _pb=JSON.parse(localStorage.getItem("dtidC_pointBal2")||"{}");ACCOUNTS.forEach(function(a){a.exp=(typeof _pb[a.id]==="number")?_pb[a.id]:1000000;});var _u1=ACCOUNTS.filter(function(a){return a.id==="user1";})[0];if(_u1)_u1.name="김관광";}catch(e){}</script>
<script>
/* 대민시스템·관리시스템과 같은 저장소를 공유한다 — 계정별 분리 저장 */
const P_UID=localStorage.getItem('dgtour_user_id')||'guest';
const AP_KEY='dtidC_t50Applies_'+P_UID;
const PT_KEY='dtidC_pointBal2';     /* 사용자별 잔여 포인트 {uid: n} */
const PT_INIT=1000000;              /* 테스트용 초기 지급 포인트 (100만P) */
const CV_MAX=100000;                /* 1회 전환 한도 (10만P) */
const CV_KEY='dtidC_pointWallets_'+P_UID;  /* 포인트 전환 지역화폐 {지역명: {bal, tx[]}} */
/* 예전 공용 키에 남은 데이터는 현재 계정으로 1회 이관 */
try{
  const lg1=localStorage.getItem('dtidC_t50Applies');
  if(lg1&&P_UID!=='guest'){
    const cur=JSON.parse(localStorage.getItem(AP_KEY)||'[]');
    localStorage.setItem(AP_KEY,JSON.stringify(JSON.parse(lg1).concat(cur)));
    localStorage.removeItem('dtidC_t50Applies');
  }
  const lg2=localStorage.getItem('dtidC_pointWallets');
  if(lg2&&P_UID!=='guest'&&!localStorage.getItem(CV_KEY)){
    localStorage.setItem(CV_KEY,lg2);
    localStorage.removeItem('dtidC_pointWallets');
  }
}catch(e){}
const MERCHANTS=[
  {ic:'🏨',nm:'바다뷰 펜션',amt:45000},
  {ic:'🍽',nm:'현지 맛집',amt:28000},
  {ic:'☕',nm:'로컬 카페',amt:7500}
];
let payToastTimer=null;
let svyIdx=-1,svyScore=0;

function pLoad(){try{return JSON.parse(localStorage.getItem(AP_KEY)||'[]');}catch(e){return[];}}
function pSave(l){localStorage.setItem(AP_KEY,JSON.stringify(l));}
function pWon(n){return n.toLocaleString('ko-KR')+'원';}
function pFmt(d){return d?d.replace(/-/g,'.'):'';}
function pToast(m){
  const t=document.getElementById('payToast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(payToastTimer);
  payToastTimer=setTimeout(()=>t.classList.remove('on'),2200);
}
function pWallet(a){
  if(!a.wallet)a.wallet={bal:0,purchased:false,refundCharged:false,recovered:false,tx:[]};
  return a.wallet;
}
function pTx(w,label,amt){
  w.tx.unshift({label:label,amt:amt,ts:new Date().toISOString().slice(5,10).replace('-','.')});
}

/* TOUR ONEPASS 통합 로그인 — 관광주민증(index.html)과 동일한 계정·저장키(dgtour_user_id)를 사용 */
function payLogin(uid){localStorage.setItem('dgtour_user_id',uid);location.reload();}
function payLogout(){localStorage.removeItem('dgtour_user_id');location.reload();}
function payWho(){
  const el=document.getElementById('payWho');
  const u=ptUser();
  el.innerHTML=u?(u.emojiAv+' '+u.name+'님<button onclick="payLogout()">로그아웃</button>'):'';
}
function payLoginView(){
  document.getElementById('payList').innerHTML='';
  document.getElementById('cvSec').style.display='none';
  document.getElementById('pointCard').innerHTML=
    '<div class="pay-login"><div class="lg2">TOUR <span>ONEPASS</span></div>'+
    '<p>투어원패스 통합 로그인 — 디지털 관광주민증과 <b>동일한 계정</b>으로 지역화폐 앱을 이용합니다.<br>SNS 인증으로 간편하게 로그인하세요.</p>'+
    '<div class="row">'+(typeof SNS_LOGIN!=='undefined'?SNS_LOGIN.map(function(s){
      return '<button style="background:'+s.bg+';color:'+s.fg+(s.border?';border:1px solid '+s.border:'')+'" onclick="payLogin(\''+s.userId+'\')" aria-label="'+s.aria+'">'+s.icon+'</button>';
    }).join(''):'')+'</div>'+
    '<small>* 투어원패스 관련 문의 : pass@knto.or.kr / 070-8667-4511</small></div>';
}

function payRender(){
  payWho();
  if(P_UID==='guest'){payLoginView();return;}
  const all=pLoad();
  /* 통보 이후 단계의 신청 건만 지역화폐 앱에 나타난다 */
  const list=all.map((a,i)=>({a:a,i:i})).filter(x=>['notified','refund_req','refund_fix','refund_ok'].indexOf(x.a.status)>=0);
  const el=document.getElementById('payList');
  if(!list.length){
    el.innerHTML='<div class="empty">발행된 반값여행 상품권이 없습니다.<br><br>'+
      '① <a href="t50-apply.html">신청자 화면</a>에서 통합신청 접수<br>'+
      '② <a href="t50-admin.html">지자체 관리 화면</a>에서 승인·결과 통보<br>'+
      '③ 이곳에서 상품권이 발행(개인)됩니다</div>';
    return;
  }
  el.innerHTML=list.map(x=>{
    const a=x.a,i=x.i,w=pWallet(a),amt=a.amount||0;
    const stLb=w.recovered?'회수 완료':(w.purchased?'사용중':'발행(개인) 완료');
    let bd='';
    if(!w.recovered){
      if(!w.purchased){
        bd='<div class="note">🎫 지자체 승인에 따라 <b>CI·승인 금액('+pWon(amt)+')</b> 기준 개인 상품권이 발행되었습니다. 자부담 '+pWon(amt)+'을 더해 <b>'+pWon(amt*2)+'</b>어치를 반값에 구입하세요.</div>'+
          '<button class="buy" onclick="payBuy('+i+')">상품권 반값 구입 · 충전하기<small>자부담 '+pWon(amt)+' 결제 → '+pWon(amt*2)+' 충전 (지원금 '+pWon(amt)+')</small></button>';
      }else{
        bd='<div class="use-t">가맹점에서 사용하기 (결재내역에 기록됩니다)</div><div class="use-row">'+
          MERCHANTS.map((m,mi)=>'<button '+(w.bal<m.amt?'disabled':'')+' onclick="payUse('+i+','+mi+')">'+m.ic+' '+m.nm+'<b>'+pWon(m.amt)+'</b></button>').join('')+'</div>';
      }
      /* 환급 충전은 상품권 구입 여부와 무관하게 환급 승인 즉시 표시 */
      if(a.status==='refund_ok'&&!w.refundCharged)
        bd+='<button class="buy" style="margin-top:10px" onclick="payRefund('+i+')">💰 환급 금액 충전받기<small>지자체 환급 승인 '+pWon(a.refundAmount||amt)+(a.bonus?' (🎉 청년 20% 포함)':'')+' → 잔액에 충전</small></button>';
      if(a.status==='refund_ok'&&w.refundCharged)
        bd+='<div class="note" style="margin-top:10px">✅ 환급 금액 '+pWon(a.refundAmount||amt)+' 충전 완료 — 아래 결재내역에서 확인할 수 있습니다.</div>';
      if(a.status==='refund_req'||a.status==='refund_fix')
        bd+='<div class="note" style="margin-top:10px">🧾 환급 심사가 진행 중입니다. 승인되면 이곳에서 충전받을 수 있습니다.</div>';
      if(w.purchased||w.refundCharged)
        bd+='<button class="recover" onclick="payRecover('+i+')">지원 기간 종료 · 잔액 회수 (시뮬레이션)</button>';
    }else{
      bd='<div class="note warn">지원 기간이 종료되어 잔여 상품권이 회수되었습니다. 이용해 주셔서 감사합니다.</div>'+
        (w.surveyed?'<div class="note">📋 설문조사 참여 완료 (만족도 '+'⭐'.repeat(w.surveyScore||0)+')</div>'
                   :'<button class="done-b" onclick="svyOpen('+i+')">📋 만족도 설문조사 참여</button>');
    }
    const tx=w.tx.length?'<div class="tx"><div class="t">결재내역</div>'+
      w.tx.slice(0,6).map(t=>'<div class="row"><span class="lb">'+t.label+'</span><small>'+t.ts+'</small>'+
      '<span class="amt '+(t.amt>=0?'plus':'minus')+'">'+(t.amt>=0?'+':'')+pWon(t.amt)+'</span></div>').join('')+'</div>':'';
    return '<div class="vcard"><div class="head">'+
      '<div class="rg">'+a.region+' 반값여행 상품권</div><span class="st">'+stLb+'</span>'+
      '<div class="bal">'+pWon(w.bal)+'<small> 잔액</small></div>'+
      '<div class="meta">'+(a.applicant||'김관광')+' · '+a.no+' · 여행 '+pFmt(a.start)+'~'+pFmt(a.end)+'</div></div>'+
      '<div class="bd">'+bd+tx+'</div></div>';
  }).join('');
}

function payBuy(i){
  const l=pLoad();const a=l[i];if(!a)return;
  const w=pWallet(a),amt=a.amount||0;
  w.purchased=true;w.bal+=amt*2;
  pTx(w,'상품권 구입·충전 (자부담 '+pWon(amt)+' + 지원 '+pWon(amt)+')',amt*2);
  pSave(l);payRender();
  pToast(pWon(amt*2)+' 충전되었습니다');
}
function payUse(i,mi){
  const l=pLoad();const a=l[i];if(!a)return;
  const w=pWallet(a),m=MERCHANTS[mi];
  if(w.bal<m.amt){pToast('잔액이 부족합니다');return;}
  w.bal-=m.amt;
  pTx(w,m.ic+' '+m.nm+' 결제',-m.amt);
  pSave(l);payRender();
  pToast(m.nm+' '+pWon(m.amt)+' 결제 완료');
}
function payRefund(i){
  const l=pLoad();const a=l[i];if(!a)return;
  const w=pWallet(a),amt=a.refundAmount||a.amount||0;
  w.refundCharged=true;w.bal+=amt;
  pTx(w,'환급 금액 충전 (지자체 환급 승인)',amt);
  pSave(l);payRender();
  pToast('환급 '+pWon(amt)+' 충전되었습니다');
}
function payRecover(i){
  const l=pLoad();const a=l[i];if(!a)return;
  const w=pWallet(a);
  if(!confirm('지원 기간 종료를 시뮬레이션하고 잔액 '+pWon(w.bal)+'을 회수할까요?'))return;
  if(w.bal>0)pTx(w,'지원 기간 종료 · 잔액 회수',-w.bal);
  w.bal=0;w.recovered=true;
  pSave(l);payRender();
  svyOpen(i);
}

/* 설문조사 (프로세스 마지막: 잔액 회수 → 설문조사) */
function svyOpen(i){
  svyIdx=i;svyScore=0;
  document.querySelectorAll('#svyStars button').forEach(b=>b.classList.remove('on'));
  document.getElementById('svyModal').classList.add('on');
}
function svyPick(n){
  svyScore=n;
  document.querySelectorAll('#svyStars button').forEach((b,bi)=>b.classList.toggle('on',bi<n));
}
function svyDone(){
  if(!svyScore){pToast('별점을 선택해 주세요');return;}
  const l=pLoad();const a=l[svyIdx];
  if(a){const w=pWallet(a);w.surveyed=true;w.surveyScore=svyScore;pSave(l);}
  document.getElementById('svyModal').classList.remove('on');
  payRender();
  pToast('설문 제출 완료 — 참여해 주셔서 감사합니다');
}

/* ── 관광주민증 포인트 → 지역화폐 전환 (1:1) ── */
function ptUser(){
  const uid=localStorage.getItem('dgtour_user_id');
  if(!uid||typeof ACCOUNTS==='undefined')return null;
  return ACCOUNTS.find(u=>u.id===uid)||null;
}
function ptBal(){
  const u=ptUser();if(!u)return 0;
  let m={};try{m=JSON.parse(localStorage.getItem(PT_KEY)||'{}');}catch(e){}
  return (typeof m[u.id]==='number')?m[u.id]:PT_INIT;
}
function ptSet(n){
  const u=ptUser();if(!u)return;
  let m={};try{m=JSON.parse(localStorage.getItem(PT_KEY)||'{}');}catch(e){}
  m[u.id]=n;localStorage.setItem(PT_KEY,JSON.stringify(m));
}
function cvLoad(){try{return JSON.parse(localStorage.getItem(CV_KEY)||'{}');}catch(e){return{};}}
function cvSave(w){localStorage.setItem(CV_KEY,JSON.stringify(w));}

function renderPoints(){
  const el=document.getElementById('pointCard');
  const u=ptUser();
  if(!u)return;   /* 비로그인은 payRender가 ONEPASS 로그인 화면을 표시 */
  el.innerHTML='<div class="pt-card"><div class="pi"><div class="l">🪪 내 관광주민증 포인트</div>'+
    '<div class="v">'+ptBal().toLocaleString('ko-KR')+' <small>P</small></div>'+
    '<div class="d">'+u.name+'님 · 관광주민증 활동으로 적립 · 지역화폐 1:1 전환</div></div>'+
    '<button class="cv-btn" onclick="cvOpen()">지역화폐로<br>전환하기</button></div>';
}

function renderCv(){
  const w=cvLoad();
  const names=Object.keys(w).filter(k=>w[k].bal>0||w[k].tx.length);
  document.getElementById('cvSec').style.display=names.length?'block':'none';
  document.getElementById('cvList').innerHTML=names.map(nm=>{
    const c=w[nm];
    const tx=c.tx.length?'<div class="tx"><div class="t">이용 내역</div>'+
      c.tx.slice(0,5).map(t=>'<div class="row"><span class="lb">'+t.label+'</span><small>'+t.ts+'</small>'+
      '<span class="amt '+(t.amt>=0?'plus':'minus')+'">'+(t.amt>=0?'+':'')+pWon(t.amt)+'</span></div>').join('')+'</div>':'';
    return '<div class="vcard"><div class="head cv"><div class="rg">'+nm+' 지역화폐</div><span class="st">포인트 전환</span>'+
      '<div class="bal">'+pWon(c.bal)+'<small> 잔액</small></div>'+
      '<div class="meta">관광주민증 포인트 1:1 전환 지역화폐</div></div>'+
      '<div class="bd"><div class="use-t">가맹점에서 사용하기</div><div class="use-row">'+
      MERCHANTS.map((m,mi)=>'<button '+(c.bal<m.amt?'disabled':'')+' onclick="cvUse(\''+nm+'\','+mi+')">'+m.ic+' '+m.nm+'<b>'+pWon(m.amt)+'</b></button>').join('')+
      '</div>'+tx+'</div></div>';
  }).join('');
}

function cvOpen(){
  const bal=ptBal();
  if(bal<=0){pToast('전환할 포인트가 없습니다');return;}
  const sel=document.getElementById('cvRegion');
  /* 전환 대상 지역: 반값여행 참여 지역 + 이미 전환 지갑이 있는 지역 */
  const regs=[...new Set([].concat(
    (typeof TOUR50_REGIONS!=='undefined'?TOUR50_REGIONS.map(r=>r.name):[]),
    Object.keys(cvLoad())))];
  sel.innerHTML='<option value="">지역을 선택하세요</option>'+regs.map(r=>'<option value="'+r+'">'+r+'</option>').join('');
  document.getElementById('cvBal').textContent=bal.toLocaleString('ko-KR');
  const inp=document.getElementById('cvAmt');
  inp.value='';inp.max=Math.min(bal,CV_MAX);
  document.getElementById('cvHint').textContent='';
  document.getElementById('cvModal').classList.add('on');
}
function cvHint(){
  const bal=ptBal();
  const n=Math.floor(Number(document.getElementById('cvAmt').value)||0);
  const h=document.getElementById('cvHint');
  if(n<=0){h.textContent='';return;}
  if(n>bal){h.textContent='⚠ 보유 포인트('+bal.toLocaleString('ko-KR')+'P)를 초과했습니다';h.style.color='#b91c1c';}
  else if(n>CV_MAX){h.textContent='⚠ 한 번에 최대 '+CV_MAX.toLocaleString('ko-KR')+'P까지 전환할 수 있습니다';h.style.color='#b91c1c';}
  else{h.textContent='→ '+n.toLocaleString('ko-KR')+'원이 지역화폐로 입금됩니다 (1:1)';h.style.color='#7c3aed';}
}
function cvAll(){document.getElementById('cvAmt').value=Math.min(ptBal(),CV_MAX);cvHint();}
function cvClose(){document.getElementById('cvModal').classList.remove('on');}
function cvDo(){
  const region=document.getElementById('cvRegion').value;
  const n=Math.floor(Number(document.getElementById('cvAmt').value)||0);
  const bal=ptBal();
  if(!region){pToast('전환할 지역을 선택해 주세요');return;}
  if(n<=0){pToast('전환할 포인트를 입력해 주세요');return;}
  if(n>bal){pToast('보유 포인트를 초과했습니다');return;}
  if(n>CV_MAX){pToast('한 번에 최대 '+CV_MAX.toLocaleString('ko-KR')+'P까지 전환할 수 있습니다');return;}
  ptSet(bal-n);
  const w=cvLoad();
  if(!w[region])w[region]={bal:0,tx:[]};
  w[region].bal+=n;
  w[region].tx.unshift({label:'관광주민증 포인트 전환 입금 ('+n.toLocaleString('ko-KR')+'P)',amt:n,ts:new Date().toISOString().slice(5,10).replace('-','.')});
  cvSave(w);
  cvClose();renderPoints();renderCv();
  pToast(region+' 지역화폐로 '+pWon(n)+' 입금되었습니다');
}
function cvUse(nm,mi){
  const w=cvLoad();const c=w[nm];if(!c)return;
  const m=MERCHANTS[mi];
  if(c.bal<m.amt){pToast('잔액이 부족합니다');return;}
  c.bal-=m.amt;
  c.tx.unshift({label:m.ic+' '+m.nm+' 결제',amt:-m.amt,ts:new Date().toISOString().slice(5,10).replace('-','.')});
  cvSave(w);renderCv();
  pToast(m.nm+' '+pWon(m.amt)+' 결제 완료');
}

/* 다른 탭(신청/관리 화면) 처리 시 자동 갱신 */
window.addEventListener('storage',function(e){
  if(e.key===AP_KEY)payRender();
  if(e.key===PT_KEY||e.key===CV_KEY){renderPoints();renderCv();}
});
payRender();
renderPoints();
renderCv();
/* exp.html 등에서 #convert 딥링크로 진입하면 전환 모달을 바로 연다 */
if(location.hash==='#convert'&&ptUser())cvOpen();
</script>
