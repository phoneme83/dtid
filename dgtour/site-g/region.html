<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>지역 홈 — 대한민국 반값여행 · 시안 G</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="g.css?v=1">
<style>
/* 지역 홈 (착수보고 p16·p17) — 접두사 .rg- */
.rg-warn{background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;font-size:14px}
.rg-warn .g-in{padding:11px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.rg-warn b{color:#c2410c}
.rg-hero{position:relative;color:#fff;border-bottom:6px solid var(--rc)}
.rg-hero .g-in{padding:54px 20px 40px}
.rg-hero h1{margin:0;font-size:56px;line-height:1.1;letter-spacing:-2px;font-weight:900;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rg-badge{font-size:15px;letter-spacing:0;font-weight:800;padding:6px 14px;border-radius:999px;background:var(--pri);color:#fff;white-space:nowrap}
.rg-badge.soon{background:#fff;color:var(--blue)}
.rg-badge.closed{background:rgba(255,255,255,.22);color:#fff;border:1px solid rgba(255,255,255,.5)}
.rg-intro{margin:12px 0 0;font-size:16px;opacity:.92}
.rg-period{margin:22px 0 0;font-size:15px;opacity:.95;display:flex;gap:6px 18px;flex-wrap:wrap}
.rg-period b{font-weight:800}
.rg-cta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:18px}
.rg-cta .btn{min-width:180px}
.rg-cta .btn.out{background:#fff;color:var(--blue);border-color:#fff}
.rg-cta .btn:disabled{opacity:.6;background:#64748b;border-color:#64748b;color:#fff}
.rg-ctx{font-size:13.5px;line-height:1.6}
.rg-ctx em{font-style:normal;background:var(--pri);padding:0 4px;border-radius:3px;font-weight:700}
.rg-why{margin-top:10px;font-size:13.5px;background:rgba(15,23,42,.55);display:inline-block;padding:6px 10px;border-radius:8px}
.rg-key{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:-26px;position:relative;z-index:2}
.rg-key div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 14px;box-shadow:var(--sh);text-align:center;font-size:13px;color:var(--sub)}
.rg-key b{display:block;color:var(--ink);font-size:15px;margin-top:2px;word-break:keep-all}
.rg-diff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rg-dc{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff}
.rg-dc i{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pri-l);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:20px}
.rg-dc b{display:block;font-size:15.5px}
.rg-dc p{margin:4px 0 0;font-size:14px;color:var(--sub);word-break:keep-all}
.rg-tbl td{white-space:nowrap}
.rg-tbl td.cur{font-weight:800}
.rg-tbl .btn{white-space:nowrap}
.rg-tbl .rem{font-size:12.5px;color:var(--sub)}
.rg-tbl .rem b{color:var(--ink)}
.rg-bar{height:5px;background:#eef0f3;border-radius:3px;margin-top:4px;overflow:hidden;min-width:70px}
.rg-bar i{display:block;height:100%;background:var(--pri)}
.rg-spots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.rg-spot{border-radius:14px;overflow:hidden;background:#fff;border:1px solid var(--line)}
.rg-spot .ph{aspect-ratio:4/3;display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px;font-weight:700}
.rg-spot b{display:block;padding:11px 12px;font-size:14.5px;text-align:center}
.rg-com{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 280px;gap:20px;align-items:start}
.rg-com h3{margin:0 0 8px;font-size:16px}
.rg-com h3 a{display:flex;justify-content:space-between}
.rg-com h3 a span{color:var(--mute);font-weight:500;font-size:13px}
.rg-li{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;font-size:14px}
.rg-li span.t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rg-li small{color:var(--mute);flex:none}
.rg-tag{flex:none;font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--blue-l);color:var(--blue)}
.rg-tag.loc{background:#fff7ed;color:#c2410c}
.rg-dept{background:var(--pri-l);border-radius:12px;padding:18px}
.rg-dept b{display:block;font-size:15.5px}
.rg-dept p{margin:4px 0 12px;font-size:14px;color:var(--sub)}
.rg-mph{font-size:14px;color:var(--sub);margin:6px 0 4px}
@media (max-width:960px){
  .rg-key{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rg-spots{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rg-com{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rg-com .rg-dept{grid-column:1/-1}
  .rg-hero h1{font-size:44px}
}
@media (max-width:600px){
  .rg-hero .g-in{padding:36px 16px 44px}
  .rg-hero h1{font-size:38px}
  .rg-diff,.rg-com{grid-template-columns:minmax(0,1fr)}
  .rg-cta .btn{flex:1 1 40%;min-width:0;white-space:nowrap;padding:14px 10px;font-size:15.5px}
  .rg-ctx{flex-basis:100%}
  .rg-tbl td,.rg-tbl th{padding:10px 8px}
  .rg-tbl th:nth-child(3),.rg-tbl td:nth-child(3){display:none}
}
</style>
</head><body>
<main id="rgMain"></main>
<script src="../site-assets/data.js?v=20260818a"></script>
<script src="g.js?v=1"></script>
<script>
const SLUG=(gQS('r')&&gRegion(gQS('r')))?gQS('r'):'pyeongchang';
gShell({mode:'region',slug:SLUG,active:'home'});

function rgRoundCell(r,rd){
  const st=gRoundState(r.slug,rd);
  let btn='';
  if(st==='open') btn='<a class="btn pri sm" href="apply.html?r='+r.slug+'&round='+rd.n+'">신청하기</a>';
  else if(st==='soon') btn=gHasAlert(r.slug,rd.n)
    ?'<button class="btn sm" onclick="rgAlertOff('+rd.n+')" title="누르면 알림 신청을 취소합니다">✓ 알림 신청됨</button>'
    :'<button class="btn sm" style="color:var(--blue);border-color:var(--blue)" onclick="rgAlert('+rd.n+')">🔔 알림 신청</button>';
  let rem='-';
  if(st==='open'||st==='full'){
    const c=gCapacity(r.slug,rd), left=Math.max(0,c.quota-c.used), pct=Math.min(100,Math.round(c.used/c.quota*100));
    rem='<div class="rem">잔여 <b>'+left+'</b> / '+c.quota+'건'+(c.queue?' · 대기 '+c.queue:'')+'</div><div class="rg-bar"><i style="width:'+pct+'%"></i></div>';
  } else if(st==='soon') rem='<div class="rem">정원 '+rd.quota+'건</div>';
  return {st,btn,rem};
}

function rgRender(){
  const r=gRegion(SLUG), S=gRegionState(r), rd=S.round, u=gUser();
  const pay=gStd('P7',SLUG).val, rc=gEsc(r.color);
  /* 배지 */
  let badge, bcls='';
  if(S.state==='open') badge=rd.n+'회차 접수중';
  else if(S.state==='soon'){ badge=rd.n+'회차 오픈예정 D-'+S.dday; bcls='soon'; }
  else if(S.full) { badge=rd.n+'회차 조기마감'; bcls='closed'; }
  else if(S.nextOnly){ badge='이번 회차 마감 · '+rd.n+'회차 D-'+S.dday; bcls='closed'; }
  else { badge='마감'; bcls='closed'; }
  /* 신청 불가 사유 */
  const block=u?gAddrBlock(SLUG,u.sigungu):null;
  let why='';
  if(S.state!=='open'){
    if(S.state==='soon'||S.nextOnly) why=rd.n+'회차 접수는 '+gDot(rd.applyStart)+'에 시작합니다. 아래 일정 표에서 알림을 신청해 주세요.';
    else if(S.full) why='예산(정원) 소진으로 조기 마감되었습니다.'+(S.next?' 다음 '+S.next.n+'회차는 '+gDot(S.next.applyStart)+' 시작 예정입니다.':'');
    else why='올해 접수가 모두 마감되었습니다.';
  } else if(block) why='거주지('+u.sigungu+')가 '+(block==='same'?'신청 지역 관내':'인접 지역')+'이라 신청할 수 없습니다.';
  const canApply=S.state==='open'&&!block;

  const warn=(u&&block)?'<div class="rg-warn"><div class="g-in">⚠ <span><b>'+gEsc(u.name)+' 님의 거주지('+gEsc(u.addr)+')는 '+gEsc(r.full)+
    (block==='same'?' 관내':'의 인접 지역')+'입니다.</b> 관외·비인접 지역 거주자만 신청할 수 있어요. '+
    '<a href="index.html#find" style="text-decoration:underline">신청 가능한 다른 지역 찾기 ›</a></span></div></div>':'';

  /* 이게 달라요 4번째 카드 */
  let c4;
  if(r.extraExcl) c4=['🚫','환급 제외 업종 추가','전국 공통 + '+r.extraExcl];
  else {
    const o=[['S4','인정 제외 숙박'],['S5','생활소비·특정서비스 제외'],['S6','특정시설 예외 인정']].map(x=>[x,gStd(x[0],SLUG).val]).find(x=>x[1]);
    if(o) c4=['📌',o[0][1],o[1]];
    else c4=['🛵','배달앱 사용 '+gStd('U7',SLUG).val,'환급 제외 업종은 전국 공통('+gStd('S2').val+')'];
  }
  const diff=[
    ['💳','결제·환급은 '+pay+' 앱','결제부터 환급금 사용까지 '+r.voucher],
    ['📸','관광지 방문 인증사진',r.photoRule+' · 지정관광지 '+gStd('V4',SLUG).val+' 인증'],
    ['🏘','인접지역 거주자 불가',r.nearby.length?r.nearby.join(' · '):'관내 거주자만 제외'],
    c4
  ];

  /* 회차 표 */
  const rows=r.rounds.map(x=>{
    const c=rgRoundCell(r,x), cur=x.n===rd.n;
    return '<tr><td class="'+(cur?'cur':'')+'">'+x.n+'회차</td><td class="'+(cur?'cur':'')+'">'+gMD(x.applyStart)+' ~ '+gMD(x.applyEnd)+'</td>'+
      '<td>'+gMD(x.travelStart)+' ~ '+gMD(x.travelEnd)+'</td><td>'+c.rem+'</td><td>'+gStateBadge(c.st)+'</td><td class="tr">'+c.btn+'</td></tr>';
  }).join('');

  /* 대표명소 */
  const spots=r.attractions.slice(0,4).map((a,i)=>{
    const bg=(i===0&&r.image)?gRegionBg(r):'linear-gradient('+(135+i*40)+'deg,'+rc+','+['#0f172a','#334155','#1e3a8a','#3f3f46'][i]+')';
    return '<div class="rg-spot"><div class="ph" style="background:'+bg+'">'+(i===0&&r.image?'':'📍 사진 준비 중')+'</div><b>'+gEsc(a)+'</b></div>';
  }).join('');

  /* 커뮤니티 */
  const N=gNotices().filter(n=>n.scope==='all'||n.scope===SLUG);
  const by=(a,b)=>a.date<b.date?1:-1;
  const li=(n,tab)=>'<a class="rg-li" href="support.html?r='+SLUG+'&tab='+tab+'&id='+encodeURIComponent(n.id)+'"><span class="rg-tag'+(n.scope==='all'?'':' loc')+'">'+(n.scope==='all'?'통합':'지역')+'</span>'+
    '<span class="t">'+gEsc(n.title)+'</span><small>'+gMD(n.date)+'</small></a>';
  const nl=N.filter(n=>n.kind==='notice').sort(by).slice(0,3).map(n=>li(n,'notice')).join('')||'<p class="muted small">등록된 공지가 없습니다.</p>';
  const fl=N.filter(n=>n.kind==='faq').sort(by).slice(0,3).map(n=>li(n,'faq')).join('')||'<p class="muted small">등록된 질문이 없습니다.</p>';

  document.getElementById('rgMain').innerHTML=warn+
  '<section class="rg-hero" style="--rc:'+rc+';background:linear-gradient(100deg,rgba(15,23,42,.86) 0%,rgba(15,23,42,.55) 55%,rgba(15,23,42,.25) 100%),'+gRegionBg(r)+'">'+
    '<div class="g-in">'+
      '<h1>'+gEsc(r.full)+' <span class="rg-badge '+bcls+'">'+badge+'</span></h1>'+
      '<p class="rg-intro">'+gEsc(r.intro)+'</p>'+
      '<div class="rg-period"><span>신청 기간 <b>'+gMD(rd.applyStart)+' ~ '+gMD(rd.applyEnd)+'</b></span><span>·</span><span>여행 기간 <b>'+gMD(rd.travelStart)+' ~ '+gMD(rd.travelEnd)+'</b></span>'+
        (S.state==='open'?'<span>· 마감 D-'+S.dday+'</span>':'')+'</div>'+
      '<div class="rg-cta">'+
        (canApply?'<a class="btn pri lg" href="apply.html?r='+SLUG+'">사전신청하기</a>':'<button class="btn lg" disabled>사전신청하기</button>')+
        '<a class="btn lg out" href="settle.html?r='+SLUG+'">정산신청하기</a>'+
        '<div class="rg-ctx"><em>여행 '+gStd('A1').num+'일 전</em>까지 신청해 주세요<br>디지털 관광주민증 <em>로그인 후 약 3분</em> 신청 완료!</div>'+
      '</div>'+
      (why?'<div class="rg-why">ⓘ '+gEsc(why)+'</div>':'')+
    '</div></section>'+
  '<div class="wrap" style="padding-top:0">'+
    '<div class="rg-key">'+
      '<div>결제수단<b>'+gEsc(pay)+' 앱 QR</b></div>'+
      '<div>환급<b>모바일 '+gEsc(r.voucher)+'</b></div>'+
      '<div>정산 기한<b>'+gEsc(gStd('C1').val.replace(' 이내',''))+'</b></div>'+
      '<div>환급 지급<b>최대 '+gStd('U1').num+'일 이내</b></div>'+
    '</div>'+
    '<section class="sec card"><div class="sec-h"><div><h2>'+gEsc(r.name)+gJosa(r.name,'은는')+' 이게 달라요</h2><p>전국 공통 기준과 다른 점만 모았어요</p></div>'+
      '<a class="btn sm" style="color:var(--blue);border-color:#bfd3ff" href="guide.html">전국 공통 규정 확인 ›</a></div>'+
      '<div class="rg-diff">'+diff.map(d=>'<div class="rg-dc"><i>'+d[0]+'</i><div><b>'+gEsc(d[1])+'</b><p>'+gEsc(d[2])+'</p></div></div>').join('')+'</div>'+
      '<p class="small muted" style="margin:12px 0 0">자세한 조건은 <a href="rguide.html?r='+SLUG+'#special" style="color:var(--blue);font-weight:700">신청·정산 안내 › 특이사항</a>에서 확인하세요.</p>'+
    '</section>'+
    '<section class="sec"><div class="sec-h"><div><h2>회차별 일정</h2></div><p class="small">차수별 선착순 · 예산 소진 시 조기 마감</p></div>'+
      '<div class="tbl-wrap"><table class="tbl rg-tbl"><thead><tr><th>회차</th><th>신청 기간</th><th>여행 기간</th><th>잔여 정원</th><th>상태</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<p class="small muted" style="margin:8px 2px 0">오픈예정 회차에 알림을 신청하면 접수 시작 시 디지털 관광주민증에 등록된 번호로 알림톡을 보내 드립니다.</p>'+
    '</section>'+
    '<section class="sec" id="spots"><div class="sec-h"><h2>대표명소</h2><a class="small muted" href="'+gEsc(r.links.spots)+'">관광지 소개 ›</a></div><div class="rg-spots">'+spots+'</div></section>'+
    '<section class="sec card"><div class="sec-h" style="margin-bottom:6px"><h2>커뮤니티</h2></div><div class="rg-com">'+
      '<div><h3><a href="support.html?r='+SLUG+'&tab=notice">공지사항 › <span>더보기</span></a></h3>'+nl+'</div>'+
      '<div><h3><a href="support.html?r='+SLUG+'&tab=faq">자주 묻는 질문 › <span>더보기</span></a></h3>'+fl+'</div>'+
      '<div class="rg-dept"><b>'+gEsc(r.dept)+'</b><p>평일 '+gEsc(gStd('B6',SLUG).val.replace(/시/g,':00').replace(/\s/g,''))+' · ☎ '+gEsc(r.phone)+'</p>'+
        '<a class="btn pri block" href="support.html?r='+SLUG+'&tab=qna">문의하기</a></div>'+
    '</div></section>'+
  '</div>';
}

function rgAlert(n){
  const u=gUser(), r=gRegion(SLUG), rd=r.rounds.find(x=>x.n===n);
  if(!u){
    gModal('<h3>🔔 오픈 알림 신청</h3><p>알림은 디지털 관광주민증에 등록된 휴대폰 번호로 보내 드립니다. 먼저 로그인해 주세요.</p>'+
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="gCloseModal()">닫기</button><a class="btn navy" href="'+gLoginUrl()+'">디주 로그인</a></div>');
    return;
  }
  const ph=u.phone.replace(/-(\d{4})-/,'-****-');
  gModal('<h3>🔔 '+gEsc(r.full)+' '+n+'회차 오픈 알림 신청</h3>'+
    '<p class="muted">접수 시작일 <b style="color:var(--ink)">'+gDot(rd.applyStart)+'</b>에 알림톡으로 알려 드립니다.</p>'+
    '<div class="note">받는 번호 <b>'+gEsc(ph)+'</b> (디지털 관광주민증 연동 번호)</div>'+
    '<label class="check"><input type="checkbox" id="rgAgree"><span><b>[필수] 알림톡 수신 동의</b><br><span class="small muted">반값여행 회차 오픈 안내를 카카오 알림톡으로 받습니다. 마이페이지에서 언제든 해지할 수 있습니다.</span></span></label>'+
    '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn" onclick="gCloseModal()">취소</button><button class="btn blue" onclick="rgAlertDo('+n+')">알림 신청</button></div>');
}
function rgAlertDo(n){
  if(!document.getElementById('rgAgree').checked){ gToast('알림톡 수신 동의가 필요해요','bad'); return; }
  gAddAlert(SLUG,n); gCloseModal(); gToast('알림 신청이 완료되었어요','ok'); rgRender();
}
function rgAlertOff(n){
  if(!confirm(n+'회차 오픈 알림 신청을 취소할까요?')) return;
  gRemoveAlert(SLUG,n); gToast('알림 신청을 취소했어요'); rgRender();
}
rgRender();
</script>
</body></html>
