<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>정산신청 — 대한민국 반값여행 · 시안 G</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="g.css?v=1">
<style>
/* 정산신청 전용 (.st-) */
.st-band{background:linear-gradient(120deg,var(--rc) 0%,#0f172a 140%);color:#fff}
.st-band .g-in{padding:26px 20px 24px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.st-band h1{margin:0;font-size:26px;letter-spacing:-.5px}
.st-band p{margin:4px 0 0;opacity:.88;font-size:14px}
.st-wrap{max-width:980px}
.st-h{margin:0 0 4px;font-size:21px;letter-spacing:-.3px}
.st-sub{margin:0 0 16px;color:var(--sub);font-size:14px}
.st-app{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px;background:#fff}
.st-app.on{border-color:var(--pri);background:var(--pri-l)}
.st-app.dis{background:#f8fafc}
.st-app b{font-size:16px}
.st-app .meta{font-size:13.5px;color:var(--sub);margin-top:2px}
.st-app .why{font-size:13px;font-weight:700;color:var(--bad);margin-top:4px}
.st-app .due{font-size:13px;font-weight:700;color:var(--ok);margin-top:4px}
.st-nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.st-nav .btn.pri{min-width:180px}
.st-rule{background:#fffdf5;border:1px solid #fde68a;border-radius:12px;padding:12px 14px;font-size:13.5px;margin:12px 0}
.st-rule b{color:#92400e}
.st-rule ul{margin:6px 0 0;padding-left:18px}
.st-box{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;background:#fff}
.st-box h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-load{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:10px;font-size:14px}
.st-tbl table{min-width:680px}
.st-spin{width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:stSpin .8s linear infinite;flex:none}
@keyframes stSpin{to{transform:rotate(360deg)}}
.st-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px}
.st-ok{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#e7f7f3;color:var(--ok);white-space:nowrap}
.st-no{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:800;background:#fdecef;color:var(--bad);white-space:nowrap}
.st-src{font-size:11.5px;font-weight:800;color:var(--sub);background:#f1f5f9;border-radius:6px;padding:2px 6px;white-space:nowrap}
.st-tbl td.num,.st-tbl th.num{text-align:right;white-space:nowrap}
.st-tbl tr.bad td{background:#fffafa}
.st-tbl small{display:block;color:var(--sub);font-size:12px}
.st-tbl button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:700;font-size:12.5px}
.st-sumbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.st-sumbar div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.st-sumbar span{display:block;font-size:12.5px;color:var(--sub)}
.st-sumbar b{font-size:18px}
.st-sumbar .hl{border-color:var(--pri);background:var(--pri-l)} .st-sumbar .hl b{color:var(--pri)}
.st-ocr{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;padding:12px 14px;font-size:13.5px}
.st-ocr .t{font-weight:800;margin-bottom:6px}
.st-ocr .r{display:grid;grid-template-columns:110px minmax(0,1fr);gap:8px;padding:3px 0;border-bottom:1px dashed #e2e8f0}
.st-ocr .r span{color:var(--sub)}
.st-ocr .unk{color:#b45309;font-weight:700}
.st-err{color:var(--bad);font-size:13.5px;font-weight:600;margin-top:8px;min-height:18px}
.st-ex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0}
.st-ex div{border:1px solid var(--line);border-radius:12px;background:#fff;text-align:center;padding:14px 8px;font-size:13px}
.st-ex i{display:block;font-style:normal;font-size:34px}
.st-vis{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:11px;margin-top:8px;background:#fff;font-size:14px;flex-wrap:wrap}
.st-vis button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:700}
.st-cnt{font-size:15px;font-weight:800;margin-top:12px}
.st-sum{border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:12px;overflow:hidden}
.st-sum h4{margin:0;padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.st-sum dl{margin:0;padding:6px 16px 12px;display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px}
.st-sum dt{color:var(--sub)} .st-sum dd{margin:0;font-weight:600}
.st-big{text-align:center;padding:34px 20px}
.st-big .ic{font-size:46px}
.st-big h2{margin:8px 0 6px;font-size:24px}
.st-big p{margin:4px 0;color:var(--sub)}
.st-no-big{display:inline-block;margin:14px 0;font-size:26px;font-weight:900;letter-spacing:1px;color:var(--navy);background:#f1f5f9;border-radius:12px;padding:8px 18px}
.st-demo{margin-top:16px;border:1px dashed #cbd5e1;border-radius:11px;padding:10px 14px;font-size:12.5px;color:var(--sub)}
.st-demo .btn{margin:6px 6px 0 0}
.st-fix{border-left:4px solid var(--pri)}
.st-files{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.st-files li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:#f8fafc;border-radius:8px;margin-top:4px}
.st-files button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:700}
.st-login{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.st-login div{background:#f8fafc;border-radius:12px;padding:14px;font-size:13.5px}
.st-login b{display:block;font-size:15px;margin-bottom:2px}
.st-terms{border:1px solid var(--line);border-radius:11px;background:#fff;margin:8px 0}
.st-terms summary{cursor:pointer;padding:10px 14px;font-size:13px;color:var(--blue);font-weight:700}
.st-terms div{padding:0 14px 12px;font-size:13px;color:#475569}
@media (max-width:760px){
  .st-sumbar{grid-template-columns:repeat(2,minmax(0,1fr))}
  .st-login{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .st-row{grid-template-columns:minmax(0,1fr)}
  .st-ex{grid-template-columns:repeat(3,minmax(0,1fr))}
  .st-sum dl{grid-template-columns:96px minmax(0,1fr)}
  .st-ocr .r{grid-template-columns:86px minmax(0,1fr)}
  .st-band h1{font-size:22px}
  .st-nav .btn{flex:1}
}
</style>
</head><body>
<main>
  <section class="st-band" id="stBand"></section>
  <div class="wrap st-wrap">
    <ol class="steps" id="stSteps" style="display:none"></ol>
    <div id="stView"></div>
  </div>
</main>
<script src="../site-assets/data.js?v=20260818a"></script>
<script src="g.js?v=1"></script>
<script src="g-corp.js?v=1"></script>
<script src="g-ocr.js?v=1"></script>
<script>
const ST_SLUG=(gQS('r')&&gRegion(gQS('r')))?gQS('r'):'pyeongchang';
gShell({mode:'region',slug:ST_SLUG,active:'settle'});

/* ═══ 정산신청 5단계 (착수보고 p19) — ①신청 내역 조회 → ②결제 증빙 → ③관광지 인증 → ④최종 확인 → ⑤완료
   고도화 유지(시안 D): 영수증 OCR 판독·판독값↔입력값 대조(g-ocr.js), 법인카드 BIN 판정(g-corp.js),
   결제일·결제지역·숙박 선결제 검사, 전 계정 정산 증빙 중복 제출 탐지 */
const ST=(function(){
  const R=gRegion(ST_SLUG), U=gUser();
  const C1=gStdNum('C1')||10, U1=gStdNum('U1')||14, P5=gStdNum('P5')||180;
  const V4=gStd('V4',ST_SLUG).val, NEED=parseInt(String(V4).replace(/[^0-9]/g,''),10)||2;
  const PAYAPP=gStd('P7',ST_SLUG).val;
  const STEP_NM=['신청 내역 조회','결제 증빙','관광지 인증','최종 확인','완료'];
  const T={app:null,items:[],fetched:false,fetching:false,lodging:{file:null},visits:[],fraud:false,terms:false,sign:'',dirty:false};
  let FIX=null, fixFiles=[], OCR=null, ocrBusy=false, upOpen=false, stay=false, prepay=false, lastDemo=null, view='';
  const $=id=>document.getElementById(id);
  const dueOf=a=>gYmd(gAdd(a.end,C1));

  function band(){
    $('stBand').style.setProperty('--rc',R.color);
    $('stBand').innerHTML='<div class="g-in"><div><h1>'+gEsc(R.full)+' 정산신청</h1><p>여행 종료 후 '+C1+'일 이내 · 심사 후 '+U1+'일 이내 모바일 '+gEsc(R.voucher)+' 지급</p></div>'+
      '<p>결제수단 '+gEsc(PAYAPP)+' · 지정관광지 '+gEsc(V4)+' 인증</p></div>';
  }
  function steps(k){
    const el=$('stSteps'); if(!k){ el.style.display='none'; return; }
    el.style.display=''; el.innerHTML=STEP_NM.map((n,i)=>'<li class="'+(i+1<k?'done':(i+1===k?'on':''))+'">'+n+'</li>').join('');
  }
  function show(html,k){ steps(k); $('stView').innerHTML=html; window.scrollTo(0,0); }
  function go(k){ view='s'+k; if(k===1) s1(); else if(k===2) s2(); else if(k===3) s3(); else if(k===4) s4(); }

  function boot(){
    band();
    if(!U){
      return show('<div class="card"><h2 class="st-h">로그인 안내</h2><p class="st-sub">정산신청은 <b>디지털 관광주민증 로그인</b> 후 승인된 신청 건을 자동으로 불러와 진행합니다.</p>'+
        '<div class="st-login"><div><b>📋 신청 이력 자동 확인</b>승인 완료된 반값여행 신청 건을 자동으로 조회합니다.</div>'+
        '<div><b>💳 결제내역 자동 불러오기</b>'+gEsc(PAYAPP)+' 결제내역을 불러와 인정·불인정을 바로 분류합니다.</div>'+
        '<div><b>📍 관광지 인증 자동 반영</b>여행 중 QR로 인증한 지정관광지가 자동으로 입력됩니다.</div></div>'+
        '<div class="st-nav" style="justify-content:center"><a class="btn pri lg" href="'+gEsc(gLoginUrl())+'">디지털 관광주민증 로그인</a></div></div>',0);
    }
    const fx=gQS('fix');
    if(fx){
      const a=gApp(fx);
      if(!a||a.uid!==U.id) return blockView('❓','보완할 정산 건을 찾을 수 없어요','<p>본인 신청 건만 보완할 수 있습니다.</p>');
      if(a.status!=='settle_fix') return blockView('ℹ️','정산 보완 요청 상태가 아니에요','<p>현재 상태: '+gBadge(a.status)+'</p>','<a class="btn pri" href="mypage.html?app='+encodeURIComponent(a.id)+'">신청 상세 보기</a>');
      if(a.region!==ST_SLUG){ location.replace('settle.html?r='+encodeURIComponent(a.region)+'&fix='+encodeURIComponent(a.id)); return; }
      FIX=a; T.app=a;
      const s=a.settle||{};
      T.items=(s.items||[]).map(x=>{ const y=Object.assign({},x); delete y.ok; delete y.reason; return y; });
      T.fetched=T.items.some(x=>x.src==='localpay');
      T.lodging={file:s.lodging&&s.lodging.file||null};
      T.visits=(s.visits||a.visits||[]).slice();
      return go(4);
    }
    go(1);
  }
  function blockView(ic,title,desc,acts){
    show('<div class="card st-big"><div class="ic">'+ic+'</div><h2>'+title+'</h2>'+desc+'<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px">'+(acts||'<a class="btn pri" href="mypage.html">마이페이지</a>')+'</div></div>',0);
  }

  /* ═══ ① 신청 내역 조회 ═══ */
  function appState(a){
    const T0=gYmd(gToday());
    if(a.status==='approved'){
      if(T0<=a.end) return {ok:false,why:'여행 후 정산 가능 — '+gDot(gAdd(a.end,1))+'부터 신청할 수 있어요',trip:true};
      if(T0>dueOf(a)) return {ok:false,why:'정산 기한 경과 ('+gDot(dueOf(a))+'까지였습니다) — 담당 지자체에 문의해 주세요'};
      return {ok:true,due:'정산 기한 '+gDot(dueOf(a))+'까지 (D-'+gDiff(T0,dueOf(a))+')'};
    }
    if(a.status==='settle_fix') return {ok:false,fix:true,why:'정산 보완이 필요합니다'};
    if(['settle_review','refund_ok','refunded'].indexOf(a.status)>=0) return {ok:false,done:true,why:'정산 접수 완료'};
    if(['received','review','change_review','fix'].indexOf(a.status)>=0) return {ok:false,wait:true,why:'승인 후 정산할 수 있어요'};
    return {ok:false,why:'정산 대상이 아닙니다'};
  }
  function s1(){
    const list=gMyApps().filter(a=>a.region===ST_SLUG&&a.status!=='canceled'&&a.status!=='rejected');
    const okList=list.filter(a=>appState(a).ok);
    if(!T.app&&okList.length===1) T.app=okList[0];
    if(T.app&&!okList.some(a=>a.id===T.app.id)) T.app=null;
    const off=Number(gGet('dayOffset',0))||0;
    const cards=list.map(a=>{
      const st=appState(a), on=T.app&&T.app.id===a.id, g=a.grant||gGrant(a.type,a.people);
      let act='';
      if(st.ok) act='<button class="btn '+(on?'pri':'')+'" onclick="ST.pick(\''+a.id+'\')">'+(on?'✓ 선택됨':'이 건으로 정산')+'</button>';
      else if(st.fix) act='<a class="btn pri" href="settle.html?r='+ST_SLUG+'&fix='+encodeURIComponent(a.id)+'">보완하러 가기</a>';
      else if(st.done) act='<a class="btn" href="mypage.html?app='+encodeURIComponent(a.id)+'">진행 상황 보기</a>';
      else if(st.trip) act='<button class="btn sm ghost" onclick="ST.demoMove(\''+a.id+'\')" title="시연용">데모: 날짜 이동</button>';
      else if(st.wait) act='<button class="btn sm ghost" onclick="ST.demoApprove(\''+a.id+'\')" title="시연용">데모: 승인 처리</button>';
      return '<div class="st-app'+(on?' on':'')+(st.ok?'':' dis')+'"><div><b>'+gEsc(R.full)+' '+a.round+'회차 · '+gEsc(g.label)+' '+a.people.length+'명</b> '+gBadge(a.status)+
        '<div class="meta">신청번호 '+gEsc(a.id)+' · 여행 '+gDot(a.start)+' ~ '+gDot(a.end)+' · 최대 지원 '+gWon(g.cap)+'</div>'+
        (st.ok?'<div class="due">'+st.due+'</div>':'<div class="why">'+st.why+'</div>')+'</div><div>'+act+'</div></div>';
    }).join('');
    show('<div class="card"><h2 class="st-h">① 정산할 신청 건을 선택해 주세요</h2>'+
      '<p class="st-sub">디지털 관광주민증 로그인 정보로 '+gEsc(R.full)+' 신청 이력을 자동으로 확인했습니다. 승인 완료된 건만 정산할 수 있어요.</p>'+
      (list.length?cards:'<div class="note">'+gEsc(R.full)+'에 승인된 반값여행 신청이 없습니다. <a href="apply.html?r='+ST_SLUG+'" style="color:var(--blue);font-weight:700">사전신청하러 가기 ›</a></div>')+
      '<div class="st-demo"><b>시연 도구</b> — 데모 날짜 이동 '+(off?'<b>'+(off>0?'+':'')+off+'일</b> (오늘 = '+gDot(gToday())+') <button class="btn sm" onclick="ST.demoOff()">되돌리기</button>':'없음 (오늘 = '+gDot(gToday())+')')+
        (list.length?'':'<br><button class="btn sm" onclick="ST.demoMake()">데모: 여행을 마친 승인 건 만들기</button>')+
        '<div class="small">여행 전인 건은 [데모: 날짜 이동]으로 여행 종료 다음 날로 이동합니다. 날짜 이동은 모든 시안 G 화면에 적용됩니다.</div></div>'+
      '<div class="st-nav"><a class="btn" href="region.html?r='+ST_SLUG+'">취소</a><button class="btn pri" id="stNext1" onclick="ST.next1()"'+(T.app?'':' disabled')+'>다음 — 결제 증빙</button></div></div>',1);
  }
  function pick(id){
    const a=gApp(id); if(!a||!appState(a).ok) return;
    if(!T.app||T.app.id!==id){ T.app=a; T.items=[]; T.fetched=false; T.lodging={file:null}; T.visits=(a.visits||[]).slice(); OCR=null; }
    s1();
  }
  function next1(){ if(!T.app){ gToast('정산할 신청 건을 선택해 주세요','bad'); return; } if(!T.visits.length&&T.app.visits) T.visits=T.app.visits.slice(); go(2); }
  function demoMove(id){
    const a=gApp(id); if(!a) return;
    const off=(Number(gGet('dayOffset',0))||0)+gDiff(gToday(),a.end)+1;
    gSet('dayOffset',off); location.reload();
  }
  function demoOff(){ gSet('dayOffset',0); location.reload(); }
  function demoApprove(id){ gSetStatus(id,'approved',{by:'demo',memo:'시연용 승인 처리'}); gToast('시연용으로 승인 처리했어요','ok'); s1(); }
  function demoMake(){
    const id=gNewAppId(), at=gNow().toISOString(), me={name:U.name,birth:U.birth,rel:'본인',verified:'dju'};
    const rd=R.rounds[0];
    gPutApp({id,uid:U.id,userName:U.name,region:ST_SLUG,round:rd.n,type:'solo',people:[me],start:gYmd(gAdd(gToday(),-3)),end:gYmd(gAdd(gToday(),-1)),plan:'',docs:[],
      agree:{check:true,privacy:true,third:true},status:'approved',grant:gGrant('solo',[me]),createdAt:at,
      history:[{at,st:'received',by:'demo',memo:'시연용 신청'},{at,st:'approved',by:'demo',memo:'시연용 승인'}]});
    gToast('시연용 승인 건을 만들었어요','ok'); s1();
  }

  /* ═══ ② 결제 증빙 ═══ */
  function normAppr(v){ return String(v||'').replace(/[^0-9]/g,''); }
  function comboKey(e){
    const lead=String(e.card||'').replace(/[\s\-]/g,'').replace(/[^0-9]/g,'*').match(/^\d+/);
    if(!lead||lead[0].length<6||!e.amount||!e.at) return null;
    return lead[0].slice(0,6)+'|'+e.amount+'|'+String(e.at).slice(0,10);
  }
  /* 중복 제출 탐지 — 전 계정 정산 증빙(취소·반려 제외) + 지금 목록. 승인번호 또는 카드 앞6+금액+결제일 */
  function findDup(it,selfIdx){
    const ap=normAppr(it.approval), ck=comboKey(it);
    const hit=e=>(ap.length>=6&&normAppr(e.approval)===ap)?'appr':(ck&&comboKey(e)===ck?'combo':null);
    for(const a of gApps()){
      if(a.id===T.app.id||['canceled','rejected'].indexOf(a.status)>=0) continue;
      for(const e of ((a.settle&&a.settle.items)||[])){ const r=hit(e); if(r) return {reason:r,app:a.id,uid:a.uid,region:a.region,status:a.status,approval:e.approval||'',amount:e.amount}; }
    }
    for(let i=0;i<T.items.length;i++){ if(i===selfIdx) continue; const r=hit(T.items[i]); if(r) return {reason:r,app:T.app.id,uid:U.id,region:T.app.region,status:'(이번 정산)',approval:T.items[i].approval||'',amount:T.items[i].amount}; }
    return null;
  }
  function dupMsg(d){

    const rr=gRegion(d.region);
    return why+' (신청번호 '+d.app+' · '+(rr?rr.full:d.region)+' · 계정 '+d.uid+' · '+(G_ST[d.status]?G_ST[d.status].nm:d.status)+')';
  }

    if(!/^\d{6,9}$/.test(appr)) return fail('승인번호를 확인해 주세요 (숫자 6~9자리)');

    /* 판독값 ↔ 입력값 대조 */
    const fails=[];
    if(ex.appr){ if(ex.appr!==appr) fails.push('승인번호(영수증: '+ex.appr+')'); } else if(OCR.mode==='real'&&String(OCR.text).indexOf(appr)<0) fails.push('승인번호(영수증에서 확인 불가)');

    if(ex.date&&ex.date!==date) fails.push('결제일(영수증: '+ex.date+')');
    if(fails.length) return fail('❌ <b>입력값이 영수증 판독 결과와 다릅니다:</b> '+gEsc(fails.join(', '))+'. 영수증 표기와 같게 입력해 주세요.');

    const it={src:'upload',merchant:shop,cat:stay?'숙박':(biz.cat||'기타'),biz:biz.result==='excluded'?biz.biz:'',excluded:biz.result==='excluded',
      amount:amt,at:(ex.date||date)+'T12:00:00',approval:appr,card:cash?'':gCardMask(card),prepay:stay&&prepay,stay,
      ocr:{mode:OCR.mode,file:OCR.file,shop:ex.shop||null,card:ex.card||null,appr:ex.appr||null,amts:ex.amts||[],date:ex.date||null,region:gOcrRegionText(ex.region),nonCard:ex.nonCard||null,confidence:OCR.confidence},
      corp:null};

    T.items.push(it); T.dirty=true;

    const r=gSetStatus(a.id,'settle_review',{by:'user',memo:FIX?'정산 보완 재접수':'정산 접수',patch});
    doneView(r);
  }

  /* ═══ ⑤ 완료 ═══ */
  function doneView(a){
    view='s5';
    const s=a.settle;
    show('<div class="card st-big"><div class="ic">'+(FIX?'📨':'🎉')+'</div><h2>'+(FIX?'정산 보완이 재접수되었어요':'정산 접수가 완료되었어요')+'</h2>'+
      '<div class="st-no-big">정산번호 '+gEsc(s.id)+'</div>'+
      '<p><b>'+gEsc(R.full)+' '+a.round+'회차</b> · 신청번호 '+gEsc(a.id)+'</p>'+
      '<p>인정 금액 <b>'+gWon(s.recognized)+'</b> · 예상 환급액 <b style="color:var(--pri)">'+gWon(s.expected)+'</b></p>'+
      '<div class="note" style="text-align:left;max-width:540px;margin:18px auto 0">💬 담당자 심사 후 <b>'+U1+'일 이내 모바일 '+gEsc(R.voucher)+'</b>(지역상품권)으로 지급됩니다. 심사·지급 결과는 알림톡으로 알려드려요. 지급 예정일: '+gDot(gAdd(gToday(),U1))+' 무렵</div>'+
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px"><a class="btn pri lg" href="mypage.html?app='+encodeURIComponent(a.id)+'">마이페이지에서 확인</a><a class="btn lg" href="region.html?r='+ST_SLUG+'">지역 홈</a></div></div>',5);
  }

  return {boot,go,pick,next1,demoMove,demoOff,demoApprove,demoMake,fetchLp,demoPay,lodgeFile,delItem,upToggle,ocrFile,demoReceipt,setStay,setPre,addUpload,next2,
    addVisit,delVisit,next3,fixFile,fixDel,setA,setSign,submit,_T:T,view:()=>view,ocr:()=>OCR};
})();
ST.boot();
</script>
