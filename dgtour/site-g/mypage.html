<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>마이페이지 — 대한민국 반값여행 · 시안 G</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="g.css?v=1">
<style>
/* 마이페이지 전용 (착수보고 p23·p24) — 접두사 .my- */
:root{--my:#6d28d9;--my-2:#7c3aed;--my-l:#f3efff}
.my-wel{background:linear-gradient(100deg,#5b21b6,#7c3aed);color:#fff;border-radius:16px;padding:18px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.my-wel b{font-size:21px;letter-spacing:-.3px}
.my-wel span{opacity:.85;font-size:14px}
.my-wel a{margin-left:auto;font-size:13px;color:#e9ddff;border:1px solid rgba(255,255,255,.35);padding:5px 12px;border-radius:999px}
.my-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px;margin-top:14px}
.my-cash{background:linear-gradient(150deg,#6d28d9,#8b5cf6);color:#fff;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.my-cash small{opacity:.85;font-size:13px}
.my-cash .big{font-size:30px;font-weight:900;letter-spacing:-.5px;line-height:1.2}
.my-cash .sub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.my-cash .sub div{background:rgba(255,255,255,.16);border-radius:10px;padding:8px 10px}
.my-cash .sub small{display:block;font-size:11.5px}
.my-cash .sub b{font-size:17px}
.my-board{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.my-board-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.my-board-h b{font-size:16px}
.my-warn{background:var(--pri-l);color:var(--pri);font-weight:800;font-size:12.5px;padding:4px 12px;min-height:36px;border-radius:999px;border:0;cursor:pointer}
.my-stages{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.my-stage{border:1px solid var(--line);background:#f8fafc;border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:.15s}
.my-stage b{display:block;font-size:24px;font-weight:900;line-height:1.2}
.my-stage span{font-size:12.5px;color:var(--sub)}
.my-stage:hover{border-color:var(--my-2)}
.my-stage.on{border-color:var(--my-2);box-shadow:0 0 0 2px #ddd0ff inset;background:var(--my-l)}
.my-stage.fix{background:#fff1f2;border-color:#fecdd3} .my-stage.fix b,.my-stage.fix span{color:var(--pri)}
.my-stage.zero b{color:#cbd5e1}
.my-board p{margin:10px 0 0;font-size:12.5px;color:var(--mute)}
.my-quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.my-quick button{border:1px solid var(--line);background:#fff;border-radius:13px;padding:16px 10px;font-weight:800;font-size:15.5px;cursor:pointer}
.my-quick button:hover{border-color:var(--my-2);color:var(--my)}
.my-quick button.qr{background:#111827;color:#fff;border-color:#111827}
.my-quick button.qr:hover{background:#000;color:#fff}
.my-list{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.my-list>h2{margin:0 0 12px;font-size:18px}
.my-list>h2 small{color:var(--mute);font-weight:500;font-size:13px;margin-left:4px}
.my-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.my-tabs .chip.fixc{color:var(--pri);border-color:#fecdd3;background:#fff1f2}
.my-tabs .chip.on{background:#1e1b4b;border-color:#1e1b4b;color:#fff}
.my-card{display:grid;grid-template-columns:minmax(0,1.6fr) auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 12px;border-bottom:1px solid #f1f5f9;border-radius:10px}
.my-card.fix{background:#fff1f2;border-bottom-color:#fde2e6}
.my-card h4{margin:0;font-size:16px}
.my-card .meta{font-size:12.5px;color:var(--mute);margin-top:2px}
.my-card .amt{text-align:right;font-weight:800;font-size:16px}
.my-card .amt small{display:block;font-size:11.5px;color:var(--mute);font-weight:500}
.my-card .acts{display:flex;gap:6px;justify-content:flex-end}
.btn.red{background:#e11d48;border-color:#e11d48;color:#fff}
.btn.red:hover{background:#be123c}
.btn.purple{background:var(--my-2);border-color:var(--my-2);color:#fff}
.my-more{display:block;width:100%;margin-top:10px;border:0;background:#f8fafc;border-radius:10px;padding:10px;color:var(--sub);cursor:pointer;font-size:13.5px}
.my-empty{padding:30px;text-align:center;color:var(--mute)}
.my-boxes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.my-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:800}
.my-box:hover{border-color:var(--my-2)}
.my-box em{font-style:normal;color:var(--my-2)}
.my-box small{color:var(--my-2);font-weight:600;font-size:13px}
.my-box small.ok{color:#16a34a}
.my-box i{font-style:normal;font-size:11.5px;background:var(--pri);color:#fff;border-radius:999px;padding:1px 7px}
.my-demo{margin-top:26px;background:#f1f5f9;border:1px dashed #cbd5e1;border-radius:12px;padding:12px 14px;font-size:13px;color:#475569;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.my-demo b{color:#334155}
.my-demo .sp{flex:1}
.my-demo button{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer}
/* 알림 모달 */
.my-nh{display:flex;align-items:baseline;gap:6px} .my-nh small{color:var(--mute);font-size:15px}
.my-keep{background:#f6f7fb;border-radius:10px;text-align:center;color:var(--sub);font-size:13.5px;padding:9px;margin:4px 0 6px}
.my-ni{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:flex-start}
.my-ni:hover{background:#fafafa}
.my-ni>i{flex:none;width:11px;height:11px;border-radius:50%;margin-top:6px}
.my-ni div{flex:1;min-width:0}
.my-ni b{font-size:15px} .my-ni p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.my-ni time{flex:none;color:var(--mute);font-size:12.5px}
.my-ni.read b{color:#64748b;font-weight:600}
.my-nf{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:13px;color:var(--mute)}
.my-nf button{border:0;background:none;color:var(--sub);cursor:pointer;font-size:13px}
/* QR 모달 */
.my-sel{display:flex;align-items:center;gap:8px;border:1px solid #e2e5ee;border-radius:10px;padding:4px 10px;margin-bottom:12px}
.my-sel span{white-space:nowrap;font-size:14px;color:var(--sub)}
.my-sel select{flex:1;min-width:0;border:0;padding:8px 2px;font-size:15px;background:transparent}
.my-vf{position:relative;height:200px;background:#11111b;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#a7f3d0;font-weight:700}
.my-vf .c{position:absolute;width:26px;height:26px;border:3px solid #fff;border-radius:3px}
.my-vf .c1{left:32%;top:18%} .my-vf .c2{right:32%;top:18%} .my-vf .c3{left:32%;bottom:18%}
.my-vf .c4{right:32%;bottom:18%}
.my-vf .ln{position:absolute;left:36%;right:36%;height:3px;background:#4ade80;box-shadow:0 0 12px #4ade80;top:20%;animation:myscan 1.8s ease-in-out infinite alternate}
@keyframes myscan{to{top:78%}}
.my-vf .msg{position:relative;z-index:2;background:rgba(0,0,0,.55);padding:6px 12px;border-radius:999px;font-size:14px}
.my-vf.busy .ln{animation-duration:.5s;background:#facc15;box-shadow:0 0 12px #facc15}
.my-spots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}
.my-spot{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;cursor:pointer;font-size:14px}
.my-spot input{accent-color:var(--my-2)}
.my-spot.done{background:#effbf8;border-color:#a7e3d6;color:var(--ok);cursor:default}
.my-qn{font-size:13.5px;color:var(--sub);margin:8px 0}
.my-qn div{margin:2px 0}
/* 상세 창 (p24) */
.my-dh{display:flex;align-items:flex-start;gap:12px;padding-right:96px;position:relative}
.my-dh h3{margin:8px 0 0;font-size:21px}
.my-stamp{position:absolute;right:40px;top:-8px;width:76px;height:76px;border:3px solid #d63d24;border-radius:50%;color:#d63d24;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;transform:rotate(-12deg);opacity:.85}
.my-d .prog span.done::before,.my-d .prog span.done::after,.my-d .prog span.cur::after{background:var(--my-2)}
.my-d .prog span.cur{color:var(--my);font-weight:800} .my-d .prog span.cur::before{background:var(--my-2);box-shadow:0 0 0 4px #ddd0ff}
.my-d .prog span.cur.bad{color:var(--pri)} .my-d .prog span.cur.bad::before{background:#e11d48;box-shadow:0 0 0 4px #fecdd3}
.my-todo{border-radius:14px;padding:16px;margin:14px 0;background:#f8fafc;border:1px solid var(--line)}
.my-todo.fix{background:#fff1f2;border-color:#fecdd3}
.my-todo h4{margin:0 0 8px;font-size:16px}
.my-todo.fix h4{color:#e11d48}
.my-todo p{margin:4px 0;font-size:14px;color:#334155}
.my-file{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid #fde2e6;border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.my-file span{color:var(--sub);font-size:13px}
.my-ph{background:#f1f5f9;border-radius:10px;text-align:center;color:var(--sub);padding:14px;font-size:13.5px;margin:10px 0}
.my-link{border:0;background:none;color:var(--my);font-weight:800;font-size:16px;cursor:pointer;padding:0}
.my-link:disabled{color:var(--mute);cursor:not-allowed}
.my-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:6px 0 10px}
.my-3 div{background:#f6f7fb;border-radius:10px;text-align:center;padding:12px 6px}
.my-3 small{display:block;font-size:12px;color:var(--sub)}
.my-3 b{font-size:19px}
.my-3 .bad b{color:#e11d48} .my-3 .pay{background:var(--my-l)} .my-3 .pay b{color:var(--my)}
.my-d details{background:#effbf8;border-radius:10px;margin:8px 0}
.my-d summary{cursor:pointer;color:#15803d;font-weight:800;padding:10px;text-align:center;font-size:14px}
.my-d details .tbl{font-size:13px}
.my-pin{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:14px}
.my-pin code{white-space:nowrap;font-size:15px;background:#fff;border:1px solid var(--line);padding:4px 8px;border-radius:7px;letter-spacing:1px}
.my-sec{margin-top:18px}
.my-sec h5{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:700}
.my-kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;font-size:14px}
.my-kv dt{color:var(--sub)} .my-kv dd{margin:0;font-weight:600}
.my-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid #e2e8f0}
.my-tl li{position:relative;padding:4px 0 10px 8px;font-size:13.5px}
.my-tl li::before{content:'';position:absolute;left:-21px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--my-2);border:2px solid #fff}
.my-tl time{color:var(--mute);font-size:12.5px;margin-right:6px}
.my-tl em{font-style:normal;color:var(--sub)}
.my-ok{color:#15803d;font-weight:700;white-space:nowrap} .my-no{color:#e11d48;font-weight:700;white-space:nowrap}
.my-pin .btn{white-space:nowrap}
.my-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.my-err{color:#e11d48;font-size:13px;min-height:18px;margin-top:6px}
@media (max-width:960px){
  .my-top{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .my-wel b{font-size:18px}
  .my-stages{gap:5px} .my-stage b{font-size:20px} .my-stage span{font-size:11px}
  .my-quick{grid-template-columns:minmax(0,1fr)}
  .my-quick button{padding:13px 10px}
  .my-card{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .my-card .amt{text-align:left}
  .my-card .acts{grid-column:1 / -1;justify-content:stretch}
  .my-card .acts .btn{flex:1}
  .my-boxes{grid-template-columns:minmax(0,1fr)}
  .my-3 b{font-size:16px}
  .my-spots{grid-template-columns:minmax(0,1fr)}
  .my-dh{padding-right:70px} .my-stamp{width:62px;height:62px;font-size:13px;right:46px;top:-6px}
  .my-kv{grid-template-columns:90px minmax(0,1fr)}
  .g-mbox{padding:20px 16px}
  .my-d .tbl th,.my-d .tbl td{padding:8px 6px;font-size:13px}
  .my-d .tbl .rsn{display:block}
}
.my-nw{white-space:nowrap}
</style>
</head><body>
<main>
  <div class="wrap">
    <div class="my-wel" id="myWel"></div>
    <div class="my-top">
      <div class="my-cash" id="myCash"></div>
      <div class="my-board" id="myBoard"></div>
    </div>
    <div class="my-quick">
      <button class="qr" onclick="myQR()">QR 방문 인증</button>
      <button onclick="myMerchants()">디지털 관광주민증 가맹점 찾기</button>
      <button onclick="myForms()">서류 양식</button>
    </div>
    <section class="my-list" id="list">
      <h2>신청 내역<small id="myCnt"></small></h2>
      <div class="my-tabs" id="myTabs" role="tablist"></div>
      <div id="myCards"></div>
    </section>
    <div class="my-boxes">
      <div class="my-box" id="noti" role="button" tabindex="0" onclick="myNotiAll()"></div>
      <div class="my-box" id="myInq" role="button" tabindex="0" onclick="myInqList()"></div>
    </div>
    <div class="my-demo" id="myDemo"></div>
  </div>
</main>
<script src="../site-assets/data.js?v=20260818a"></script>
<script src="g.js?v=1"></script>
<script>
gShell({mode:'my',active:'my'});
/* ── 상태 ── */
var MY={filter:'all',more:false,qrScan:false};
var ME=gUser();

function myInit(){
  mySeedInquiry();
  myRender();
  var id=gQS('app');
  if(id&&gApp(id)&&gApp(id).uid===ME.id) myDetail(id);
  else if(location.hash==='#noti') myNotiAll();
  document.querySelectorAll('.my-box').forEach(function(b){ b.addEventListener('keydown',function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); b.click(); } }); });
}

/* 시드 알림의 '문의 답변'과 맞도록 내 문의 1건(답변완료)을 만든다 — 계정당 1회 */
function mySeedInquiry(){
  if(gUGet('myInqSeeded',false)) return;
  var mine=myApps(), fixApp=mine.find(function(a){return a.status==='fix';});
  var l=gInquiries();
  if(!l.some(function(q){return q.uid===ME.id;})&&fixApp){
    var T=gToday();
    l.push({id:'Q'+gSeq(),region:fixApp.region,uid:ME.id,name:gMask(ME.name),title:'동행자 변경이 가능한가요?',
      body:'승인 후 동행자를 바꿀 수 있나요?',secret:true,at:gYmd(gAdd(T,-2)),demo:true,
      answer:{body:'여행 시작 2일 전까지 마이페이지 상세 창의 [여행 일정 변경]에서 요청하시면 재승인 후 반영됩니다.',at:gYmd(gAdd(T,-1))}});
    gSaveInquiries(l);
  }
  gUSet('myInqSeeded',true);
}

/* ── 공용 계산 ── */
function myApps(){ return gMyApps(ME.id); }
function myStage(a){ return (G_ST[a.status]||{}).stage; }
function myIsFix(a){ return a.status==='fix'||a.status==='settle_fix'; }
function myTypeNm(a){
  if(a.type==='team') return (a.grant&&a.grant.label==='청년팀')?'청년팀':'단체';
  return {solo:'개인',youth:'청년',family:'가족'}[a.type]||gTypeName(a.type);
}
function myTitle(a){ var r=gRegion(a.region); return (r?r.full:a.region)+' · '+a.round+'차 · '+myTypeNm(a)+' '+((a.people||[]).length||1)+'인'; }
function mySum(list,f){ return list.reduce(function(s,a){ return s+(Number(f(a))||0); },0); }
function myFixUrl(a){
  var tgt=(a.fix&&a.fix.target)||(a.status==='settle_fix'?'settle':'apply');
  return (tgt==='settle'?'settle.html':'apply.html')+'?r='+encodeURIComponent(a.region)+'&fix='+encodeURIComponent(a.id);
}
function myNeed(slug){ var v=gStd('V4',slug); return parseInt(v&&v.val,10)||2; }
function myDays(s,e){ var n=gDiff(s,e); return n+'박 '+(n+1)+'일'; }
/* 조사 '(으)로' — 받침 없음·ㄹ받침이면 '로' (gJosa 는 두 글자 짝만 다뤄 따로 둠) */
function myRo(w){ var c=String(w||'').trim().slice(-1).charCodeAt(0); if(!(c>=0xAC00&&c<=0xD7A3)) return '(으)로'; var j=(c-0xAC00)%28; return (j===0||j===8)?'로':'으로'; }
function myRange(a){ return gDot(a.start)+' ~ '+gMD(a.end); }

/* ── 렌더 ── */
function myRender(){
  var apps=myApps();
  /* 1. 환영 헤더 */
  document.getElementById('myWel').innerHTML='<b>'+gEsc(ME.name)+' 님 환영합니다</b><span>디지털 관광주민증 인증 · '+gEsc(ME.addr)+'</span>'+
    '<a href="#" onclick="gLogout();return false">로그아웃</a>';
  /* 2. 환급액 */
  var got=mySum(apps.filter(function(a){return a.status==='refunded';}),function(a){return a.refund&&a.refund.amount;});
  var setl=mySum(apps.filter(function(a){return ['settle_review','settle_fix','refund_ok'].indexOf(a.status)>=0;}),function(a){return a.settle&&a.settle.expected;});
  var trip=mySum(apps.filter(function(a){return a.status==='approved'||a.status==='change_review';}),function(a){return a.grant&&a.grant.cap;});
  document.getElementById('myCash').innerHTML='<div><small>받은 환급액</small><div class="big">'+gWon(got)+'</div></div>'+
    '<div class="sub"><div><small>정산 심사 중</small><b>+'+gWon(setl)+'</b></div><div><small>여행 예정 · 최대 환급 가능</small><b>+'+gWon(trip)+'</b></div></div>';
  /* 3. 단계판 */
  var cnt={}; G_STAGES.forEach(function(s){ cnt[s[0]]=0; });
  apps.forEach(function(a){ var s=myStage(a); if(cnt[s]!=null) cnt[s]++; });
  document.getElementById('myBoard').innerHTML='<div class="my-board-h"><b>신청 현황</b>'+
    (cnt.fix?'<button class="my-warn" onclick="mySetFilter(\'fix\',true)">⚠ 보완이 필요한 신청 '+cnt.fix+'건</button>':'')+'</div>'+
    '<div class="my-stages">'+G_STAGES.map(function(s){
      return '<div class="my-stage'+(s[0]==='fix'&&cnt.fix?' fix':'')+(cnt[s[0]]?'':' zero')+(MY.filter===s[0]?' on':'')+'" role="button" tabindex="0" onclick="mySetFilter(\''+s[0]+'\',true)">'+
        '<b>'+cnt[s[0]]+'</b><span>'+s[1]+'</span></div>';
    }).join('')+'</div><p>단계를 누르면 아래 목록이 해당 신청만 보여요</p>';
  /* 5. 신청 내역 */
  document.getElementById('myCnt').textContent=apps.length+'건';
  document.getElementById('myTabs').innerHTML=[['all','전체',apps.length]].concat(G_STAGES.map(function(s){return [s[0],s[1],cnt[s[0]]];})).map(function(t){

function myScan(id){
  if(MY.qrScan) return;
  var el=document.querySelector('input[name=mySpot]:checked'); if(!el){ gToast('인증할 관광지를 선택해 주세요','bad'); return; }

  MY.qrScan=true;
  var vf=document.getElementById('myVF'), m=document.getElementById('myVFm'), b=document.getElementById('myQB');
  vf.classList.add('busy'); m.textContent='📍 GPS 확인 중… (관광지 반경 확인)'; b.disabled=true;
  setTimeout(function(){
    MY.qrScan=false;

      (ended?'<a class="btn block" href="settle.html?r='+encodeURIComponent(a.region)+'">정산 신청하러 가기 ›</a><p class="small muted tc">정산 기한: '+gDot(due)+'까지 (여행 종료 후 '+(gStdNum('C1')||10)+'일 이내)</p>'
        :started?'<p class="small muted">여행 중입니다. 지역화폐로 결제하고 지정관광지에서 QR 방문 인증을 해 주세요. 여행이 끝나면 정산신청을 할 수 있어요.</p>'
        :'<p class="small muted">여행 시작까지 D-'+gDiff(T,a.start)+' · 여행 종료 후 정산신청을 할 수 있어요.</p><div class="my-row"><button class="btn sm" data-id="'+gEsc(a.id)+'" onclick="myCancelAsk(this.dataset.id)">신청 취소</button></div>')+'</div>';
  } else if(s==='change_review'){
    var c=a.change||{}, p=c.prev||{start:a.start,end:a.end};
    h='<div class="my-todo"><h4>📅 일정 변경 심사중</h4><p>'+gDot(p.start)+' ~ '+gMD(p.end)+' → <b>'+gDot(c.start||a.start)+' ~ '+gMD(c.end||a.end)+'</b></p>'+
      (c.reason?'<p class="small muted">변경 사유: '+gEsc(c.reason)+'</p>':'')+(c.at?'<p class="small muted">요청일시: '+gDT(c.at)+'</p>':'')+
      '<p class="small">재승인 결과는 알림톡으로 안내드립니다. 재승인 전까지는 기존 일정이 유효합니다.</p></div>';
  } else if(s==='settle_review'||s==='refund_ok'){
    var st=a.settle||{};
    h='<div class="my-todo"><h4>'+(s==='refund_ok'?'✓ 환급 승인 — 지급 대기':'🧾 정산 심사 중')+'</h4>'+myThree(st,null)+myItems(st,true)+
      '<p class="small">예상 환급액 <b>'+gWon(st.expected)+'</b> · 심사 후 '+(gStdNum('U1')||14)+'일 이내 '+gEsc(r.voucher)+myRo(r.voucher)+' 지급됩니다.</p>'+
      (st.id?'<p class="small muted">정산번호 '+gEsc(st.id)+(st.at?' · 접수 '+gDT(st.at):'')+'</p>':'')+'</div>';
  } else if(s==='settle_fix'){
    var f2=a.fix||{};
    h='<div class="my-todo fix"><h4>⚠ 정산 보완 '+(f2.due?gMD(f2.due)+'까지':'')+'</h4><p>'+gEsc(f2.reason||myLastMemo(a)||'보완 사유를 확인해 주세요')+'</p>'+
      '<div class="my-file"><b>📎 보완 증빙</b><span>↑ 파일 첨부는 정산신청 최종 확인 단계에서 합니다</span></div>'+
      '<a class="btn block red" href="'+myFixUrl(a)+'">수정하러 가기 ›</a></div>';
  } else if(s==='refunded'){
    var st2=a.settle||{}, rf=a.refund||{};
    var mask=myPinMask(rf.pin);
    h='<div class="my-todo">'+myThree(st2,rf.amount)+myItems(st2,false)+
      '<p class="small">지급일 '+(rf.paidAt?gDot(rf.paidAt):'-')+' · '+gEsc(r.voucher)+'</p>'+
      '<div class="my-pin"><span>PIN 번호</span><code id="myPin" data-on="0">'+gEsc(mask)+'</code>'+
      '<button class="btn sm" data-id="'+gEsc(a.id)+'" onclick="myPinToggle(this.dataset.id)">보기</button>'+
      (rf.registered?'<span class="my-ok">앱 등록 완료</span>':'<span class="my-no">미등록</span> <a class="btn sm purple" href="localpay.html?r='+encodeURIComponent(a.region)+'">PIN 등록하러 가기</a>')+'</div>'+
      '<p class="small muted">본인 명의 앱에만 등록할 수 있으며 재발급되지 않습니다.</p></div>';
  } else if(s==='rejected'||s==='canceled'){
    h='<div class="my-todo"><h4>'+(s==='rejected'?'반려된 신청입니다':'취소된 신청입니다')+'</h4><p>사유: '+gEsc(myLastMemo(a)||'-')+'</p>'+
      (s==='canceled'?'<p class="small muted">취소한 건은 연간 신청 횟수에 포함되지 않습니다.</p>':'')+'</div>';
  }
  return h;
}
function myLastMemo(a){ var h=(a.history||[]).filter(function(x){return x.st===a.status&&x.memo;}); return h.length?h[h.length-1].memo:''; }
function myThree(st,paid){
  var rec=Number(st.recognized)||0, rej=Number(st.rejectedAmt)||0;
  return '<div class="my-3"><div><small>인정 금액</small><b>'+gWon(rec)+'</b></div><div class="bad"><small>불인정</small><b>'+gWon(rej)+'</b></div>'+
    '<div class="pay"><small>'+(paid!=null?'환급 완료':'예상 환급액')+'</small><b>'+gWon(paid!=null?paid:st.expected)+'</b></div></div>';
}
function myItems(st,all){
  var it=st.items||[], ok=it.filter(function(x){return x.ok;});
  var rows=(all?it:ok);
  if(!rows.length) return '';
  return '<details'+(all?' open':'')+'><summary>'+(all?'정산 내역 '+it.length+'건 (인정 '+ok.length+' · 불인정 '+(it.length-ok.length)+')':'✓ 인정 내역 '+ok.length+'건 (건별 금액 공개)')+'</summary>'+
    '<div class="tbl-wrap" style="border:0;border-radius:0 0 10px 10px"><table class="tbl"><thead><tr><th>결제일</th><th>업소</th><th>업종</th><th class="tr">금액</th><th>판정</th></tr></thead><tbody>'+
    rows.map(function(x){ return '<tr><td>'+gMD(String(x.at||'').slice(0,10))+'</td><td>'+gEsc(x.merchant)+'</td><td>'+gEsc(x.cat)+'</td><td class="tr">'+gWon(x.amount)+'</td><td>'+
      (x.ok?'<span class="my-ok">인정</span>':'<span class="my-no">불인정</span> <span class="small muted rsn">'+gEsc(x.reason||'')+'</span>')+'</td></tr>'; }).join('')+
    '</tbody></table></div></details>'+
    ((st.visits||[]).length?'<p class="small muted">방문 인증 '+st.visits.length+'곳: '+st.visits.map(function(v){return gEsc(v.spot);}).join(', ')+'</p>':'');
}
function myPinMask(pin){ return String(pin||'').replace(/^(\d{4})-.*$/,'$1-****-****'); }
function myPinToggle(id){
  /* 저장값을 onclick 문자열로 넘기지 않고 신청 id 로 다시 찾는다 */
  var a=gApp(id), c=document.getElementById('myPin'); if(!c||!a||a.uid!==ME.id||!a.refund) return;
  var pin=String(a.refund.pin||''), mask=myPinMask(pin);
  var on=c.getAttribute('data-on')==='1';
  c.textContent=on?mask:pin; c.setAttribute('data-on',on?'0':'1');
  c.nextElementSibling.textContent=on?'보기':'가리기';
}

/* 신청 취소 (p9: 확인 팝업 → "신청이 취소되었어요") */
function myCancelAsk(id){
  var a=gApp(id); if(!a) return;
  gModal('<h3>신청을 취소할까요?</h3><p>'+gEsc(myTitle(a))+' · '+myRange(a)+'</p>'+
    '<div class="note warn">취소하면 되돌릴 수 없습니다. 다시 여행하려면 새로 사전신청해야 합니다.</div>'+
    '<div class="my-row" style="justify-content:flex-end"><button class="btn" data-id="'+gEsc(id)+'" onclick="myDetail(this.dataset.id)">돌아가기</button>'+
    '<button class="btn red" data-id="'+gEsc(id)+'" onclick="myCancel(this.dataset.id)">신청 취소</button></div>');
}
function myCancel(id){
  var a=gApp(id); if(!a||['received','review','approved','fix'].indexOf(a.status)<0){ gToast('취소할 수 없는 상태입니다','bad'); return; }
  gSetStatus(id,'canceled',{by:'user',memo:'신청자 취소'});
  gToast('신청이 취소되었어요');
  myRender(); myDetail(id);
}

/* 일정 변경 창 (p22·p24) */
function myChange(id){
  var a=gApp(id); if(!a||a.status!=='approved') return;
  var r=gRegion(a.region), rd=r.rounds.find(function(x){return x.n===a.round;})||{travelStart:a.start,travelEnd:a.end};
  var minS=gYmd(gAdd(gToday(),gStdNum('A1')||2)); if(minS<rd.travelStart) minS=rd.travelStart;
  var maxD=gStdNum('C5')||7;
  var ok=minS<=rd.travelEnd;
  gModal('<h3>📅 여행 일정 변경</h3><p class="muted small">'+gEsc(myTitle(a))+' · 현재 일정 '+gDot(a.start)+' ~ '+gMD(a.end)+'</p>'+
    '<div class="note"><b>변경하면 지자체 재승인이 필요합니다.</b><br>· 같은 회차 여행기간('+gDot(rd.travelStart)+' ~ '+gMD(rd.travelEnd)+') 안에서만 변경<br>· 새 시작일은 오늘부터 '+(gStdNum('A1')||2)+'일 뒤('+gMD(minS)+')부터 · 여행 일정 최대 '+maxD+'일<br>· 재승인 결과는 알림톡으로 안내되며, 그 전까지는 기존 일정이 유효합니다</div>'+
    (ok?'<div class="grid g2"><div><label class="f" for="myCS">새 시작일</label><input class="inp" type="date" id="myCS" min="'+minS+'" max="'+rd.travelEnd+'" value="'+(a.start>=minS?a.start:minS)+'" data-id="'+gEsc(id)+'" oninput="myChkChange(this.dataset.id)"></div>'+
      '<div><label class="f" for="myCE">새 종료일</label><input class="inp" type="date" id="myCE" min="'+minS+'" max="'+rd.travelEnd+'" value="'+(a.start>=minS?a.end:gYmd(gAdd(minS,gDiff(a.start,a.end))))+'" data-id="'+gEsc(id)+'" oninput="myChkChange(this.dataset.id)"></div></div>'+
      '<label class="f" for="myCR">변경 사유</label><textarea class="inp" id="myCR" maxlength="200" placeholder="예) 동행자 일정 변경으로 출발일 조정" data-id="'+gEsc(id)+'" oninput="myChkChange(this.dataset.id)"></textarea>'+
      '<div class="my-err" id="myCErr"></div><div class="my-row" style="justify-content:flex-end"><button class="btn" data-id="'+gEsc(id)+'" onclick="myDetail(this.dataset.id)">취소</button>'+
      '<button class="btn purple" id="myCB" data-id="'+gEsc(id)+'" onclick="myChangeSubmit(this.dataset.id)">일정 변경 요청</button></div>'
      :'<div class="note warn">이번 회차 여행기간 안에서 변경할 수 있는 날짜가 없습니다.</div><div class="my-row"><button class="btn" data-id="'+gEsc(id)+'" onclick="myDetail(this.dataset.id)">돌아가기</button></div>'));
  if(ok) myChkChange(id);
}
function myChkChange(id){
  var a=gApp(id), r=gRegion(a.region), rd=r.rounds.find(function(x){return x.n===a.round;})||{travelStart:a.start,travelEnd:a.end};
  var s=document.getElementById('myCS').value, e=document.getElementById('myCE').value, why=document.getElementById('myCR').value.trim();
  var minS=gYmd(gAdd(gToday(),gStdNum('A1')||2)); if(minS<rd.travelStart) minS=rd.travelStart;
  var maxD=gStdNum('C5')||7, err='';
  if(!s||!e) err='시작일과 종료일을 선택해 주세요.';
  else if(s<minS) err='새 시작일은 '+gDot(minS)+' 이후여야 합니다. (여행 '+(gStdNum('A1')||2)+'일 전까지 신청)';
  else if(e>rd.travelEnd||s>rd.travelEnd) err='같은 회차 여행기간('+gMD(rd.travelEnd)+'까지) 안에서만 변경할 수 있습니다.';
  else if(e<s) err='종료일이 시작일보다 빠릅니다.';
  else if(gDiff(s,e)+1>maxD) err='여행 일정은 최대 '+maxD+'일입니다. (선택: '+(gDiff(s,e)+1)+'일)';
  else if(s===a.start&&e===a.end) err='현재 일정과 같습니다.';
  else if(!why) err='변경 사유를 입력해 주세요.';
  var el=document.getElementById('myCErr');
  el.style.color=err?'':'var(--ok)';
  el.textContent=err||('✓ '+gDot(s)+' ~ '+gMD(e)+' ('+myDays(s,e)+')로 변경을 요청합니다.');
  document.getElementById('myCB').disabled=!!err;
  return err?null:{s:s,e:e,why:why};
}
function myChangeSubmit(id){
  var v=myChkChange(id); if(!v) return;
  var a=gApp(id), r=gRegion(a.region);
  gSetStatus(id,'change_review',{by:'user',memo:'일정 변경 요청',patch:{change:{start:v.s,end:v.e,reason:v.why,at:gNow().toISOString(),prev:{start:a.start,end:a.end}}}});
  gNotify(ME.id,'change',a.region,'일정 변경','일정 변경 심사중 — '+r.full+' '+a.round+'회차 일정을 '+gMD(v.s)+'~'+gMD(v.e)+'로 변경 요청했습니다. 재승인 결과는 알림톡으로 안내드립니다.','mypage.html?app='+id,false);
  gToast('일정 변경을 요청했습니다');
  myRender(); myDetail(id);
}

/* ── 데모 편의 ── */
function myRenderDemo(){
  var off=Number(gGet('dayOffset',0))||0;
  document.getElementById('myDemo').innerHTML='<b>데모 편의</b><span>현재 데모 날짜 '+gDot(gToday())+' (실제 날짜 '+(off>=0?'+':'')+off+'일)</span><span class="sp"></span>'+
    '<button onclick="myShift(-7)">-7일</button><button onclick="myShift(1)">+1일</button><button onclick="myShift(7)">+7일</button><button onclick="myShift(null)">초기화</button>'+
    '<button onclick="myReseed()">시연 데이터 다시 만들기</button>';
}
function myShift(n,then){
  var off=Number(gGet('dayOffset',0))||0;
  gSet('dayOffset',n==null?0:off+n);
  location.href='mypage.html'+(then==='qr'?'?qr=1':'');
}
function myReseed(){
  if(!confirm('내 신청·알림을 모두 지우고 시연 데이터를 다시 만들까요?')) return;
  gSaveApps(gApps().filter(function(a){return a.uid!==ME.id;}));
  gUSet('noti',[]);
  gSaveInquiries(gInquiries().filter(function(q){return !(q.uid===ME.id&&q.demo);}));
  gUSet('myInqSeeded',false);
  try{ localStorage.removeItem(G_P+'seeded_'+ME.id); }catch(e){}
  gSeedDemo();
  location.href='mypage.html';
}
/* ── 시작 (모든 함수·상수 정의 뒤) ── */
if(gRequireLogin()){
  gSeedDemo();
  myInit();
  if(gQS('qr')) myQR();
}
</script>
</body></html>
