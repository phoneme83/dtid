<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>관리자 — 대한민국 반값여행 · 시안 G</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="g.css?v=1">
<style>
/* 관리자 전용 레이아웃 (admin.bangap.or.kr) — 접두사 .ad- */
body{background:#eef1f5}
.ad-top{position:sticky;top:0;z-index:60;background:#0b1325;color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px;min-height:58px;flex-wrap:wrap}
.ad-top .ad-logo{font-weight:900;font-size:16px;white-space:nowrap}
.ad-top .ad-logo small{font-weight:600;color:#94a3b8;font-size:12.5px;margin-left:6px}
.ad-top .ad-tr{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0}
.ad-top select{min-height:38px;border-radius:9px;border:1px solid #334155;background:#111c33;color:#e2e8f0;font-weight:700;padding:4px 10px;max-width:260px}
.ad-top a{color:#cbd5e1;font-size:13px;text-decoration:underline}
.ad-body{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 58px)}
.ad-side{background:#fff;border-right:1px solid var(--line);padding:16px 10px}
.ad-side .ad-who{font-size:12px;color:var(--sub);padding:0 10px 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.ad-side .ad-who b{display:block;color:var(--ink);font-size:13.5px}
.ad-side button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:10px;font-weight:700;color:#334155;cursor:pointer;font-size:14.5px;margin-bottom:2px}
.ad-side button:hover{background:#f1f5f9}
.ad-side button.on{background:var(--blue);color:#fff}
.ad-side button .n{margin-left:auto;background:var(--pri);color:#fff;border-radius:9px;font-size:11px;padding:1px 7px}
.ad-main{padding:20px 24px 70px;min-width:0}
.ad-crumb{background:#0f1b3d;color:#fff;border-radius:10px;padding:12px 16px;font-weight:800;margin-bottom:16px;font-size:14.5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad-crumb span{color:#94a3b8;font-weight:600}
.ad-crumb small{margin-left:auto;font-weight:600;color:#cbd5e1;font-size:12.5px}
.ad-h{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.ad-h h2{margin:0;font-size:20px}
.ad-h p{margin:0;color:var(--sub);font-size:13.5px}
.ad-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.ad-bar .inp{width:auto;min-width:0;padding:8px 10px;font-size:14px}
.ad-bar .sp{flex:1}
.ad-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-bottom:14px}
.ad-tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:11px;padding:9px 11px;cursor:pointer;text-align:left;font:inherit}
.ad-tile b{display:block;font-size:21px;line-height:1.2}
.ad-tile span{font-size:12px;color:var(--sub);font-weight:700}
.ad-tile.on{background:#fff7ed;box-shadow:0 0 0 2px var(--c) inset}
.ad-tbl td,.ad-tbl th{padding:9px 10px;font-size:13.5px}
.ad-tbl tbody tr{cursor:pointer}
.ad-idb{border:0;background:none;padding:2px 0;font:inherit;font-weight:800;color:var(--blue);text-decoration:underline;cursor:pointer;white-space:nowrap}
.ad-idb:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.ad-pg{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ad-tbl input[type=checkbox]{width:17px;height:17px}
.ad-sub{font-size:11.5px;color:var(--mute)}
.ad-empty{padding:36px;text-align:center;color:var(--sub);background:#fff;border:1px dashed #cbd5e1;border-radius:12px}
.ad-tag{display:inline-block;font-size:11px;font-weight:800;border-radius:7px;padding:2px 7px;white-space:nowrap;vertical-align:middle}
.ad-tag.lock{background:#e5e7eb;color:#6b7280}
.ad-tag.opt{background:#fff1ee;color:var(--pri);border:1px solid #fecaca}
.ad-tag.core{background:#eef4ff;color:var(--blue)}
.ad-tag.chk{background:#fef2f2;color:#b91c1c}
.ad-tag.human{background:#fff7ed;color:#9a3412;border:1px solid #fdba74}
.ad-tag.bad{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.ad-tag.ok{background:#ecfdf5;color:#047857;border:1px solid #a7f3d0}
.ad-tag.mute{background:#f1f5f9;color:#64748b}

/* 상세 모달 */
.ad-sec{margin-top:18px}
.ad-sec>h4{margin:0 0 8px;font-size:14.5px;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.ad-kv div{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed #eef0f3;font-size:13.5px;min-width:0}
.ad-kv span{flex:0 0 92px;color:var(--sub)}
.ad-kv b{font-weight:700;min-width:0;word-break:break-all}
.ad-chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ad-chip{font-size:12px;font-weight:700;border-radius:8px;padding:4px 9px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.ad-chip.bad{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.ad-chip.warn{background:#fff7ed;color:#9a3412;border-color:#fed7aa}
.ad-tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid #e2e8f0}
.ad-tl li{position:relative;padding:4px 0 8px 10px;font-size:13px}
.ad-tl li::before{content:'';position:absolute;left:-20px;top:9px;width:10px;height:10px;border-radius:50%;background:var(--c,#94a3b8);border:2px solid #fff}
.ad-tl small{color:var(--mute)}
.ad-acts{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:18px}
.ad-acts .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ad-acts textarea.inp{min-height:64px;margin-top:8px;font-size:14px}
.ad-acts .inp{font-size:14px}
.btn.bad{border-color:#b91c1c;color:#b91c1c;background:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.ad-box{border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:13.5px;margin:8px 0;background:#fff}
.ad-box.warn{background:#fff7ed;border-color:#fdba74;color:#7c2d12}
.ad-box.bad{background:#fef2f2;border-color:#fecaca;color:#991b1b}
.ad-box.ok{background:#f0fdf4;border-color:#bbf7d0;color:#14532d}
.ad-box.info{background:#eff6ff;border-color:#bfdbfe;color:#1e3a8a}
.ad-it td{vertical-align:top}
.ad-it td.amt,.ad-it td:nth-child(5){white-space:nowrap}
.ad-it .btn.sm{white-space:nowrap;padding:6px 9px;font-size:12.5px;margin:0 0 4px}
.ad-it .ad-btns{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.ad-it .ad-btns .btn.sm{margin:0}
#gModal .g-mbox.wide{max-width:min(1040px,100%)}
.ad-it .off td{background:#fafafa;color:#6b7280}
.ad-it .off td.amt{text-decoration:line-through}
.ad-it .sub td{background:#fffbeb;cursor:default}
.ad-mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.ad-mini label{font-size:12px;color:var(--sub);font-weight:700}
.ad-mini .inp{padding:7px 9px;font-size:13.5px;margin-top:3px}
.ad-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.ad-sum div{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px}
.ad-sum b{display:block;font-size:18px}
.ad-sum span{font-size:12px;color:var(--sub);font-weight:700}
.ad-sum .hl{border-color:var(--ok);background:#effbf8}
.ad-sum .hl b{color:var(--ok)}

/* 운영 기준 설정 (p28) */
.ad-std{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.ad-cats{background:#f8fafc;border-radius:11px;padding:8px}
.ad-cats button{display:flex;justify-content:space-between;width:100%;border:0;background:none;text-align:left;padding:11px 12px;border-radius:9px;font-weight:700;cursor:pointer;color:#334155;font-size:14.5px}
.ad-cats button.on{background:var(--blue);color:#fff}
.ad-cats button small{font-weight:600;opacity:.75}
.ad-stdbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ad-stdbar select{min-width:150px;width:auto}
.ad-sr{display:grid;grid-template-columns:200px minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:10px 14px;margin-bottom:7px;background:#fff}
.ad-sr.lock{background:#f3f4f6;color:#9aa1ac}
.ad-sr.lock .nm{color:#9aa1ac}
.ad-sr .nm{font-weight:800;font-size:14px}
.ad-sr .nm small{display:block;font-weight:600;font-size:11.5px;color:var(--mute)}
.ad-sr .vl{font-size:14px;min-width:0}
.ad-sr .vl .inp{max-width:300px;padding:8px 10px;font-size:14px}
.ad-sr .rt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.ad-sr.dirty{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
.ad-scroll{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;max-height:520px}
.ad-scroll table{border-collapse:collapse;font-size:12.5px;min-width:100%}
.ad-scroll th,.ad-scroll td{padding:7px 9px;border-bottom:1px solid #f1f5f9;white-space:nowrap;text-align:left}
.ad-scroll th{background:#f8fafc;position:sticky;top:0;z-index:1}
.ad-scroll td.df{background:#fff1ee;color:var(--pri);font-weight:700}

/* 지역 콘텐츠 (p21) */
.ad-ct{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.ad-fr{display:grid;grid-template-columns:170px minmax(0,1fr) 92px;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #f1f5f9}
.ad-fr>b{font-size:14px;padding-top:9px}
.ad-fr.wide{grid-template-columns:minmax(0,1fr)}
.ad-fr.wide>b{padding-top:0}
.ad-fr>i{font-style:italic;font-size:12px;color:var(--mute);border:1px dashed #cbd5e1;border-radius:8px;padding:6px 8px;text-align:center;margin-top:4px}
.ad-fr .inp{font-size:14px;padding:9px 11px}
.ad-rtbl input{width:100%;min-width:0;padding:5px 6px;border:1px solid #d6dae1;border-radius:8px;font-size:13px}
.ad-rtbl input[type=date]{min-width:128px}
.ad-rtbl input.q{min-width:58px;max-width:76px}
.ad-vh{display:inline-block;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;vertical-align:top}
.ad-dr{display:flex;flex-direction:column;gap:2px;align-items:stretch}
.ad-dr span{font-size:11px;color:var(--mute);line-height:1;text-align:center}
.ad-rtbl td:nth-child(5),.ad-rtbl td:nth-child(6){white-space:nowrap}
.ad-rtbl td,.ad-rtbl th{padding:6px 6px;font-size:13px}
.ad-rtbl tr.err td{background:#fef2f2}
.ad-prev{position:sticky;top:76px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#fff}
.ad-prev .hd{padding:14px 16px;color:#fff;font-weight:900;font-size:17px}
.ad-prev .im{height:120px;background:#e5e7eb center/cover}
.ad-prev .bd{padding:12px 16px;font-size:13px;color:var(--sub)}

/* 통계 */
.ad-cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
.ad-cards div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 15px}
.ad-cards b{display:block;font-size:22px;color:var(--pri)}
.ad-cards span{font-size:12.5px;color:var(--sub);font-weight:700}
.ad-bars{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.ad-bars h4{margin:0 0 10px;font-size:14.5px}
.ad-br{display:grid;grid-template-columns:96px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.ad-br .tr{height:16px;background:#f1f5f9;border-radius:6px;overflow:hidden}
.ad-br .tr i{display:block;height:100%;background:var(--c,var(--pri));border-radius:6px}
.ad-br b{text-align:right}

.ad-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.ad-q{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.ad-q .hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ad-q p{margin:6px 0;font-size:13.5px;color:#334155;white-space:pre-wrap}
.ad-q .ans{background:#f0fdf4;border-radius:9px;padding:8px 10px;font-size:13px;margin-top:6px;white-space:pre-wrap}

@media (max-width:960px){
  .ad-body{grid-template-columns:minmax(0,1fr)}
  .ad-side{display:flex;gap:4px;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--line);position:sticky;top:58px;z-index:40}
  .ad-side .ad-who{display:none}
  .ad-side button{width:auto;white-space:nowrap;padding:9px 12px;font-size:13.5px}
  .ad-std{grid-template-columns:minmax(0,1fr)}
  .ad-cats{display:flex;overflow-x:auto;gap:4px}
  .ad-cats button{width:auto;white-space:nowrap}
  .ad-ct{grid-template-columns:minmax(0,1fr)}
  .ad-prev{position:static}
  .ad-cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ad-sum{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:600px){
  .ad-main{padding:14px 12px 60px}
  .ad-top{padding:0 12px}
  .ad-top .ad-logo small{display:none}
  .ad-top select{max-width:100%}
  .ad-kv{grid-template-columns:minmax(0,1fr)}
  .ad-sr{grid-template-columns:minmax(0,1fr)}
  .ad-sr .rt{justify-content:flex-start}
  .ad-fr{grid-template-columns:minmax(0,1fr)}
  .ad-fr>b{padding-top:0}
  .ad-fr>i{justify-self:start}
  .ad-br{grid-template-columns:72px minmax(0,1fr) 44px}
  .g-mbox{padding:20px 14px}
}
</style>
</head><body>
<header class="ad-top">
  <div class="ad-logo">반값여행 관리자 · admin.bangap.or.kr<small>시안 G</small></div>
  <div class="ad-tr">
    <label for="adPersona" class="ad-sub" style="color:#94a3b8">로그인 계정</label>
    <select id="adPersona" onchange="adPersonaChange(this.value)"></select>
    <a href="index.html" target="_blank" rel="noopener">사용자 사이트 ↗</a>
  </div>
</header>
<div class="ad-body">
  <nav class="ad-side" id="adSide" aria-label="관리자 메뉴"></nav>
  <main class="ad-main" id="adMain"></main>
</div>
<div id="gToast" role="status"></div>
<div id="gModal" class="g-modal" role="dialog" aria-modal="true"></div>

<script src="../site-assets/data.js?v=20260818a"></script>
<script src="g.js?v=2"></script>
<script src="g-corp.js?v=1"></script>
<script>
/* ═══════════════════════════════════════════════════════════════════
   시안 G 관리자 (착수보고 p28 운영 기준 설정 · p21 지역 콘텐츠 + 테스트 홈페이지 고도화 심사)
   gShell 을 쓰지 않는 관리자 전용 레이아웃. 저장은 g.js 저장소 함수만 쓴다.
   상태 변경은 모두 gSetStatus(이력·알림톡 자동). 건별 판정·보정은 gPutApp + 이력 메모.
   ═══════════════════════════════════════════════════════════════════ */
document.getElementById('gModal').addEventListener('click',e=>{ if(e.target.id==='gModal') gCloseModal(); });

const AD_PG=50;   /* 신청 목록 한 쪽 건수 */
const AD={view:'apps',f:{region:'',round:'',status:'',type:'',q:'',page:0},sel:{},stdCat:'basic',stdRegion:null,stdDraft:{},
  ctRegion:null,ctRounds:null,csv:null,bdTab:'notice',bdEdit:null,qRegion:'',stRegion:'',open:null,row:null,ocrRow:null};
const AD_MENU=[['apps','📋 신청 관리(심사)'],['std','⚙️ 운영 기준 설정'],['content','🗺 지역 콘텐츠'],['board','📢 공지·FAQ·문의'],['stats','📊 통계'],['demo','🧪 데모 도구']];
const AD_VERIFY={dju:'디주 통합로그인',kakao:'카카오톡 인증',id:'신분증 첨부'};
/* 착수보고 p27 핵심 항목 표준안 9개 */
const AD_CORE=['A3','B4','A1','M8','C1','P1','P2','M10','S2','U1'];

/* ── 공통 ── */
function adId(s){ return String(s==null?'':s).replace(/[^A-Za-z0-9_\-]/g,''); }
function adP(){ return gPersona(); }
function adHQ(){ return !gPersona().region; }
function adScope(){ return gPersona().region; }
function adBy(){ return gPersona().name; }
function adRegions(){ const s=adScope(); return s?[gRegion(s)]:gRegionsAll(); }
function adApps(){ const s=adScope(); return gApps().filter(a=>!s||a.region===s); }
function adCan(a){ return a&&(!adScope()||a.region===adScope()); }
function adRName(slug){ const r=gRegion(slug); return r?r.full:slug; }
function adTag(a){ return adRName(a.region)+' '+a.round+'회차'; }
function adNights(a){ const n=gDiff(a.start,a.end); return n+'박 '+(n+1)+'일'; }
function adPeopleN(a){ return Math.max(1,(a.people||[]).length); }
/* 방금 보낸 알림톡을 관리자 화면에도 미리보기(신청자 계정의 최근 알림) */
/* 관리자 화면에서는 신청자 마이페이지 링크 대신 「신청자에게 발송됨」만 표시한다(관리자가 사용자 화면으로 넘어가지 않게) */
function adTalk(uid){
  const l=gNotis(uid), n=l[0]; if(!(n&&n.talk&&gAgo(n.at)==='방금')) return;
  let box=document.getElementById('gTalk'); if(!box){ box=document.createElement('div'); box.id='gTalk'; document.body.appendChild(box); }
  box.innerHTML='<div class="g-talk"><div class="g-th">💬 알림톡 · 반값여행 '+gEsc(n.title)+'</div><div class="g-tb">'+gEsc(n.body)+'</div>'+
    '<div class="g-tbtn" style="color:#047857;cursor:default">✓ 신청자에게 발송됨 · '+gEsc(uid)+'</div><small>모의 발송 — 실제 알림톡은 보내지 않습니다</small></div>';
  box.className='on'; clearTimeout(adTalk._t); adTalk._t=setTimeout(()=>box.className='',5200);
}
/* 조사 '으로/로' — 받침 없음·ㄹ 받침이면 '로' (gJosa 는 받침 유무만 본다) */
function adRo(w){ const c=String(w||'').trim().slice(-1).charCodeAt(0); if(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28===8) return '로'; return gJosa(w,['으로','로']); }
function adNum(id,slug){ const v=gStd(id,slug); const m=String(v.val).match(/\d+/); return m?Number(m[0]):0; }

/* ── 상단 페르소나·메뉴 ── */
function adPersonaInit(){
  const s=document.getElementById('adPersona');
  s.innerHTML=gPersonas().map(p=>'<option value="'+gEsc(p.id)+'">'+gEsc(p.name)+'</option>').join('');
  s.value=adP().id;
}
function adPersonaChange(id){
  if((Object.keys(AD.stdDraft).length||(AD.view==='content'&&adCtDirty()))&&!confirm('저장하지 않은 '+(Object.keys(AD.stdDraft).length?'운영 기준':'지역 콘텐츠')+' 변경이 있습니다. 버리고 계정을 바꿀까요?')){ document.getElementById('adPersona').value=adP().id; return; }

function adGo(v){
  if(AD.view==='std'&&v!=='std'&&Object.keys(AD.stdDraft).length&&!confirm('저장하지 않은 운영 기준 변경이 있습니다. 이동할까요?')) return;

function adFiltered(ignoreStatus){
  const f=AD.f, q=f.q.trim().toLowerCase();
  return adApps().filter(a=>(!f.region||a.region===f.region)&&(!f.round||String(a.round)===f.round)&&(ignoreStatus||!f.status||a.status===f.status)&&
    (!f.type||a.type===f.type)&&(!q||[a.id,a.userName,a.uid].some(v=>String(v||'').toLowerCase().indexOf(q)>=0)))
    .sort((a,b)=>a.createdAt<b.createdAt?1:-1);
}
function adSetF(k,v){ AD.f[k]=v; AD.f.page=0; AD.sel={}; adRender(); }
function adPage(n){ AD.f.page=n; adRender(); const t=document.getElementById('adList'); if(t) t.scrollIntoView({block:'start'}); }

      '<td>'+gEsc(adRName(a.region))+'</td><td>'+a.round+'회차</td><td>'+gEsc(gTypeName(a.type))+' '+adPeopleN(a)+'명</td>'+
      '<td>'+gMD(a.start)+'~'+gMD(a.end)+'<div class="ad-sub">'+adNights(a)+'</div></td><td>'+gBadge(a.status)+'</td><td>'+gDot(a.createdAt)+'</td></tr>';

      '<button class="btn sm'+(n===f.page?' navy':'')+'" onclick="adPage('+n+')"'+(n===f.page?' aria-current="page"':'')+'>'+(n+1)+'</button>').join('')+

    (list.length?'<div class="tbl-wrap" id="adList"><table class="tbl ad-tbl"><thead><tr><th><input type="checkbox" aria-label="이 쪽 전체 선택" onchange="adSelAll(this.checked)"'+(nSelPg&&nSelPg===pageList.length?' checked':'')+'></th><th>신청번호</th><th>신청자</th><th>지역</th><th>회차</th><th>유형</th><th>일정</th><th>상태</th><th>신청일</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+pager

}
function adSel(id,on){ const a=gApps().find(x=>adId(x.id)===id); if(a){ if(on) AD.sel[a.id]=1; else delete AD.sel[a.id]; } adRender(); }
function adSelAll(on){ const l=adFiltered(false).slice(AD.f.page*AD_PG,(AD.f.page+1)*AD_PG); l.forEach(a=>{ if(on) AD.sel[a.id]=1; else delete AD.sel[a.id]; }); adRender(); }
function adBulk(act){
  const ids=adFiltered(false).filter(a=>AD.sel[a.id]).map(a=>a.id);
  const need=act==='start'?'received':'review';
  const inSt=ids.filter(id=>gApp(id).status===need), skip=ids.length-inSt.length;
  /* 일괄 승인은 자동 점검에 ✕(거주지 차단·마감 위반·일정 초과·서류 누락) 항목이 있는 건을 건너뛴다 — 상세 창에서 개별 판단 */
  const badIds=act==='approve'?inSt.filter(id=>adCheckList(gApp(id)).some(x=>x[0]==='bad')):[];
  const ok=inSt.filter(id=>badIds.indexOf(id)<0);
  if(!ok.length){ gToast(badIds.length?'선택한 건 모두 자동 점검 ✕ 항목이 있어 일괄 승인할 수 없습니다 — 상세 창에서 개별 심사해 주세요':(act==='start'?'접수 완료':'심사중')+' 상태인 건만 처리할 수 있습니다','bad'); return; }
  if(act==='approve'&&!confirm(ok.length+'건을 일괄 승인할까요? 유형별 지원 한도가 확정되고 알림톡이 발송됩니다.'+(badIds.length?'\n자동 점검 ✕ 항목이 있는 '+badIds.length+'건('+badIds.slice(0,3).join(', ')+(badIds.length>3?' 외':'')+')은 건너뜁니다.':''))) return;
  ok.forEach(id=>act==='start'?adStart(id):adApprove(id));
  AD.sel={}; badIds.forEach(id=>AD.sel[id]=1); adRender();
  gToast(ok.length+'건 '+(act==='start'?'심사 시작':'승인')+' 처리'+(badIds.length?' · 자동 점검 ✕ '+badIds.length+'건 건너뜀(선택 유지)':'')+(skip?' · '+skip+'건은 상태가 맞지 않아 건너뜀':''),badIds.length?'':'ok');
}

/* ── 상세 창 ── */
function adOpen(id,keep){
  const a=gApps().find(x=>adId(x.id)===adId(id)); if(!a){ gToast('신청 건을 찾을 수 없습니다','bad'); return; }
  if(!adCan(a)){ gToast('담당 지역 신청 건만 볼 수 있습니다','bad'); return; }
  if(AD.open!==a.id){ AD.row=null; AD.ocrRow=null; }
  AD.open=a.id; AD.openSt=a.status; AD.openSnap=JSON.stringify(a);
  const stale=AD.stale; AD.stale=null;
  const box=document.querySelector('#gModal .g-mbox'), y=keep&&box?box.scrollTop:0;
  gModal(adDetailHtml(a,stale),'wide');
  const nb=document.querySelector('#gModal .g-mbox'); if(nb&&y) nb.scrollTop=y;
}
function adRefresh(id){ adRender(); if(id&&document.getElementById('gModal').classList.contains('on')) adOpen(id,true); }
function adKV(rows){ return '<div class="ad-kv">'+rows.filter(Boolean).map(r=>'<div><span>'+r[0]+'</span><b>'+r[1]+'</b></div>').join('')+'</div>'; }
function adCheckList(a){
  const res=G_RESIDENCE[a.uid], blk=res?gAddrBlock(a.region,res.sigungu):null;
  const lead=gDiff(gYmd(gD(a.createdAt)),a.start), A1=gStdNum('A1')||2, C5=gStdNum('C5')||7, days=gDiff(a.start,a.end)+1;
  const yr=String(a.start).slice(0,4);
  const others=gApps().filter(x=>!x.demo&&x.uid===a.uid&&x.id!==a.id&&G_INACTIVE.indexOf(x.status)<0&&String(x.start).slice(0,4)===yr);
  const g=a.grant||gGrant(a.type,a.people);
  const c=[];
  c.push(res?(blk?['bad','거주지 '+res.sigungu+' — '+(blk==='same'?'관내 거주자':'인접 지역 거주자')+' 신청 불가']:['','거주지 자동 확인 — '+res.sido+' '+res.sigungu+' (관외)'])
            :['warn','거주지 — 행정정보 공동이용 조회 결과 없음(데모 계정 외)']);
  c.push(lead>=A1?['','신청 마감 충족 — 여행 '+lead+'일 전 신청(기준 '+A1+'일 전)']:['bad','신청 마감 위반 — 여행 '+lead+'일 전 신청(기준 '+A1+'일 전)']);
  c.push(days<=C5?['','여행 일정 '+days+'일(최대 '+C5+'일)']:['bad','여행 일정 '+days+'일 — 최대 '+C5+'일 초과']);
  c.push(others.length?['warn','연 1회 기준 확인 필요 — 같은 계정의 '+yr+'년 유효 신청 '+others.length+'건('+others.slice(0,3).map(x=>x.id).join(', ')+(others.length>3?' 외 '+(others.length-3)+'건':'')+')']:['','연 1회 충족']);
  c.push(['',g.label+' — 한도 '+gWon(g.cap)+' · 환급률 '+g.rate+'% · 최소 소비 '+gWon(g.minSpend)]);
  if(a.type==='family'&&!(a.docs||[]).some(d=>/등본/.test(d.name))) c.push(['bad','가족 유형 — 주민등록등본 미첨부']);
  if((a.people||[]).some(p=>p.minor&&!p.doc)) c.push(['bad','미성년자 동행 서류 미첨부']);
  return c;
}
function adChecks(a){
  const c=adCheckList(a);

function adRndErrors(){
  const l=AD.ctRounds.list, err=[];
  l.forEach((x,i)=>{
    const e=[];
    ['applyStart','applyEnd','travelStart','travelEnd'].forEach(k=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(x[k]||'')) e.push('날짜 누락'); });
    if(!e.length){
      if(x.applyStart>x.applyEnd) e.push('신청 종료가 시작보다 빠름');
      if(x.travelStart>x.travelEnd) e.push('여행 종료가 시작보다 빠름');
      if(x.travelStart<x.applyStart) e.push('여행 시작이 신청 시작보다 빠름');
      if(x.travelEnd<x.applyEnd) e.push('여행 종료가 신청 종료보다 빠름');
      if(i>0&&l[i-1].applyEnd&&x.applyStart<=l[i-1].applyEnd) e.push('이전 회차 신청 기간과 겹침');
    }
    if(!(x.quota>=1)) e.push('정원 1명 이상');
    if(e.length) err.push({i,msg:(i+1)+'회차: '+Array.from(new Set(e)).join(', ')});
  });

}

function adCtDirty(){

  if(v('adCNear').split(/[,，\s]+/).filter(Boolean).join(',')!==(r.nearby||[]).join(',')) return true;

  if(AD.ctRounds&&AD.ctRounds.slug===slug&&rk(AD.ctRounds.list)!==rk(r.rounds)) return true;

/* 소비인정 업소 CSV */
function adCsvParse(text){
  const rows=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell!==''||row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
function adCsvClean(s){ let v=String(s||'').replace(/^﻿/,'').trim(); let fx=false; while(/^[=+\-@\t\r]/.test(v)){ v=v.slice(1).trim(); fx=true; } return {v:v.replace(/[<>]/g,'').slice(0,80),fx}; }
function adCsvRead(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  if(f.size>2*1024*1024){ gToast('2MB 이하 CSV만 올릴 수 있습니다','bad'); inp.value=''; return; }
  const rd=new FileReader();
  rd.onload=()=>{
    const buf=new Uint8Array(rd.result); let text, enc='UTF-8';
    try{ text=new TextDecoder('utf-8',{fatal:true}).decode(buf); }catch(e){ try{ text=new TextDecoder('euc-kr').decode(buf); enc='EUC-KR'; }catch(e2){ gToast('파일 인코딩을 읽을 수 없습니다','bad'); return; } }
    const rows=adCsvParse(text.replace(/^﻿/,''));
    if(!rows.length){ gToast('빈 파일입니다','bad'); return; }
    const head=rows[0].map(h=>h.replace(/^﻿/,'').trim());
    const ix={cat:head.indexOf('업종'),name:head.indexOf('업소명'),addr:head.indexOf('주소')};
    if(ix.cat<0||ix.name<0||ix.addr<0){ gToast('머리글에 업종, 업소명, 주소가 있어야 합니다 (현재: '+head.slice(0,5).join(', ')+')','bad'); AD.csv=null; adRender(); return; }
    const ok=[], bad=[]; let fixed=0;
    rows.slice(1).forEach((r,n)=>{
      const c=adCsvClean(r[ix.cat]), nm=adCsvClean(r[ix.name]), ad=adCsvClean(r[ix.addr]);
      if(c.fx||nm.fx||ad.fx) fixed++;
      const cat=c.v; const why=!nm.v?'업소명 없음':(['음식','관광','쇼핑','숙박','제외'].indexOf(cat)<0?'업종 값 오류('+cat+')':'');
      if(why) bad.push({line:n+2,why}); else ok.push({cat,name:nm.v,addr:ad.v});
    });
    AD.csv={slug:adCtSlug(),file:f.name,enc,ok,bad,fixed}; adRender();
  };
  rd.readAsArrayBuffer(f);
}

function adDownload(name,rows){
  const csv='﻿'+rows.map(r=>r.map(adCell).join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },500);
}

    D.settle={id:'S'+gSeq(),at:at(-15),items:gClassify([{src:'localpay',merchant:n+' 장터국밥',cat:'음식',amount:110000,at:d(-20)+'T12:00:00',approval:'88120034'},{src:'localpay',merchant:n+' 로컬푸드직매장',cat:'쇼핑',amount:60000,at:d(-19)+'T10:00:00',approval:'88120035'}],{start:d(-20),end:d(-19),region}),
      visits:[{spot:r.attractions[0],date:d(-20),method:'qr',gps:true},{spot:r.attractions[2],date:d(-19),method:'qr',gps:true}],agree:{fraud:true,terms:true},sign:u.name};
    adRecalc(D); list.push(D);
  }
  gSaveApps(gApps().concat(list));
  gUSet('adseed',true,uid);
  return list.length;
}
function adSeedAll(){
  let n=0; ['user1','user2','user3','user4','user5'].forEach(uid=>{ n+=adSeedDemoFor(uid); n+=adSeedReviewFor(uid); });
  adRender(); gToast(n?n+'건을 만들었습니다 — [신청 관리]에서 심사해 보세요':'이미 모든 계정에 시드가 있습니다',n?'ok':'');
}

/* ── 시작 ── */
/* 다른 탭에서 저장하면: 목록을 다시 그리고(입력 중인 편집 화면은 사이드 메뉴만), 열린 상세 창도 최신 상태로 다시 그린다 */
window.addEventListener('storage',e=>{
  if(!e.key||e.key.indexOf(G_P)!==0) return;
  if(AD.view!=='std'&&AD.view!=='content'&&AD.view!=='board') adRender(); else adSide();
  adSyncOpen();
});
function adSyncOpen(){
  const m=document.getElementById('gModal');
  if(!AD.open||!m||!m.classList.contains('on')||!document.getElementById('adDetail')) return;
  const a=gApp(AD.open);
  if(!a||!adCan(a)){ gCloseModal(); AD.open=null; gToast('다른 창에서 삭제되었거나 볼 수 없는 신청 건입니다','bad'); return; }
  const snap=JSON.stringify(a); if(snap===AD.openSnap) return;
  const prev=AD.openSt, changed=a.status!==prev, nm=k=>(G_ST[k]||{}).nm||k;
  const keep={}; m.querySelectorAll('textarea[id],input[id]').forEach(el=>{ if(el.type!=='file'&&el.type!=='checkbox'&&el.value) keep[el.id]=el.value; });
  AD.stale=changed?'다른 창에서 이 건이 처리되었습니다 ('+nm(prev)+' → '+nm(a.status)+'). 아래는 최신 상태이며, 이전 상태의 처리 버튼은 사라졌습니다.'
                  :'다른 창에서 이 건의 내용이 바뀌어 최신 상태로 다시 표시했습니다.';
  adOpen(a.id,true);
  Object.keys(keep).forEach(k=>{ const el=document.getElementById(k); if(el) el.value=keep[k]; });
  if(changed) gToast('다른 창에서 처리된 건입니다 — 현재 상태: '+nm(a.status),'bad');
}
(function(){
  adPersonaInit();
  const h=(location.hash||'').slice(1); if(AD_MENU.some(m=>m[0]===h)) AD.view=h;
  adRender();
  const q=gQS('app'); if(q) adOpen(q);
})();
