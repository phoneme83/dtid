<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>사전신청 — 대한민국 반값여행 · 시안 G</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="g.css?v=1">
<style>
/* 사전신청 전용 (.ap-) */
.ap-band{background:linear-gradient(120deg,var(--rc) 0%,#0f172a 140%);color:#fff}
.ap-band .g-in{padding:26px 20px 24px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between}
.ap-band h1{margin:0;font-size:26px;letter-spacing:-.5px}
.ap-band p{margin:4px 0 0;opacity:.88;font-size:14px}
.ap-band .g-ss{margin-left:6px;vertical-align:middle}
.ap-wrap{max-width:900px}
.ap-h{margin:0 0 4px;font-size:21px;letter-spacing:-.3px}
.ap-sub{margin:0 0 16px;color:var(--sub);font-size:14px}
.ap-types{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ap-type{position:relative;text-align:left;border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;cursor:pointer;font:inherit;color:inherit;transition:.15s}
.ap-type:hover{border-color:#cbd5e1}
.ap-type.on{border-color:var(--pri);background:var(--pri-l)}
.ap-type:disabled{cursor:not-allowed;opacity:.55;background:#f8fafc}
.ap-type .em{font-size:24px}
.ap-type b{display:block;font-size:16px;margin-top:4px}
.ap-type small{display:block;color:var(--sub);font-size:12.5px;line-height:1.4}
.ap-type .cap{margin-top:8px;font-size:13px;font-weight:800;color:var(--pri)}
.ap-type .why{margin-top:6px;font-size:12px;color:var(--bad);font-weight:700}
.ap-live{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.ap-live div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.ap-live span{display:block;font-size:12.5px;color:var(--sub)}
.ap-live b{font-size:18px}
.ap-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ap-msg{min-height:20px;font-size:13.5px;font-weight:700;margin-top:8px}
.ap-msg.bad{color:var(--bad)} .ap-msg.ok{color:var(--ok)}
.ap-nav{display:flex;gap:10px;justify-content:space-between;margin-top:22px;flex-wrap:wrap}
.ap-nav .btn.pri{min-width:180px}
.ap-ro{background:#f8fafc!important;color:#334155}
.ap-tag{display:inline-block;font-size:11.5px;font-weight:800;color:var(--blue);background:var(--blue-l);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.ap-addr{display:flex;align-items:center;gap:10px;margin-top:12px;padding:12px 14px;border-radius:11px;background:#f8fafc;border:1px solid var(--line);font-size:14px}
.ap-addr.ok{background:#effbf8;border-color:#a7e3d6}
.ap-spin{width:18px;height:18px;border:3px solid #cbd5e1;border-top-color:var(--blue);border-radius:50%;animation:apSpin .8s linear infinite;flex:none}
@keyframes apSpin{to{transform:rotate(360deg)}}
.ap-comp{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;background:#fff}
.ap-comp.ok{border-color:#a7e3d6}
.ap-comp h4{margin:0 0 4px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ap-meth{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ap-panel{margin-top:10px;padding:12px;border-radius:11px;background:#f8fafc;font-size:13.5px}
.ap-done{color:var(--ok);font-weight:800}
.ap-fam{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 12px;margin-top:8px;cursor:pointer;font:inherit;color:inherit}
.ap-fam.on{border-color:var(--pri);background:var(--pri-l)}
.ap-fam.dis{cursor:default;background:#f8fafc;color:var(--mute)}
.ap-fam .ck{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid #cbd5e1;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:13px}
.ap-fam.on .ck,.ap-fam.self .ck{background:var(--pri);border-color:var(--pri)}
.ap-fam .rel{font-size:12px;font-weight:800;color:var(--blue);margin-left:4px}
.ap-fam small{display:block;font-size:12px;color:var(--sub)}
.ap-chk .check b{display:block;font-size:14.5px}
.ap-chk .check span{font-size:13px;color:var(--sub)}
.ap-terms{border:1px solid var(--line);border-radius:11px;background:#fff;margin:8px 0}
.ap-terms summary{cursor:pointer;padding:10px 14px;font-size:13px;color:var(--blue);font-weight:700}
.ap-terms div{padding:0 14px 12px;font-size:13px;color:#475569}
.ap-terms table{width:100%;border-collapse:collapse;font-size:12.5px}
.ap-terms td,.ap-terms th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.ap-sum{border:1px solid var(--line);border-radius:14px;background:#fff;margin-top:12px;overflow:hidden}
.ap-sum h4{margin:0;padding:12px 16px;background:#f8fafc;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ap-sum dl{margin:0;padding:6px 16px 12px;display:grid;grid-template-columns:130px minmax(0,1fr);gap:6px 12px;font-size:14px}
.ap-sum dt{color:var(--sub)} .ap-sum dd{margin:0;font-weight:600;word-break:keep-all}
.ap-big{text-align:center;padding:34px 20px}
.ap-big .ic{font-size:46px}
.ap-big h2{margin:8px 0 6px;font-size:24px}
.ap-big p{margin:4px 0;color:var(--sub)}
.ap-no{display:inline-block;margin:14px 0;font-size:26px;font-weight:900;letter-spacing:1px;color:var(--navy);background:#f1f5f9;border-radius:12px;padding:8px 18px}
.ap-qno{font-size:60px;font-weight:900;color:var(--pri);line-height:1}
.ap-login{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.ap-login div{background:#f8fafc;border-radius:12px;padding:14px;font-size:13.5px}
.ap-login b{display:block;font-size:15px;margin-bottom:2px}
.ap-demo{margin-top:16px;border:1px dashed #cbd5e1;border-radius:11px;padding:10px 14px;font-size:12.5px;color:var(--sub)}
.ap-demo summary{cursor:pointer;font-weight:700}
.ap-demo .btn{margin:6px 6px 0 0}
.ap-fix{border-left:4px solid var(--pri)}
.ap-files{margin:8px 0 0;padding:0;list-style:none;font-size:13px}
.ap-files li{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;background:#f8fafc;border-radius:8px;margin-top:4px}
.ap-files button{border:0;background:none;color:var(--bad);cursor:pointer;font-weight:700}
@media (max-width:760px){
  .ap-types{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ap-live,.ap-login{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:600px){
  .ap-row{grid-template-columns:minmax(0,1fr)}
  .ap-sum dl{grid-template-columns:96px minmax(0,1fr)}
  .ap-band h1{font-size:22px}
  .ap-nav .btn{flex:1}
}
</style>
</head><body>
<main>
  <section class="ap-band" id="apBand"></section>
  <div class="wrap ap-wrap">
    <ol class="steps" id="apSteps" style="display:none"></ol>
    <div id="apView"></div>
  </div>
</main>
<script src="../site-assets/data.js?v=20260818a"></script>
<script src="g.js?v=1"></script>
<script>
const AP_SLUG=(gQS('r')&&gRegion(gQS('r')))?gQS('r'):'pyeongchang';
gShell({mode:'region',slug:AP_SLUG,active:'apply'});

/* ═══ 사전신청 5단계 (착수보고 p18) — 로그인 안내 → ①유형·일정 → ②신청자·동행자 → ③체크리스트·약관 → ④최종 확인 → ⑤완료
   고도화 유지(시안 D): 정원·대기열·과부하 판단(gCapacity/gQueue), 동시접속 버전 잠금(gLockVer/gLockBump),
   가족 주민등록등본 세대원 선택(배우자·직계만, 이름 마스킹, 최대 5명) */
const AP=(function(){
  const R=gRegion(AP_SLUG), U=gUser();
  const A1=gStdNum('A1')||2, A2=gStdNum('A2')||30, C5=gStdNum('C5')||7, C1=gStdNum('C1')||10;
  const B4=gStdNum('B4')||1, B5=gStdNum('B5')||18;
  const V4=gStd('V4',AP_SLUG).val, FAMILY_MAX=5, TEAM_MAX=6;
  const STEP_NM=['유형·일정','신청자·동행자','체크리스트·약관','최종 확인','완료'];
  const CHECKS=[
    ['지역화폐 결제만 소비로 인정됩니다','여행지에서는 '+gEsc(gStd('P7',AP_SLUG).val)+' 등 지역화폐로 결제해 주세요. 카드·현금영수증은 숙박만 예외로 인정됩니다(날인 숙박확인서 필요).'],
    ['지정관광지 방문 인증이 필요합니다','여행 중 지정관광지 '+gEsc(V4)+' 방문을 QR 또는 얼굴이 보이는 인증사진으로 인증해야 합니다.'],
    ['여행 종료 후 '+C1+'일 이내 정산신청해야 합니다','기한이 지나면 환급받을 수 없습니다. 정산 결과는 알림톡으로 안내합니다.'],
    ['제외 업종 결제는 인정되지 않습니다','주유소·카센터·금은방·학원·유흥업소'+(R.extraExcl?'·'+gEsc(R.extraExcl):'')+', 연매출 30억원 초과 업소 결제는 소비 금액에서 제외됩니다.'],
    ['반값여행은 1인 연 1회만 신청할 수 있습니다','전국 25개 참여 지역을 합산해 연 1회입니다. 취소·반려된 신청은 횟수에 포함되지 않습니다.'],
    ['허위·부정 수급 시 환수됩니다','허위 증빙·중복 제출·타인 명의 결제 등 부정 수급이 확인되면 지원금 전액 환수 및 향후 참여가 제한됩니다.']
  ];
  const S={type:null,start:'',end:'',n:1,plan:'',comps:[],famOpen:false,fam:[],hh:null,
           check:CHECKS.map(()=>false),privacy:false,third:false,addrOk:false,addrBusy:false,lockV:0};
  let RD=null, FIX=null, fixFiles=[], noB4=false, view='', qTimer=null, kakaoT={};
  const $=id=>document.getElementById(id);
  const ymd=n=>gYmd(gAdd(gToday(),n));
  const minD=(a,b)=>a<b?a:b, maxD=(a,b)=>a>b?a:b;

  /* ── 지역 띠 ── */
  function band(){
    const st=gRegionState(R), rd=RD||st.round;
    const badge=RD?'<span class="g-ss open">'+RD.n+'회차 접수중</span>':gStateBadge(st.full?'full':st.state);
    $('apBand').style.setProperty('--rc',R.color);
    $('apBand').innerHTML='<div class="g-in"><div><h1>'+gEsc(R.full)+' 사전신청'+badge+'</h1>'+
      (rd?'<p>신청 기간 '+gMD(rd.applyStart)+' ~ '+gMD(rd.applyEnd)+' · 여행 기간 '+gMD(rd.travelStart)+' ~ '+gMD(rd.travelEnd)+'</p>':'')+'</div>'+
      '<p>여행 '+A1+'일 전까지 신청 · 디지털 관광주민증 로그인 후 약 3분</p></div>';
  }
  function steps(k){
    const el=$('apSteps');
    if(!k){ el.style.display='none'; return; }
    el.style.display='';
    el.innerHTML=STEP_NM.map((n,i)=>'<li class="'+(i+1<k?'done':(i+1===k?'on':''))+'">'+n+'</li>').join('');
  }
  function show(html,k){ steps(k); $('apView').innerHTML=html; window.scrollTo(0,0); }

  /* ── 안내 화면(사전 필터링) ── */
  function blockView(ic,title,desc,acts){
    show('<div class="card ap-big"><div class="ic">'+ic+'</div><h2>'+title+'</h2>'+desc+
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px">'+(acts||'')+'</div></div>',0);
  }
  function loginView(){
    show('<div class="card"><h2 class="ap-h">로그인 안내</h2><p class="ap-sub">반값여행 사전신청은 <b>디지털 관광주민증 로그인 한 번</b>으로 진행됩니다.</p>'+
      '<div class="ap-login"><div><b>🪪 신분증 제출 없음</b>디주에 등록된 이름·생년월일·휴대폰이 자동 입력됩니다.</div>'+
      '<div><b>🏠 거주지 자동 확인</b>행정정보 공동이용으로 거주지를 확인해 신청 가능 여부를 바로 알려드려요.</div>'+
      '<div><b>⏱ 약 3분</b>유형·일정 → 신청자·동행자 → 체크리스트 → 최종 확인 순으로 진행됩니다.</div></div>'+
      '<div class="note">동행자가 있다면 동행자도 디지털 관광주민증 회원이거나 카카오톡 인증이 필요합니다. 가족 신청은 주민등록등본으로 세대원을 확인합니다.</div>'+
      '<div class="ap-nav" style="justify-content:center"><a class="btn pri lg" href="'+gEsc(gLoginUrl())+'">디지털 관광주민증 로그인</a></div>'+
      '<p class="small muted tc">아직 회원이 아니신가요? 디지털 관광주민증 앱에서 가입 후 이용해 주세요.</p></div>',0);
  }

  function boot(){
    band();
    if(!U) return loginView();
    const fx=gQS('fix');
    if(fx) return bootFix(fx);
    const t=gUGet('myq',null);
    if(t&&t.slug===AP_SLUG){
      if(gApp(t.appId)) { gUSet('myq',null); return doneView(gApp(t.appId),true); }
      if(gQueue(t.slug,t.n).some(x=>x.id===t.id)){ RD=R.rounds.find(x=>x.n===t.n)||null; band(); return queueView(); }
      gUSet('myq',null);
    }
    const st=gRegionState(R);
    if(st.state!=='open'){
      if(st.state==='soon'||st.next){
        const nx=st.next||st.round, on=gHasAlert(AP_SLUG,nx.n);
        const head=st.full?['⏳','이번 회차는 예산이 소진되어 조기 마감되었어요']:(st.state==='soon'?['🔔','아직 접수 기간이 아니에요']:['📭','이번 회차 접수가 마감되었어요']);
        return blockView(head[0],head[1],'<p>다음 '+nx.n+'회차 접수는 <b>'+gDot(nx.applyStart)+'</b>에 시작합니다 (D-'+Math.max(0,gDiff(gToday(),nx.applyStart))+').</p>'+
          '<p>알림을 신청하면 접수 시작 시 디지털 관광주민증에 등록된 번호로 알림톡을 보내드려요.</p>',
          '<button class="btn pri" id="apAlertBtn" onclick="AP.alertMe('+nx.n+')"'+(on?' disabled':'')+'>'+(on?'알림 신청 완료':'알림 신청')+'</button><a class="btn" href="region.html?r='+AP_SLUG+'">지역 홈</a><a class="btn" href="index.html#map">다른 지역 찾기</a>'+demoResetBtn());
      }
      return blockView(st.full?'⏳':'📭',st.full?'예산 소진으로 조기 마감되었어요':'올해 접수가 모두 마감되었어요','<p>'+gEsc(R.full)+'의 올해 반값여행 회차가 모두 마감되었습니다.</p>',
        '<a class="btn pri" href="index.html#map">접수 중인 다른 지역 보기</a>'+demoResetBtn());
    }
    RD=st.round; band();
    const ab=gAddrBlock(AP_SLUG,U.sigungu);
    if(ab) return blockView('🏠',ab==='same'?'관내 거주자는 신청할 수 없어요':'인접 지역 거주자는 신청할 수 없어요',
      '<p>행정정보 공동이용으로 확인한 거주지: <b>'+gEsc(U.addr)+'</b></p><p>반값여행은 관외 방문객을 위한 사업으로, '+gEsc(R.full)+gJosa(R.full,'과와')+' '+(ab==='same'?'같은 시·군':'인접한 시·군('+gEsc(R.nearby.join('·'))+')')+'에 거주하시면 신청할 수 없습니다.</p>',
      '<a class="btn pri" href="index.html#map">신청 가능한 지역 찾기</a>');
    if(!noB4){
      const y=String(gToday().getFullYear());
      const mine=gMyApps().filter(a=>!a.demo&&String(a.createdAt).slice(0,4)===y&&G_INACTIVE.indexOf(a.status)<0);   /* 시연 데이터(demo)는 횟수에 넣지 않는다 */
      if(mine.length>=B4){
        const a=mine[0], ar=gRegion(a.region);
        return blockView('📌','올해 반값여행을 이미 신청하셨어요',
          '<p>반값여행은 1인 <b>연 '+B4+'회</b>만 신청할 수 있습니다(전국 25개 지역 합산).</p>'+
          '<p>기존 신청: <b>'+gEsc(ar?ar.full:a.region)+' '+a.round+'회차 · '+gTypeName(a.type)+'</b> '+gBadge(a.status)+'</p>'+
          '<p class="small">취소·반려된 신청은 횟수에 포함되지 않습니다. 기존 신청을 취소하면 다시 신청할 수 있어요.</p>',
          '<a class="btn pri" href="mypage.html?app='+encodeURIComponent(a.id)+'">기존 신청 보기</a>'+
          '<button class="btn sm ghost" onclick="AP.skipB4()" title="시연용">데모: 이번 한 번 제한 건너뛰기</button>');
      }
    }
    if(gAge(U.birth)<B5) return blockView('🧑','대표자는 만 '+B5+'세 이상이어야 해요','<p>신청 대표자는 만 '+B5+'세 이상이어야 합니다. 보호자 명의로 신청해 주세요.</p>','<a class="btn" href="region.html?r='+AP_SLUG+'">지역 홈</a>');
    go(1);
  }
  function bootFix(id){
    const a=gApp(id);
    if(!a||a.uid!==U.id) return blockView('❓','보완할 신청을 찾을 수 없어요','<p>본인 신청 건만 보완할 수 있습니다.</p>','<a class="btn pri" href="mypage.html">마이페이지</a>');
    if(a.status!=='fix') return blockView('ℹ️','보완 요청 상태가 아니에요','<p>현재 상태: '+gBadge(a.status)+'</p>','<a class="btn pri" href="mypage.html?app='+encodeURIComponent(a.id)+'">신청 상세 보기</a>');
    FIX=a;

    S.comps=a.people.filter(p=>p.rel==='동행').map(p=>({name:p.name,birth:p.birth,phone:'',method:p.verified,verified:p.verified,idMask:true,idFile:null,minorDoc:p.doc?{name:p.doc}:null,state:'done'}));
    if(a.type==='family'){ S.famOpen=true; const hh=household(); S.fam=a.people.filter(p=>p.rel==='가족').map(p=>{ const m=hh.find(h=>h.name===p.name); return m?m.id:null; }).filter(Boolean); }
    S.check=CHECKS.map(()=>true); S.privacy=S.third=!!(a.agree&&a.agree.privacy); S.third=!!(a.agree&&a.agree.third);

  }

  function go(k){
    if(qTimer){ clearInterval(qTimer); qTimer=null; }

  /* ═══ ① 유형·일정 ═══ */
  function dateRule(){
    const minS=maxD(RD.travelStart,ymd(A1)), maxS=minD(RD.travelEnd,ymd(A2));
    return {minS,maxS,maxE:S.start?minD(gYmd(gAdd(S.start,C5-1)),RD.travelEnd):RD.travelEnd};
  }
  function dateErr(){
    const r=dateRule();
    if(r.minS>r.maxS) return '이 회차에는 지금 신청할 수 있는 여행 날짜가 남아 있지 않아요.';
    if(!S.start) return '여행 시작일을 선택해 주세요.';
    if(S.start<ymd(A1)) return '여행 시작 '+A1+'일 전까지만 신청할 수 있어요. '+gMD(ymd(A1))+' 이후 날짜를 선택해 주세요.';
    if(S.start<RD.travelStart||S.start>RD.travelEnd) return RD.n+'회차 여행 기간('+gMD(RD.travelStart)+' ~ '+gMD(RD.travelEnd)+') 안에서 선택해 주세요.';
    if(S.start>ymd(A2)) return '여행 시작일 '+A2+'일 전부터 신청할 수 있어요. '+gMD(ymd(A2))+'까지 출발하는 일정만 선택할 수 있습니다.';
    if(!S.end) return '여행 종료일을 선택해 주세요.';
    if(S.end<S.start) return '종료일이 시작일보다 빠릅니다.';
    if(gDiff(S.start,S.end)+1>C5) return '여행 일정은 최대 '+C5+'일까지입니다. ('+gMD(r.maxE)+'까지 선택 가능)';
    if(S.end>RD.travelEnd) return '종료일이 회차 여행 기간('+gMD(RD.travelEnd)+'까지)을 넘습니다.';
    return '';

  function nRange(t){ return t==='team'?[2,TEAM_MAX]:t==='family'?[2,FAMILY_MAX]:[1,1]; }
  function capTxt(t){
    if(t==='solo'||t==='family') { const g=gGrant(t,[{}]); return '최대 '+gMan(g.cap)+' · 환급 '+g.rate+'%'; }
    if(t==='youth') return '최대 '+gMan(gStdNum('M4'))+' · 환급 '+gStdNum('M7')+'%';
    return '최대 '+gMan(gStdNum('M2'))+' · 청년팀 '+gMan(gStdNum('M5'));

  function people(){
    const me={name:U.name,birth:U.birth,rel:'본인',verified:'dju'};

        c.birth&&gAge(c.birth)<19?{minor:true,doc:c.minorDoc?c.minorDoc.name:''}:{})));
    if(S.type==='family') return [me].concat(household().filter(h=>S.fam.indexOf(h.id)>=0).map(h=>Object.assign({name:h.name,birth:h.birth,rel:'가족',famRel:h.rel,verified:'id',doc:'주민등록등본(행정정보 공동이용)'},h.age<19?{minor:true}:{})));
    return [me];
  }

  }

      '<div class="ap-nav"><a class="btn" href="region.html?r='+AP_SLUG+'">취소</a><button class="btn pri" id="apNext1" onclick="AP.next1()">다음 — 신청자·동행자</button></div></div>'+

  function live(){

  function setType(k){

  /* ═══ ② 신청자·동행자 ═══ */
  function household(){
    if(S.hh) return S.hh;
    const h=gHash(U.id+'household'), sur=U.name.charAt(0), age=gAge(U.birth), y=gToday().getFullYear();
    const given=['서준','지우','하윤','도윤','서연','민준','지호','수아','예은','시우','채원','현우'];
    const pick=k=>given[(h>>k)%given.length], p2=n=>String(n).padStart(2,'0');
    const rows=[];
    if(age>=30) rows.push({rel:'배우자',name:(sur==='김'?'이':sur)+pick(1),by:y-age+((h>>2)%5-2)});
    if(age>=35){ rows.push({rel:'자녀',name:sur+pick(3),by:y-((h>>3)%14+6)}); if((h>>4)%2===0) rows.push({rel:'자녀',name:sur+pick(5),by:y-((h>>5)%10+3)}); }
    rows.push({rel:'부',name:sur+pick(6),by:y-age-((h>>6)%8+25)});
    rows.push({rel:'모',name:(sur==='김'?'박':sur)+pick(7),by:y-age-((h>>7)%8+23)});
    rows.push({rel:'형제',name:sur+pick(8),by:y-age-((h>>8)%6-3)});
    const direct=['배우자','자녀','부','모','조부','조모','손자','손녀'];
    S.hh=rows.map((r,i)=>{
      const birth=r.by+'-'+p2(1+(h>>(i+1))%12)+'-'+p2(1+(h>>(i+3))%28), ok=direct.indexOf(r.rel)>=0;
      return {id:'H'+i,rel:r.rel,name:r.name,masked:gMask(r.name),birth,birthYear:r.by,age:gAge(birth),eligible:ok,why:ok?'':'배우자·직계 존비속이 아니어서 함께 신청할 수 없습니다'};
    });
    return S.hh;
  }

    if(rs==='closed'){ return blockView('📭','신청 기간이 끝났어요','<p>'+RD.n+'회차 접수가 마감되었습니다.</p>','<a class="btn pri" href="region.html?r='+AP_SLUG+'">지역 홈</a>'); }
    const btn=$('apSubmit'); if(btn) btn.disabled=true;
    let cap=gCapacity(AP_SLUG,RD);
    if(gLockVer(AP_SLUG)!==S.lockV){           /* 확인 화면을 연 뒤 다른 접속에서 접수가 있었다 → 최신 정원으로 1회 재판단 */
      S.lockV=gLockVer(AP_SLUG); cap=gCapacity(AP_SLUG,RD);
      gToast('다른 신청자의 접수가 반영되어 남은 정원을 다시 확인했어요');
    }
    if(cap.mode==='ok'){
      gLockBump(AP_SLUG);
      const a=mkApp(draft());
      doneView(a);
    }else if(cap.mode==='queue'){
      const q=gQueue(AP_SLUG,RD.n), id='Q'+gSeq(), appId=gNewAppId();
      q.push({id,uid:U.id,at:gNow().toISOString(),appId,draft:draft()});
      gQueueSave(AP_SLUG,RD.n,q);
      gUSet('myq',{slug:AP_SLUG,n:RD.n,id,appId});
      queueView();
    }else overView(cap);
  }
  function submitFix(){
    if(!s2ok()) return go(2);
    const d=draft(), a=FIX;
    const changed=d.type!==a.type||d.start!==a.start||d.end!==a.end||JSON.stringify(d.people.map(p=>[p.name,p.birth,p.verified]))!==JSON.stringify(a.people.map(p=>[p.name,p.birth,p.verified]))||d.plan!==(a.plan||'');
    if(!fixFiles.length&&!changed){ gToast('보완 서류를 첨부하거나 신청 내용을 수정해 주세요','bad'); return; }
    if(dateErr()&&(d.start!==a.start||d.end!==a.end)){ gToast(dateErr(),'bad'); return go(1); }
    const patch={type:d.type,people:d.people,start:d.start,end:d.end,plan:d.plan,grant:d.grant,
      docs:(a.docs||[]).concat(d.docs.filter(x=>!(a.docs||[]).some(y=>y.name===x.name))).concat(fixFiles),
      fix:Object.assign({},a.fix||{},{files:fixFiles.slice(),submittedAt:gNow().toISOString()})};
    const r=gSetStatus(a.id,'review',{memo:'보완 제출'+(fixFiles.length?' (서류 '+fixFiles.length+'건)':'')+(changed?' · 신청 내용 수정':''),by:'user',patch});
    gToast('보완 서류가 제출되었습니다','ok');
    doneView(r,false,true);
  }
  function queueTick(){
    const t=gUGet('myq',null); if(!t) return;
    /* 자리가 나면 대기열 맨 앞부터 실제 신청(received)으로 전환 — 누가 화면을 보고 있든 같은 규칙 */
    const rd=gRegion(t.slug).rounds.find(x=>x.n===t.n); if(!rd) return;
    const q=gQueue(t.slug,t.n); let moved=false;
    while(q.length&&gRoundUsed(t.slug,t.n)<rd.quota){
      const h=q.shift(); moved=true;
      if(h.demo||!h.draft) continue;            /* 시연용 대기자는 접수 없이 빠진다 */
      gLockBump(t.slug);
      if(!gApp(h.appId)) mkApp(h.draft,h.appId,'대기열 통과 후 접수');
    }
    if(moved) gQueueSave(t.slug,t.n,q);
    const done=gApp(t.appId);
    if(done){ gUSet('myq',null); if(qTimer){ clearInterval(qTimer); qTimer=null; } gToast('대기열을 통과해 접수되었어요','ok'); return doneView(done,true); }
    const pos=q.findIndex(x=>x.id===t.id)+1;
    if(pos<=0){ gUSet('myq',null); return boot(); }
    const el=$('apQ'); if(!el) return;
    const cap=gCapacity(t.slug,rd);
    el.innerHTML='<div class="ap-qno">'+pos+'</div><p>내 앞 대기 <b>'+(pos-1)+'명</b> · 정원 '+cap.quota+'건 중 '+cap.used+'건 접수</p><p class="small muted">마지막 확인 '+gDT(gNow().toISOString()).slice(11)+' · 3초마다 자동 갱신</p>';
  }
  function queueView(){
    view='queue';
    show('<div class="card ap-big"><div class="ic">🕐</div><h2>신청자가 많아 대기 중이에요</h2>'+
      '<p>정원이 찼지만 취소·반려로 자리가 나면 <b>대기 순서대로 자동 접수</b>됩니다. 이 화면을 닫아도 순번은 유지돼요.</p>'+
      '<div id="apQ" style="margin:18px 0"></div>'+
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="AP.qCancel()">대기 취소</button>'+
      '<button class="btn sm ghost" onclick="AP.demoSeat()" title="시연용">데모: 자리 1개 만들기</button></div></div>',4);
    queueTick();
    if(qTimer) clearInterval(qTimer);
    qTimer=setInterval(queueTick,3000);
  }
  function qCancel(){
    const t=gUGet('myq',null); if(!t) return;
    if(!confirm('대기를 취소할까요? 다시 신청하면 맨 뒤 순번이 됩니다.')) return;
    gQueueSave(t.slug,t.n,gQueue(t.slug,t.n).filter(x=>x.id!==t.id));
    gUSet('myq',null); if(qTimer){ clearInterval(qTimer); qTimer=null; }
    gToast('대기를 취소했어요');
    if(S.type) go(4); else boot();
  }
  function overView(cap){
    view='over';
    show('<div class="card ap-big"><div class="ic">🚦</div><h2>접속자가 많아 잠시 후 다시 시도해 주세요</h2>'+
      '<p>현재 '+gEsc(R.full)+' '+RD.n+'회차는 정원 '+cap.quota+'건이 모두 찼고 대기열('+cap.queue+'/'+cap.queueMax+'명)도 가득 찼습니다.</p>'+
      '<p class="small muted">입력하신 내용은 이 화면을 닫기 전까지 유지됩니다.</p>'+
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px"><button class="btn pri" onclick="AP.submit()">다시 시도</button><button class="btn" onclick="AP.go(4)">최종 확인으로</button>'+
      '<button class="btn sm ghost" onclick="AP.demoReset();AP.go(4)">데모: 시연 상태 되돌리기</button></div></div>',4);
  }
  /* 시연 도구 — 회차 정원을 관리자 '회차 일정' 저장값으로 덮어써 대기열·과부하를 재현 */
  function setQuota(q){
    const cfg=(gGet('regionCfg',{})||{})[AP_SLUG]||{};
    if(gGet('demoQuotaBak_'+AP_SLUG,null)==null) gSet('demoQuotaBak_'+AP_SLUG,{rounds:cfg.rounds||null});
    const rounds=R.rounds.map(x=>x.n===RD.n?Object.assign({},x,{quota:q}):x);
    gSetRegionCfg(AP_SLUG,{rounds}); R.rounds=rounds; RD=rounds.find(x=>x.n===RD.n);
  }
  /* 접수 0건이면 정원 0 → 대기열 한도도 0 이라 바로 과부하가 된다. 시연용 접수 1건(demo 표시)을 채워 정원 1로 만든다 */
  function fillToQuota(){
    if(!gRoundUsed(AP_SLUG,RD.n)){
      const me={name:'시연용',birth:'1990-01-01',rel:'본인',verified:'dju'};
      mkApp({uid:'demo_fill',userName:'시연용',region:AP_SLUG,round:RD.n,type:'solo',people:[me],start:RD.travelEnd,end:RD.travelEnd,plan:'',docs:[],
        agree:{check:true,privacy:true,third:true},grant:gGrant('solo',[me]),demo:true},null,'시연용 정원 채움');
    }
    setQuota(gRoundUsed(AP_SLUG,RD.n));
  }
  function demoFull(){ fillToQuota(); gToast('정원을 현재 접수 건수로 맞췄어요 — 제출하면 대기열로 들어갑니다'); s4(); }
  function demoOver(){
    fillToQuota();
    const q=gQueue(AP_SLUG,RD.n), max=Math.ceil(RD.quota*0.3);
    while(q.length<max) q.push({id:'Q'+gSeq(),uid:'demo_q',at:gNow().toISOString(),appId:'DEMOQ-'+gSeq(),demo:true,draft:null});
    gQueueSave(AP_SLUG,RD.n,q); gToast('대기열을 가득 채웠어요 — 제출하면 과부하 안내가 나옵니다'); s4();
  }
  function demoReset(){
    const bak=gGet('demoQuotaBak_'+AP_SLUG,null);
    if(bak){ gSetRegionCfg(AP_SLUG,{rounds:bak.rounds}); try{ localStorage.removeItem(G_P+'demoQuotaBak_'+AP_SLUG); }catch(e){} }
    const fresh=gRegion(AP_SLUG); R.rounds=fresh.rounds; if(RD) RD=fresh.rounds.find(x=>x.n===RD.n)||RD;
    fresh.rounds.forEach(rd=>gQueueSave(AP_SLUG,rd.n,gQueue(AP_SLUG,rd.n).filter(x=>!x.demo)));
    gSaveApps(gApps().filter(a=>!(a.demo&&a.uid==='demo_fill'&&a.region===AP_SLUG)));
    gToast('시연 상태를 되돌렸어요'); if(RD) band();
    if(view==='s4') s4();
  }
  function demoSeat(){
    const t=gUGet('myq',null); if(!t) return;
    const q=gQueue(t.slug,t.n);
    /* 내 앞의 시연용 대기자는 비우고, 정원을 1 늘려 자리를 만든다 */
    const mine=q.findIndex(x=>x.id===t.id);
    gQueueSave(t.slug,t.n,q.filter((x,i)=>!(x.demo&&i<mine)));
    const rd=R.rounds.find(x=>x.n===t.n); RD=rd; setQuota(Math.max(rd.quota,gRoundUsed(t.slug,t.n))+1);
    gToast('취소 1건이 생겨 자리가 났어요 — 곧 자동 접수됩니다'); queueTick();
  }

  /* ═══ ⑤ 완료 ═══ */
  function doneView(a,fromQueue,isFix){
    view='s5';
    const g=a.grant||gGrant(a.type,a.people);
    show('<div class="card ap-big"><div class="ic">'+(isFix?'📨':'🎉')+'</div><h2>'+(isFix?'보완 서류가 제출되었어요':'사전신청이 완료되었어요')+'</h2>'+
      (fromQueue?'<p>대기열을 통과해 자동 접수되었습니다.</p>':'')+
      '<div class="ap-no">신청번호 '+gEsc(a.id)+'</div>'+
      '<p><b>'+gEsc(R.full)+' '+a.round+'회차</b> · '+gEsc(g.label)+' '+a.people.length+'명 · '+gDot(a.start)+' ~ '+gDot(a.end)+'</p>'+
      '<p>예상 최대 지원 <b>'+gWon(g.cap)+'</b> (환급률 '+g.rate+'%)</p>'+
      '<div class="note" style="text-align:left;max-width:520px;margin:18px auto 0">💬 '+(isFix?'담당자가 보완 서류를 다시 심사합니다. ':'')+'심사 결과는 <b>알림톡</b>으로 알려드려요. 승인 후 여행 중에는 지역화폐로 결제하고 지정관광지 '+gEsc(V4)+'를 인증해 주세요.</div>'+
      '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px"><a class="btn pri lg" href="mypage.html?app='+encodeURIComponent(a.id)+'">마이페이지에서 확인</a><a class="btn lg" href="region.html?r='+AP_SLUG+'">지역 홈</a>'+demoResetBtn()+'</div></div>',5);
  }

  function alertMe(n){ if(gAddAlert(AP_SLUG,n)){ gToast('알림 신청이 완료되었어요. 접수가 시작되면 알림톡으로 알려드려요','ok'); } const b=$('apAlertBtn'); if(b){ b.disabled=true; b.textContent='알림 신청 완료'; } }

  return {boot,go,setType,setN,setPlan,setDate,next1,next2,next3,compSet,compChanged,compMethod,compReset,kakao,dju,compFile,compMask,
    famLookup,famToggle,ck,ag,allAgree,submit,qCancel,demoFull,demoOver,demoReset,demoSeat,fixFile,fixDel,alertMe,
    skipB4(){ noB4=true; boot(); }, _S:S, view:()=>view};
})();
AP.boot();
</script>
</body></html>
