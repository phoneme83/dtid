<script>
const user=requireUser();
if(user){
  setActiveBottomNav('my');
  document.getElementById('favCatTabs').innerHTML=FAV_CATS.map((c,i)=>
    `<button class="mypage-sub-tab${i===0?' active':''}" onclick="setFavCat(this)">${c.label}</button>`
  ).join('');
}
function setFavCat(btn){
  document.querySelectorAll('#favCatTabs .mypage-sub-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
