<!DOCTYPE html>
<html lang="ko">
<head><meta charset="utf-8"><title>OCR 엔진 동작 테스트 (임시)</title></head>
<body>
<div id="out">RUNNING</div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const c=document.createElement('canvas');c.width=480;c.height=300;
const x=c.getContext('2d');
x.fillStyle='#fff';x.fillRect(0,0,480,300);
x.fillStyle='#111';x.font='22px Arial';
x.fillText('AMOUNT : 45000',36,100);
x.fillText('APPROVAL NO : 33545708',36,160);
c.toBlob(function(blob){
  Tesseract.recognize(blob,'eng').then(function(r){
    const norm=(r.data.text||'').replace(/[,\s]/g,'');
    document.getElementById('out').textContent=
      'OK amount='+(norm.indexOf('45000')>=0)+' appr='+(norm.indexOf('33545708')>=0)+' text='+norm.slice(0,80);
  }).catch(function(e){
    document.getElementById('out').textContent='FAIL '+e.message;
  });
},'image/png');
</script>
</body>
</html>
