<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>디지털관광주민증 - 지역방문 TIP</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>

<nav class="gnb">
  <div class="gnb-left">
    <div class="logo-wrap"><svg width="20" height="13" viewBox="0 0 20 13" fill="none"><circle cx="5" cy="6.5" r="4" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="6.5" r="4" stroke="#fff" stroke-width="1.5"/><path d="M1 6.5V4.5M19 6.5V4.5M9 6.5H11" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg></div>
    <span class="gnb-title">디지털관광주민증</span>
  </div>
  <button class="gnb-menu" onclick="openDrawer()" aria-label="메뉴"><span></span><span></span><span></span></button>
</nav>

<div class="rgn-content">
  <div class="rgn-banner">
    <h2 id="rgnTitle">지역 지역방문 TIP!</h2>
    <div class="rgn-share">
      <button onclick="toast('페이스북 공유')">📘</button>
      <button onclick="toast('X(트위터) 공유')">✖️</button>
      <button onclick="toast('카카오톡 공유')">💬</button>
      <button onclick="toast('밴드 공유')">🎵</button>
      <button onclick="toast('링크가 복사되었습니다')">🔗</button>
    </div>
  </div>

  <div class="rgn-tip-card">
    <ol id="rgnTips"></ol>
    <div id="rgnFestivalWrap"></div>
    <div class="rgn-phone">*대표 문의번호: <strong id="rgnPhone">-</strong></div>
    <div class="rgn-mock-note" id="rgnMockNote" style="display:none">* 화면 기획용 예시 데이터입니다</div>
  </div>

  <div class="rgn-section">
    <div class="rgn-section-head">
      <h3>디지털 관광주민증 사용처 목록</h3>
    </div>
    <div class="rgn-cat-tabs">
      <button class="rgn-cat-tab active" data-cat="전체" onclick="setVenueFilter('전체')">전체</button>
      <button class="rgn-cat-tab" data-cat="식음료" onclick="setVenueFilter('식음료')">🍕 식음료</button>
      <button class="rgn-cat-tab" data-cat="관람" onclick="setVenueFilter('관람')">🎭 관람</button>
      <button class="rgn-cat-tab" data-cat="체험" onclick="setVenueFilter('체험')">🚀 체험</button>
    </div>
    <div class="rgn-sort">
      <span class="active" id="sortLatest" onclick="setSort('latest')">최신순</span>
      <span>|</span>
      <span id="sortPopular" onclick="setSort('popular')">인기순</span>
    </div>
    <div class="rgn-venue-grid" id="venueGrid"></div>
    <div class="rgn-empty" id="venueEmpty" style="display:none">해당 조건의 사용처가 없어요</div>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <button class="bnav-a" data-nav="main" onclick="location.href='main.html'">
    <div class="bnav-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg></div>
    메인
  </button>
  <button class="bnav-a" onclick="toast('검색 페이지')">
    <div class="bnav-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
    검색
  </button>
  <button class="bnav-a" onclick="location.href='event.html'">
    <div class="bnav-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20,12 20,22 4,22 4,12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 010-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 000-5C13 2 12 7 12 7z"/></svg></div>
    이벤트
  </button>
  <button class="bnav-a" onclick="toast('디민증 발급 페이지')">
    <div class="bnav-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/><line x1="6" y1="15" x2="9" y2="15"/></svg></div>
    디민증발급
  </button>
  <button class="bnav-a" data-nav="my" onclick="location.href='my.html'">
    <div class="bnav-ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>
    마이
  </button>
</nav>

<div class="drawer-overlay" id="dOverlay" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head"><span>메뉴</span><button class="drawer-close" onclick="closeDrawer()">✕</button></div>
  <nav class="drawer-nav">
    <div onclick="location.href='main.html'">🏠 메인홈</div>
    <div onclick="location.href='service-intro.html'">📋 서비스 소개</div>
    <div onclick="location.href='event.html'">🎁 이벤트</div>
    <div onclick="location.href='my.html'">🪪 나의 관광주민증</div>
    <div onclick="toast('FAQ 페이지');closeDrawer()">❓ 자주 묻는 질문</div>
    <div onclick="toast('공지사항 페이지');closeDrawer()">📢 공지사항</div>
  </nav>
  <div class="drawer-foot">
    <button class="btn-dk" onclick="logoutUser()">로그아웃</button>
    <button class="btn-lt" onclick="closeDrawer()">닫기</button>
  </div>
</aside>

<div class="toast" id="toastEl"></div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const CAT_STYLE={
  '식음료':{color:'#7c3aed',bg:'#f5f3ff'},
  '관람':{color:'#e11d48',bg:'#fff1f2'},
  '체험':{color:'#0d7b6d',bg:'#ecfdf5'}
};

const user=requireUser();
let currentFilter='전체';
let venues=[];

if(user){
  setActiveBottomNav('main');

  const params=new URLSearchParams(location.search);
  const name=params.get('r')||'';
  const sido=REGION_SIDO[name]||'';
  const gunLabel=name?regionGunLabel(name):'';
  document.getElementById('rgnTitle').innerHTML=name?`<em>${sido} ${gunLabel}</em> 지역방문 TIP!`:'지역방문 TIP!';

  const detail=getRegionDetail(name);
  const tipsEl=document.getElementById('rgnTips');
  detail.tips.forEach(t=>{
    const li=document.createElement('li');
    li.textContent=t;
    tipsEl.appendChild(li);
  });

  if(detail.festivals&&detail.festivals.length){
    const wrap=document.getElementById('rgnFestivalWrap');
    const box=document.createElement('div');
    box.className='rgn-festival';
    box.innerHTML=`<strong>${gunLabel} 주요 축제</strong>`+detail.festivals.map(f=>
      `<div>- ${f.name}(${f.month}) : ${f.date}</div>`
    ).join('');
    wrap.appendChild(box);
  }
  document.getElementById('rgnPhone').textContent=detail.phone;
  if(detail.mock)document.getElementById('rgnMockNote').style.display='block';

  venues=detail.venues;
  renderVenues();
}

function setVenueFilter(cat){
  currentFilter=cat;
  document.querySelectorAll('.rgn-cat-tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  renderVenues();
}
function setSort(kind){
  document.getElementById('sortLatest').classList.toggle('active',kind==='latest');
  document.getElementById('sortPopular').classList.toggle('active',kind==='popular');
  toast(kind==='latest'?'최신순으로 정렬':'인기순으로 정렬');
}
function renderVenues(){
  const grid=document.getElementById('venueGrid');
  const empty=document.getElementById('venueEmpty');
  grid.innerHTML='';
  const list=venues.filter(v=>currentFilter==='전체'||v.cat===currentFilter);
  empty.style.display=list.length?'none':'block';
  list.forEach(v=>{
    const style=CAT_STYLE[v.cat]||{color:'#555',bg:'#f5f5f5'};
    const card=document.createElement('div');
    card.className='rgn-venue-card';
    card.innerHTML=`
      <span class="rgn-venue-tag" style="color:${style.color};border-color:${style.color};background:${style.bg}">${v.cat}</span>
      <button class="rgn-venue-bkmk" onclick="toast('즐겨찾기에 추가되었습니다')">🔖</button>
      <div class="rgn-venue-name">${v.name}</div>
      <div class="rgn-venue-desc">${v.desc}</div>
      <div class="rgn-venue-discount">${v.discount}</div>
      <button class="rgn-venue-coupon" onclick="toast('${v.name} 쿠폰을 받았습니다')">🎫 쿠폰 받기</button>`;
    grid.appendChild(card);
  });
}
</script>
</body>
</html>
