<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>디지털관광주민증 - 계정 선택</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/common.css">
</head>
<body>

<nav class="gnb">
  <div class="gnb-left" onclick="location.href='main.html'">
    <div class="logo-wrap"><svg width="20" height="13" viewBox="0 0 20 13" fill="none"><circle cx="5" cy="6.5" r="4" stroke="#fff" stroke-width="1.5"/><circle cx="15" cy="6.5" r="4" stroke="#fff" stroke-width="1.5"/><path d="M1 6.5V4.5M19 6.5V4.5M9 6.5H11" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/></svg></div>
    <span class="gnb-title">디지털 관광주민증</span>
  </div>
</nav>

<div class="login-content">
  <p class="page-eyebrow">테스트 목업</p>
  <h1 class="page-title">계정을 선택하세요</h1>
  <p class="page-sub">로그인할 테스트 계정을 선택하면<br>해당 계정으로 이용할 수 있습니다.</p>
  <div id="accountList"></div>
  <div class="notice">
    <strong>💡 화면 기획용 목업</strong>
    로그인 → 메인(지도) → 마이페이지 → 경험치 현황<br>
    하단 탭과 메뉴로 화면을 이동할 수 있습니다
  </div>
</div>

<script src="assets/data.js"></script>
<script src="assets/common.js"></script>
<script>
const list=document.getElementById('accountList');
ACCOUNTS.forEach(a=>{
  const el=document.createElement('div');
  el.className='acct-card';
  el.innerHTML=`
    <div class="avatar" style="background:${a.avBg}">${a.emojiAv}</div>
    <div class="acct-info">
      <div class="acct-name">${a.name}님</div>
      <div class="level-pill" style="background:${a.pillBg};color:${a.pillColor}">${a.levelIcon} ${a.level}</div>
      <div class="exp-row"><span class="exp-text">경험치</span><span class="exp-val">${a.exp.toLocaleString()} / ${a.nextExp.toLocaleString()} EXP</span></div>
      <div class="exp-bar"><div class="exp-fill" style="width:${a.barPct}%;background:${a.barColor}"></div></div>
      <div class="cards-row">${a.cards.map(c=>`<span class="mini-card">${c}</span>`).join('')}</div>
    </div>
    <div class="acct-arrow">›</div>`;
  el.onclick=()=>{setUser(a.id);location.href='main.html';};
  list.appendChild(el);
});
</script>
</body>
</html>
