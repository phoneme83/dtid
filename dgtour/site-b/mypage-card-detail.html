<script>/* site-b 테스트: 경험치를 지역화폐 전환 가능 포인트와 연동 (초기 100만P, 전환분 차감 반영) */
try{var _pb=JSON.parse(localStorage.getItem("dtidB_pointBal2")||"{}");ACCOUNTS.forEach(function(a){a.exp=(typeof _pb[a.id]==="number")?_pb[a.id]:1000000;});var _u1=ACCOUNTS.filter(function(a){return a.id==="user1";})[0];if(_u1)_u1.name="김수지";}catch(e){}</script>
<script src="../assets/common.js?v=20260707f"></script>
<script>
const user=requireUser();
if(user){
  setActiveBottomNav('my');
  const params=new URLSearchParams(location.search);
  const region=params.get('r')||'';
  document.getElementById('pageTitle').textContent=region+' 관광주민증';
  document.getElementById('cardTitle').textContent=region+' 관광주민증';
  document.getElementById('cardRegion').textContent=region;
  document.getElementById('cardSlogan').textContent=getCardSlogan(region);
  document.getElementById('cardUserName').textContent=user.name;
  document.getElementById('cardGrade').textContent=user.levelIcon+' '+user.level;
  renderCardUseHistory(region);
}

/* 이 지역의 실제 이용내역(방문 기록)을 표시한다. 발급 개념 대신 이용 시점이 기준. */
function renderCardUseHistory(region){
  const short=String(region||'').replace(/(군|시|구)$/,'');
  const uses=getVisitLog('dtidB',user.id).filter(v=>v.region===short);
  document.getElementById('cardUseCount').textContent=uses.length;
  document.getElementById('cardLastUse').textContent=uses.length?uses[0].date:'이용 내역 없음';
  const wrap=document.getElementById('cardUseList');
  if(!uses.length){
    wrap.innerHTML='<div class="mypage-empty" style="padding:30px 0"><span class="ico">📭</span>'+
      '<p>이용내역이 없어요<br>가맹점에서 혜택을 사용하면 여기에 기록됩니다</p></div>';
    return;
  }
  wrap.innerHTML=uses.map(v=>
    '<div class="region-card-item" style="cursor:default">'+
      '<div class="rci-icon">🎟️</div>'+
      '<div class="rci-info"><div class="rci-name">'+(v.venue||'지역 혜택 이용')+'</div>'+
      '<div class="rci-status">'+v.date+'</div></div>'+
    '</div>').join('');
}
</script>
