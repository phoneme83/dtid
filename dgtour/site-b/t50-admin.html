<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>반값여행 지자체 관리시스템 · 시안 B</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#f1f5f9;color:#0f172a;-webkit-font-smoothing:antialiased}
.adm-top{background:#1e293b;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.adm-top .lg{background:#2563eb;border-radius:8px;font-size:12px;font-weight:800;padding:4px 9px}
.adm-top h1{font-size:17px;font-weight:800}
.adm-top .who{margin-left:auto;font-size:12.5px;color:#cbd5e1}
.adm-top a{color:#94a3b8;font-size:12.5px;text-decoration:underline}
.adm-note{background:#fef9c3;color:#713f12;font-size:12.5px;padding:8px 18px;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 60px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar select{min-height:44px;border:2px solid #cbd5e1;border-radius:10px;font-size:14.5px;font-weight:700;padding:6px 12px;font-family:inherit;background:#fff;color:#0f172a}
.bar .rf{margin-left:auto;display:flex;gap:8px}
.bar button{min-height:44px;border-radius:10px;border:2px solid #cbd5e1;background:#fff;font-size:13.5px;font-weight:700;padding:0 14px;font-family:inherit;cursor:pointer;color:#334155}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.st{background:#fff;border-radius:14px;padding:14px 16px;border:1px solid #e2e8f0}
.st .n{font-size:26px;font-weight:800;color:#2563eb}
.st .l{font-size:12.5px;font-weight:700;color:#64748b;margin-top:2px}
.card{background:#fff;border-radius:16px;border:1px solid #e2e8f0;padding:16px 18px;margin-bottom:12px}
.card .hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card .hd b{font-size:17px}
.card .hd .no{font-size:12.5px;font-weight:700;color:#2563eb}
.card .hd .bdg{margin-left:auto;font-size:12px;font-weight:800;border-radius:8px;padding:4px 10px}
.b-received{background:#e0f2fe;color:#075985}.b-review{background:#fef3c7;color:#92400e}
.b-approved{background:#dcfce7;color:#166534}.b-rejected{background:#fee2e2;color:#991b1b}
.b-notified{background:#dbeafe;color:#1d4ed8}.b-refund_req{background:#ede9fe;color:#5b21b6}
.b-refund_fix{background:#ffedd5;color:#9a3412}.b-refund_ok{background:#2563eb;color:#fff}
.card .dt{font-size:13.5px;color:#334155;margin-top:8px;line-height:1.7}
.card .dt small{color:#94a3b8}
.chk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chk span{font-size:12px;font-weight:700;border-radius:8px;padding:5px 10px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0}
.chk span.bad{background:#fef2f2;color:#991b1b;border-color:#fecaca}
.plan{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:10px 12px;font-size:13px;color:#475569;margin-top:10px;line-height:1.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.acts button{min-height:46px;border-radius:10px;font-size:14px;font-weight:800;padding:0 16px;font-family:inherit;cursor:pointer;border:2px solid #2563eb;background:#2563eb;color:#fff}
.acts button.ln{background:#fff;color:#2563eb}
.acts button.bad{border-color:#b91c1c;background:#fff;color:#b91c1c}
.acts .wait{font-size:13px;color:#64748b;font-weight:700;align-self:center}
.rsn{width:100%;margin-top:10px;border:2px solid #cbd5e1;border-radius:10px;font-size:14px;padding:10px 12px;font-family:inherit;min-height:64px;display:none}
.rsn.on{display:block}
.log{margin-top:10px;font-size:12px;color:#94a3b8;line-height:1.7;border-top:1px dashed #e2e8f0;padding-top:8px}
.empty{text-align:center;color:#64748b;font-size:15px;padding:60px 0;line-height:1.8}
.empty a{color:#2563eb;font-weight:800}
.toastA{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.9);color:#fff;font-size:13.5px;font-weight:700;border-radius:24px;padding:11px 20px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;z-index:99}
.toastA.on{opacity:1}
/* 대시보드 타일 필터 + 상세조회 */
.st{cursor:pointer;transition:.12s}
.st:hover{border-color:#2563eb}
.st.on{background:#eff6ff;border-color:#2563eb;box-shadow:0 0 0 1px #2563eb inset}
.st .l{user-select:none}
.card .hd .dtl{margin-left:auto;min-height:36px;border:1.5px solid #cbd5e1;border-radius:8px;background:#fff;color:#334155;font-size:12px;font-weight:800;padding:0 12px;font-family:inherit;cursor:pointer}
.card .hd .dtl:hover{border-color:#2563eb;color:#2563eb}
.card .hd .bdg{margin-left:8px}
.adm-dtl{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:120;display:none;align-items:center;justify-content:center;padding:20px}
.adm-dtl.on{display:flex}
.adm-dtl .body{background:#fff;border-radius:16px;max-width:520px;width:100%;max-height:82vh;overflow-y:auto;padding:20px 22px}
.adm-dtl .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.adm-dtl .hd b{font-size:16px}
.adm-dtl .hd button{border:none;background:none;font-size:20px;color:#94a3b8;cursor:pointer}
.adm-dtl .dsec{font-size:12.5px;font-weight:800;color:#2563eb;margin:14px 0 4px;border-bottom:1px solid #e2e8f0;padding-bottom:4px}
.adm-dtl .drow{display:flex;justify-content:space-between;gap:14px;font-size:13.5px;padding:5px 0;border-bottom:1px dashed #f1f5f9}
.adm-dtl .drow span{color:#64748b;flex-shrink:0}
.adm-dtl .drow b{text-align:right;color:#0f172a;font-weight:700;word-break:break-all}
</style>
</head>
<body>

<div class="adm-top">
  <span class="lg">관리</span>
  <h1>대한민국 반값여행 · 지자체 관리시스템</h1>
  <span class="who">담당자: 지자체 심사자(모의)</span>
  <a href="t50-apply.html">← 대민시스템(신청자 화면)</a>
  <a href="t50-pay.html">지역화폐(앱)</a>
</div>
<div class="adm-note">⚠ 프로토타입: 공사(대민시스템)에서 접수된 통합신청 건을 지자체가 심사하는 화면입니다. 처리 결과(승인/반려·결과통보·환급심사)는 신청자 화면의 "나의 신청 내역"에 즉시 반영됩니다.</div>

<div class="wrap">
  <div class="bar">
    <select id="admRegion" onchange="admRender()"><option value="">전체 지자체</option></select>
    <select id="admStatus" onchange="admRender()">
      <option value="">전체 상태</option>
      <option value="received">접수 대기</option>
      <option value="review">검토중</option>
      <option value="appr2">승인 (통보 포함)</option>
      <option value="rejected">반려</option>
      <option value="refund2">환급 심사</option>
      <option value="refund_ok">환급 완료</option>
    </select>
    <div class="rf">
      <button onclick="admRender()">↻ 새로고침</button>
      <button onclick="admReset()">데모 데이터 초기화</button>
    </div>
  </div>
  <div class="stats" id="admStats"></div>
  <div id="admList"></div>
</div>

<div class="toastA" id="admToast"></div>

<!-- 신청 건 상세조회 -->
<div class="adm-dtl" id="admDtl" role="dialog" aria-modal="true">
  <div class="body">
    <div class="hd"><b id="admDtlTitle">상세조회</b><button onclick="admDtlClose()" aria-label="닫기">✕</button></div>
    <div id="admDtlBody"></div>
  </div>
</div>

<script src="../site-assets/data.js?v=20260707f"></script>
<script>/* site-b 테스트: 경험치를 지역화폐 전환 가능 포인트와 연동 (초기 100만P, 전환분 차감 반영) */
try{var _pb=JSON.parse(localStorage.getItem("dtidB_pointBal2")||"{}");ACCOUNTS.forEach(function(a){a.exp=(typeof _pb[a.id]==="number")?_pb[a.id]:1000000;});var _u1=ACCOUNTS.filter(function(a){return a.id==="user1";})[0];if(_u1)_u1.name="김관광";}catch(e){}</script>
<script>
/* 대민시스템(t50-apply.html)과 같은 저장소를 공유한다.
   신청 데이터는 계정별 키(dtidB_t50Applies_<uid>)로 분리 저장되며, 관리시스템은 전 계정을 집계한다 */
const AP_PREFIX='dtidB_t50Applies_';
const ADM_ST={
  received:'접수 대기',review:'검토중',approved:'승인 (통보 대기)',rejected:'반려',
  notified:'결과 통보 완료',refund_req:'환급 심사 대기',refund_fix:'증빙 보완 요청',refund_ok:'환급 완료'
};
const ADM_ADDR='강원특별자치도 춘천시 (신청자 주민등록상 주소지)';
let admToastTimer=null;

function admKeys(){
  const ks=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&(k.indexOf(AP_PREFIX)===0||k==='dtidB_t50Applies'))ks.push(k);
  }
  return ks;
}
function admLoadKey(k){try{return JSON.parse(localStorage.getItem(k)||'[]');}catch(e){return[];}}
function admSaveKey(k,l){localStorage.setItem(k,JSON.stringify(l));}
/* 전 계정 신청 건 집계: [{k:저장키, i:키 내 index, a:신청}] */
function admLoadAll(){
  const out=[];
  admKeys().forEach(function(k){
    admLoadKey(k).forEach(function(a,i){out.push({k:k,i:i,a:a});});
  });
  return out;
}
function admUid(k){return k===('dtidB_t50Applies')?'(공용)':k.slice(AP_PREFIX.length);}
function admToast(m){
  const t=document.getElementById('admToast');
  t.textContent=m;t.classList.add('on');
  clearTimeout(admToastTimer);
  admToastTimer=setTimeout(()=>t.classList.remove('on'),2200);
}
function admFmt(d){return d?d.replace(/-/g,'.'):'';}
function admAmt(a){return (a.people==='6'?6:Number(a.people))*50000;}
function admWon(n){return n.toLocaleString('ko-KR')+'원';}

function admRegionOpts(all){
  const sel=document.getElementById('admRegion');
  const regions=[...new Set(all.map(x=>x.a.region))];
  const cur=sel.value;
  sel.innerHTML='<option value="">전체 지자체</option>'+regions.map(r=>'<option value="'+r+'"'+(r===cur?' selected':'')+'>'+r+'</option>').join('');
}

/* 상태 필터: 대시보드 숫자 타일 클릭 ↔ 셀렉트 동기화. appr2/refund2는 복합 상태 */
const ADM_ST_GROUP={appr2:['approved','notified'],refund2:['refund_req','refund_fix']};
function admStatuses(key){return key?(ADM_ST_GROUP[key]||[key]):null;}
function admTile(key){
  const s=document.getElementById('admStatus');
  s.value=(s.value===key?'':key);   /* 같은 타일 재클릭 시 필터 해제 */
  admRender();
}
function admStats(list){
  const cur=document.getElementById('admStatus').value;
  const c=k=>list.filter(a=>a.status===k).length;
  function tile(key,n,label){
    return '<div class="st'+(cur===key?' on':'')+'" role="button" tabindex="0" onclick="admTile(\''+key+'\')" '+
      'onkeydown="if(event.key===\'Enter\')admTile(\''+key+'\')" title="클릭하면 해당 단계 목록만 표시">'+
      '<div class="n">'+n+'</div><div class="l">'+label+' ›</div></div>';
  }
  document.getElementById('admStats').innerHTML=
    tile('received',c('received'),'접수 대기')+
    tile('review',c('review'),'검토중')+
    tile('appr2',c('approved')+c('notified'),'승인')+
    tile('rejected',c('rejected'),'반려')+
    tile('refund2',c('refund_req')+c('refund_fix'),'환급 심사')+
    tile('refund_ok',c('refund_ok'),'환급 완료');
}

function admRender(){
  const all=admLoadAll();
  admRegionOpts(all);
  admStats(all.map(x=>x.a));
  const rg=document.getElementById('admRegion').value;
  const stArr=admStatuses(document.getElementById('admStatus').value);
  const list=all.filter(x=>(!rg||x.a.region===rg)&&(!stArr||stArr.indexOf(x.a.status)>=0));
  const el=document.getElementById('admList');
  if(!list.length){
    el.innerHTML='<div class="empty">표시할 신청 건이 없습니다.<br><a href="t50-apply.html">신청자 화면(대민시스템)</a>에서 먼저 통합신청을 접수해 보세요.</div>';
    return;
  }
  el.innerHTML=list.map(x=>{
    const a=x.a,i=x.i,k=x.k;
    const K="'"+k+"',"+i;                     /* onclick 인자: 저장키+인덱스 */
    const rid='rsn_'+admUid(k)+'_'+i;
    const amt=a.amount||admAmt(a);
    /* 자격 자동 점검: 관외거주(주소지 시·도 ≠ 신청 지역 시·도), 여행기간 적합(접수 시 검증됨) */
    const chk='<div class="chk"><span>✔ 관외거주 충족 — 주소지 '+(a.addr?a.addr.split(' ')[0]:'강원')+' / 신청지 '+a.sido+'</span>'+
      (a.period?'<span>✔ 여행기간 적합 — 가능기간('+admFmt(a.period.s)+'~'+admFmt(a.period.e)+') 내 일정</span>':'')+
      (a.youth?'<span>🎉 청년(만 19~34세) — 환급 20% 추가 대상</span>':'')+'</div>';
    let acts='',log='';
    if(a.status==='received')
      acts='<button onclick="admDo('+K+',\'review\')">검토 시작</button>';
    else if(a.status==='review'){
      const base=admAmt(a),bonus=a.youth?Math.round(base*0.2):0;
      acts='<button onclick="admApprove('+K+')">✅ 승인 — 지원금 '+admWon(base+bonus)+(bonus?' (기본 '+admWon(base)+' + 청년 20% '+admWon(bonus)+')':'')+'</button>'+
        '<button class="bad" onclick="admRsn('+K+',\'rejected\',\''+rid+'\')">⛔ 반려</button>'+
        '<textarea class="rsn" id="'+rid+'" placeholder="반려 사유를 입력하세요 (예: 신청자격 미충족, 여행 계획 불명확)"></textarea>';
    }
    else if(a.status==='approved')
      acts='<button onclick="admDo('+K+',\'notified\')">📨 결과 통보 발송 — CI·승인 금액을 대민시스템/지역화폐로 전달</button>';
    else if(a.status==='notified')
      acts='<span class="wait">여행 진행 — 신청자의 증빙 작성·환급 신청을 기다리는 중</span>';
    else if(a.status==='refund_req')
      acts=(a.evidence
        ?'<div class="plan">🧾 제출 증빙자료 — 카드번호 '+a.evidence.card+' · 승인번호 '+a.evidence.appr+' · 결재금액 '+admWon(a.evidence.amt)+(a.evidence.date?' · 결제일 '+a.evidence.date:'')+' · 첨부 '+a.evidence.file+'<br><b style="color:#2563eb">✓ 영수증 OCR 판독 결과와 대조 일치'+(a.evidence.date?' · 결제일 여행기간('+a.start+'~'+a.end+') 내 확인':'')+' (공사 대민시스템 검증 완료)</b></div>'
        :'<div class="plan">🧾 제출 증빙(모의): 지역화폐 결재내역 '+(a.people||1)+'건 · 사용액 '+admWon(amt*2)+' · CI 대조 일치</div>')+
        '<button onclick="admRefundOk('+K+')">💰 환급 승인 — '+admWon(amt)+' 충전 지시'+(a.bonus?' (청년 20% 포함)':'')+'</button>'+
        '<button class="bad" onclick="admRsn('+K+',\'refund_fix\',\''+rid+'\')">✏️ 증빙 보완 요청</button>'+
        '<textarea class="rsn" id="'+rid+'" placeholder="보완 요청 사유를 입력하세요 (예: 숙박 결재내역 누락)"></textarea>';
    else if(a.status==='refund_fix')
      acts='<span class="wait">신청자 증빙 보완 대기중</span>';
    else if(a.status==='refund_ok')
      acts='<span class="wait">처리 완료 — 환급 금액이 지역화폐(앱)에 충전되었습니다</span>';
    else if(a.status==='rejected')
      acts='<span class="wait">반려 처리 완료</span>';
    if(a.rejectReason)log+='반려 사유: '+a.rejectReason+'<br>';
    if(a.fixReason)log+='보완 요청 사유: '+a.fixReason+'<br>';
    if(a.amount)log+='승인 지원금: '+admWon(a.amount);
    return '<div class="card">'+
      '<div class="hd"><b>'+a.region+'</b><span class="no">'+a.no+'</span><span>신청자 '+(a.applicant||'김관광')+' <small style="color:#94a3b8">(계정 '+(a.uid||admUid(k))+')</small></span>'+
      '<button class="dtl" onclick="admDetail('+K+')">상세조회</button>'+
      '<span class="bdg b-'+a.status+'">'+ADM_ST[a.status]+'</span></div>'+
      '<div class="dt">여행 '+admFmt(a.start)+' ~ '+admFmt(a.end)+' · '+a.people+'명 · 신청일 '+a.ts+
      '<br><small>'+(a.addr?a.addr+' (주민등록상 주소지 · 시·군·구 단위)':ADM_ADDR)+'</small></div>'+chk+
      (a.plan?'<div class="plan">여행 계획: '+a.plan+'</div>':'')+
      '<div class="acts">'+acts+'</div>'+(log?'<div class="log">'+log+'</div>':'')+
      '</div>';
  }).join('');
}

function admDo(k,i,st){
  const l=admLoadKey(k);if(!l[i])return;
  l[i].status=st;admSaveKey(k,l);admRender();
  admToast(ADM_ST[st]+' 처리했습니다');
}
function admApprove(k,i){
  const l=admLoadKey(k);if(!l[i])return;
  /* 청년(만 19~34세)은 승인 시점부터 지원금에 20% 가산 */
  const base=admAmt(l[i]);
  const bonus=l[i].youth?Math.round(base*0.2):0;
  l[i].status='approved';l[i].baseAmount=base;l[i].bonus=bonus;l[i].amount=base+bonus;
  admSaveKey(k,l);admRender();
  admToast('승인 — 지원금 '+admWon(base+bonus)+(bonus?' (청년 20% 포함)':''));
}
function admRsn(k,i,st,rid){
  const ta=document.getElementById(rid);
  if(!ta.classList.contains('on')){ta.classList.add('on');ta.focus();return;}
  const v=ta.value.trim();
  if(!v){admToast('사유를 입력해 주세요');ta.focus();return;}
  const l=admLoadKey(k);if(!l[i])return;
  l[i].status=st;
  if(st==='rejected')l[i].rejectReason=v;else l[i].fixReason=v;
  admSaveKey(k,l);admRender();
  admToast(st==='rejected'?'반려 처리했습니다':'보완 요청을 보냈습니다');
}
function admRefundOk(k,i){
  const l=admLoadKey(k);if(!l[i])return;
  /* 환급액 = 승인 지원금 (청년 20%는 승인 시 이미 가산되어 있음 — 이중 가산 금지) */
  l[i].status='refund_ok';l[i].refundAmount=l[i].amount||admAmt(l[i]);
  admSaveKey(k,l);admRender();
  admToast('환급 승인 — '+admWon(l[i].refundAmount)+' 충전 지시'+(l[i].bonus?' (청년 20% 포함)':''));
}
/* 신청 건 상세조회 모달 */
function admDetail(k,i){
  const a=admLoadKey(k)[i];if(!a)return;
  const won=v=>(typeof v==='number'?v.toLocaleString('ko-KR')+'원':'-');
  function row(l,v){return '<div class="drow"><span>'+l+'</span><b>'+(v||'-')+'</b></div>';}
  let h='<div class="dsec">신청 정보</div>'+
    row('접수번호',a.no)+row('상태','<span class="bdg b-'+a.status+'">'+ADM_ST[a.status]+'</span>')+
    row('신청자',(a.applicant||'-')+' (계정 '+(a.uid||admUid(k))+')')+
    row('신청 지역',a.region+' ('+a.sido+')')+
    row('여행 기간',admFmt(a.start)+' ~ '+admFmt(a.end)+' · '+a.people+'명')+
    (a.period?row('지역 여행 가능기간',admFmt(a.period.s)+' ~ '+admFmt(a.period.e)):'')+
    row('신청일',a.ts)+
    row('주민등록상 주소지',(a.addr||'-')+' (시·군·구 단위)')+
    (a.plan?row('여행 계획',a.plan):'')+
    '<div class="dsec">자격 점검</div>'+
    row('관외거주','충족 — 주소지 '+(a.addr?a.addr.split(' ')[0]:'-')+' / 신청지 '+a.sido)+
    row('청년(만 19~34세)',a.youth?'해당 — 지원금 20% 가산 대상':'해당 없음')+
    '<div class="dsec">지원금</div>'+
    row('기본 지원금',won(a.baseAmount||(a.amount&&!a.bonus?a.amount:undefined)))+
    row('청년 가산(20%)',a.bonus?won(a.bonus):'-')+
    row('승인 지원금',won(a.amount))+
    row('환급 금액',won(a.refundAmount));
  if(a.evidence){
    h+='<div class="dsec">제출 증빙자료</div>'+
      row('카드번호',a.evidence.card)+row('승인번호',a.evidence.appr)+
      row('결재금액',won(a.evidence.amt))+
      (a.evidence.date?row('결제일',a.evidence.date+' (여행기간 '+a.start+'~'+a.end+' 내 ✓)'):'')+
      row('첨부파일',a.evidence.file)+
      row('OCR 대조','✓ 영수증 판독 결과와 일치 (공사 대민시스템 검증)');
  }
  if(a.rejectReason)h+='<div class="dsec">반려</div>'+row('반려 사유',a.rejectReason);
  if(a.fixReason)h+='<div class="dsec">증빙 보완</div>'+row('보완 요청 사유',a.fixReason);
  document.getElementById('admDtlBody').innerHTML=h;
  document.getElementById('admDtlTitle').textContent=a.region+' · '+a.no;
  document.getElementById('admDtl').classList.add('on');
}
function admDtlClose(){document.getElementById('admDtl').classList.remove('on');}

function admReset(){
  if(!confirm('전 계정의 신청 데모 데이터를 모두 삭제할까요?'))return;
  admKeys().forEach(function(k){localStorage.removeItem(k);});
  admRender();admToast('초기화했습니다');
}

/* 신청자 화면(다른 탭)에서 접수하면 자동 갱신 */
window.addEventListener('storage',function(e){if(e.key&&(e.key.indexOf(AP_PREFIX)===0||e.key==='dtidB_t50Applies'))admRender();});
admRender();
</script>
