<script>/* site-e 테스트: 경험치를 지역화폐 전환 가능 포인트와 연동 (초기 100만P, 전환분 차감 반영) */
try{var _pb=JSON.parse(localStorage.getItem("dtidE_pointBal2")||"{}");ACCOUNTS.forEach(function(a){a.exp=(typeof _pb[a.id]==="number")?_pb[a.id]:1000000;});var _u1=ACCOUNTS.filter(function(a){return a.id==="user1";})[0];if(_u1)_u1.name="김수지";}catch(e){}</script>
<script src="../assets/common.js?v=20260707f"></script>
<script>
const user=requireUser();
const DO_TABS=['전체','강원','경기','경남','경북','광주','부산','인천','전북','충남','충북'];
let cardDoFilter='전체';

if(user){
  setActiveBottomNav('my');
  document.getElementById('doTabs').innerHTML=DO_TABS.map(t=>
    `<button class="mypage-sub-tab${t==='전체'?' active':''}" onclick="setCardDoFilter('${t}',this)">${t}</button>`
  ).join('');
  renderPocket();
}

function setCardDoFilter(t,btn){
  cardDoFilter=t;
  document.querySelectorAll('#doTabs .mypage-sub-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderPocket();
}

function renderPocket(){
  const grid=document.getElementById('pocketGrid');
  /* 보관함 = 실제로 혜택을 이용한 "방문한 지역" (발급 지역이 아니라 이용내역 기준) */
  const list=getVisitedRegions('dtidE',user.id).filter(c=>cardDoFilter==='전체'||c.startsWith(cardDoFilter));
  grid.innerHTML=list.map(c=>{
    const region=c.split(' ').pop();
    return `<div class="pocket-card" onclick="location.href='mypage-card-detail.html?r=${encodeURIComponent(region)}'">
      <div class="em">${CARD_ICONS[c]||'📍'}</div>
      <div class="nm">${region}</div>
    </div>`;
  }).join('')||'<div class="mypage-empty" style="padding:30px 0;grid-column:1/-1">'+
    '<span class="ico">🗺️</span><p>아직 방문한 지역이 없어요<br>지역 혜택을 사용하면 여기에 쌓입니다</p></div>';
}
</script>
